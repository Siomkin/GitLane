<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where a write failure gets its error kind</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 920px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Typed write errors · Before / after</p>
    <h1>Where a write failure gets its error kind</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 920 550" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="write-error-kinds-title write-error-kinds-desc">
        <title id="write-error-kinds-title">Where a write failure gets its error kind</title>
        <desc id="write-error-kinds-desc">Before, a stale lease or an already-a-repository failure left discard and init as a String, went through the command's blocking conversion, and got its kind from classify_failure's regexes over the text; discard.rs also re-read the text with error.ends_with(STALE_SUFFIX). After, the producer returns WriteError::stale or WriteError::AlreadyARepository, and From&lt;WriteError&gt; for CommandError sets the kind by matching on the variant, with no text matching. git's own stderr and untyped messages become WriteError::Git and still go through the unchanged classify_failure.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
        <text x="40" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">BEFORE · A LEASE OR ALREADY-A-REPOSITORY FAILURE</text>
        <rect x="40" y="96" width="170" height="70" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="125" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">discard / init</text>
        <text x="125" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Err(String)</text>
        <text x="125" y="147" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">… Refresh and try again.</text>
        <text x="125" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">… already a Git repository.</text>
        <line x1="210" y1="131" x2="261" y2="131" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="265" y="96" width="170" height="70" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="350" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Command blocking()</text>
        <text x="350" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">E: Into&lt;CommandError&gt;</text>
        <text x="350" y="147" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">From&lt;String&gt;</text>
        <line x1="435" y1="131" x2="486" y2="131" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="490" y="96" width="170" height="70" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="575" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">classify_failure</text>
        <text x="575" y="134" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">regexes over the text:</text>
        <text x="575" y="147" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auth, network, index.lock,</text>
        <text x="575" y="160" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">suffix, conflict, hook …</text>
        <line x1="660" y1="131" x2="711" y2="131" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="715" y="96" width="170" height="70" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="800" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CommandError</text>
        <text x="800" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">staleLease</text>
        <text x="800" y="147" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git + alreadyARepository</text>
        <rect x="40" y="182" width="395" height="44" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="237.5" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">discard.rs re-reads the text</text>
        <text x="237.5" y="220" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">error.ends_with(STALE_SUFFIX)</text>
        <text x="40" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">AFTER · THE PRODUCER SETS THE KIND</text>
        <rect x="40" y="276" width="170" height="70" rx="6" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="125" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">discard / init</text>
        <text x="125" y="314" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WriteError::stale(..)</text>
        <text x="125" y="327" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AlreadyARepository(..)</text>
        <line x1="210" y1="311" x2="261" y2="311" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="265" y="276" width="170" height="70" rx="6" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="350" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">From&lt;WriteError&gt;</text>
        <text x="350" y="314" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">for CommandError</text>
        <text x="350" y="327" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">match on the variant</text>
        <line x1="435" y1="311" x2="711" y2="311" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="521" y="294" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="573" y="303" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO TEXT MATCHING</text>
        <rect x="715" y="276" width="170" height="70" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="800" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CommandError</text>
        <text x="800" y="314" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">staleLease</text>
        <text x="800" y="327" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git + alreadyARepository</text>
        <rect x="40" y="368" width="170" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="125" y="390" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">git's own stderr</text>
        <text x="125" y="406" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">and untyped messages</text>
        <line x1="210" y1="398" x2="261" y2="398" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="265" y="368" width="170" height="60" rx="6" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="350" y="390" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WriteError::Git</text>
        <text x="350" y="406" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(String)</text>
        <line x1="435" y1="398" x2="486" y2="398" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="490" y="368" width="170" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="575" y="390" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">classify_failure</text>
        <text x="575" y="406" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unchanged</text>
        <line x1="660" y1="398" x2="711" y2="398" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="715" y="368" width="170" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="800" y="390" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CommandError</text>
        <text x="800" y="406" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auth · network · conflict …</text>
        <text x="40" y="456" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Pilot: discard_file (snapshot, semantics, discard: ends_with becomes a match) and lifecycle/init. Commands and the wire format are unchanged.</text>
        <text x="40" y="470" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Unmigrated modules still return String; String ⇄ WriteError conversions keep them compiling and classified exactly as before.</text>
        <text x="40" y="484" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">tests/error_kinds.rs pins kind, code and message for four failures; they passed before the migration and still do.</text>
        <line x1="40" y1="500" x2="880" y2="500" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="526" width="14" height="10" rx="2" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="62" y="534" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Added in this change</text>
        <rect x="200" y="526" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="222" y="534" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Unchanged</text>
        <rect x="320" y="526" width="14" height="10" rx="2" fill="#ffffff" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="342" y="534" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Kind read from message text (before)</text>
        <line x1="560" y1="532" x2="588" y2="532" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="596" y="534" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Typed path</text>
      </svg>
    </div>
  </div>
</body>
</html>
