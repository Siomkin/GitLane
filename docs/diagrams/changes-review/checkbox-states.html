<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a stage checkbox shows itself</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Changes review · State machine</p>
    <h1>How a stage checkbox shows itself</h1>
    <div class="diagram-container">
      <svg viewBox="0 110 1000 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="checkbox-states-title checkbox-states-desc">
        <title id="checkbox-states-title">How a stage checkbox shows itself</title>
        <desc id="checkbox-states-desc">An unchecked stage checkbox is hidden while idle, with its space reserved. Moving the pointer onto its row or tabbing onto it reveals a grey outline, and leaving or blurring hides it again. Clicking a revealed box stages or includes the file and the box becomes checked: a faint accent tint with an accent outline and check. Clicking a checked box unstages it and returns it to revealed. A folder or header with some files included is mixed, the same tint with a dash, and clicking it includes all. A disabled box is revealed dimmed, with its reason as the tooltip, and ignores clicks.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect y="110" width="100%" height="100%" fill="#f5f5f5"/>
        <rect y="110" width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- NODE: Hidden (new) -->
        <rect x="52" y="150" width="170" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="52" y="150" width="170" height="104" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="125" y="166" width="24" height="24" rx="7" fill="none" stroke="rgba(45,49,66,0.18)" stroke-width="1" stroke-dasharray="2,3"/>
        <text x="137" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hidden</text>
        <text x="137" y="229" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unchecked · idle</text>
        <text x="137" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">space reserved</text>

        <!-- NODE: Revealed -->
        <rect x="392" y="150" width="170" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="392" y="150" width="170" height="104" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="465" y="166" width="24" height="24" rx="7" fill="#f5f5f5" stroke="rgba(45,49,66,0.45)" stroke-width="2"/>
        <text x="477" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Revealed</text>
        <text x="477" y="229" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">unchecked · row hover</text>
        <text x="477" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">or keyboard focus</text>

        <!-- NODE: Checked (new) -->
        <rect x="732" y="150" width="170" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="732" y="150" width="170" height="104" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="805" y="166" width="24" height="24" rx="7" fill="rgba(46,158,98,0.10)" stroke="rgba(46,158,98,0.40)" stroke-width="2"/>
        <path d="M 811 178 L 815.5 182.5 L 823 173.5" fill="none" stroke="#2e9e62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="817" y="214" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Checked</text>
        <text x="817" y="229" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10% accent tint</text>
        <text x="817" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">40% outline · accent check</text>

        <!-- NODE: Mixed (new) -->
        <rect x="732" y="350" width="170" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="732" y="350" width="170" height="104" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="805" y="366" width="24" height="24" rx="7" fill="rgba(46,158,98,0.10)" stroke="rgba(46,158,98,0.40)" stroke-width="2"/>
        <line x1="811" y1="378" x2="823" y2="378" stroke="#2e9e62" stroke-width="2.4" stroke-linecap="round"/>
        <text x="817" y="414" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mixed</text>
        <text x="817" y="429" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">folder or header</text>
        <text x="817" y="442" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">same tint · accent dash</text>

        <!-- TRANSITIONS -->
        <line x1="222" y1="186" x2="390" y2="186" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="392" y1="220" x2="224" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="562" y1="186" x2="730" y2="186" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="732" y1="220" x2="564" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="817" y1="350" x2="817" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- TRANSITION LABELS (masked) -->
        <rect x="232" y="168" width="148" height="12" rx="2" fill="#f5f5f5"/>
        <text x="306" y="177" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POINTER ON ROW · TAB</text>

        <rect x="240" y="226" width="132" height="12" rx="2" fill="#f5f5f5"/>
        <text x="306" y="235" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POINTER LEAVES · BLUR</text>

        <rect x="572" y="168" width="148" height="12" rx="2" fill="#f5f5f5"/>
        <text x="646" y="177" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLICK · STAGE / INCLUDE</text>

        <rect x="572" y="226" width="148" height="12" rx="2" fill="#f5f5f5"/>
        <text x="646" y="235" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLICK · UNSTAGE / EXCLUDE</text>

        <rect x="825" y="296" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="829" y="305" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CLICK · INCLUDE ALL</text>

        <!-- WHERE USED -->
        <rect x="52" y="350" width="510" height="104" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="68" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">WHERE THE BOX APPEARS</text>
        <text x="68" y="394" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Review all · each file row (now the shared checkbox, no green "✓")</text>
        <text x="68" y="412" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Include view · "Changes (N)" header, folder rows, file rows</text>
        <text x="68" y="430" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Include diff · one box per difference (revealed by hovering the box)</text>
        <text x="68" y="446" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">TriStateCheckbox.tsx</text>

        <!-- FOOTNOTE -->
        <text x="52" y="486" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">A disabled box (staging blocked during an operation, or a change the Include view can't apply) is revealed at 45% opacity, shows its reason as the tooltip, and ignores clicks.</text>
        <text x="52" y="500" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Checkbox colours follow the app accent setting (default green shown). The Staging area's Stage / Unstage buttons are unchanged.</text>

        <!-- LEGEND -->
        <line x1="52" y1="520" x2="948" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="52" y="538" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="120" y="530" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="140" y="538" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">New look in this change</text>
        <line x1="270" y1="536" x2="298" y2="536" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="306" y="538" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">User action</text>
      </svg>
    </div>
  </div>
</body>
</html>
