<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Every as cast now says whether it is lossless or saturating</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 920px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Rust as_conversions · Decision flow</p>
    <h1>Every as cast now says whether it is lossless or saturating</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 920 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="as-conversions-title as-conversions-desc">
        <title id="as-conversions-title">Every as cast now says whether it is lossless or saturating</title>
        <desc id="as-conversions-desc">clippy::as_conversions was measured with one clippy pass per build: 80 hits in the desktop build and 72 in the agent build, all also in desktop, plus 3 Windows-only casts found by grep. The lint is now warn in Cargo.toml and CI fails on any new as. Of the 83 casts, 65 usize to u64 conversions go through the new helper u64_from_usize, which gives the same bits on every target, including the length prefixes inside fingerprint hashes. 8 use a lossless std form: From, cast_signed or addr. 9 narrowing casts use try_from with a saturating fallback, which differs from as only past ranges no real input reaches. 1, the git2 Delta status in a lease hash, is an explicit match to the same bytes as its old discriminants, pinned by a unit test.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <text x="40" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ADOPT · ONE CLIPPY PASS PER BUILD, THEN THE LINT GOES ON</text>
        <rect x="40" y="96" width="250" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="165.0" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Measured hits</text>
        <text x="165.0" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">-W clippy::as_conversions</text>
        <text x="165.0" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">desktop: 80 · agent: 72 (subset)</text>
        <text x="165.0" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ 3 Windows-only, found by grep</text>
        <line x1="290" y1="144" x2="333" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="337" y="96" width="250" height="96" rx="6" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="462.0" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lint on</text>
        <text x="462.0" y="140" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Cargo.toml [lints.clippy]</text>
        <text x="462.0" y="154" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">as_conversions = "warn"</text>
        <text x="462.0" y="168" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CI: clippy -D warnings</text>
        <line x1="587" y1="144" x2="631" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="635" y="96" width="250" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="760.0" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Replacement rule</text>
        <text x="760.0" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">narrowest correct form per cast</text>
        <text x="760.0" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lossless → same bits</text>
        <text x="760.0" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">narrowing → saturate</text>
        <text x="40" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">RESOLVE · HOW THE 83 CASTS WERE REPLACED</text>
        <rect x="40" y="262" width="195" height="130" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="137.5" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">u64_from_usize · 65</text>
        <text x="137.5" y="306" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">usize → u64, new num.rs</text>
        <text x="137.5" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lengths, take() limits,</text>
        <text x="137.5" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hashed length prefixes</text>
        <text x="137.5" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">same bits on every target</text>
        <rect x="257" y="262" width="195" height="130" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="354.5" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lossless std form · 8</text>
        <text x="354.5" y="306" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">From: u8 → char ×2</text>
        <text x="354.5" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">From: u32 → u64 ×2</text>
        <text x="354.5" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">From: i32 → f64 ×1</text>
        <text x="354.5" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cast_signed(): epoch days</text>
        <text x="354.5" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">addr(): HINSTANCE ×2</text>
        <rect x="474" y="262" width="195" height="130" rx="6" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="571.5" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">try_from, saturating · 9</text>
        <text x="571.5" y="306" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">read caps ×2 → usize::MAX</text>
        <text x="571.5" y="320" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">capacity hints ×2 → 0</text>
        <text x="571.5" y="334" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">line number → u32::MAX</text>
        <text x="571.5" y="348" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">index stage → 255</text>
        <text x="571.5" y="362" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">progress ×2 → 100</text>
        <text x="571.5" y="376" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">patch origin byte</text>
        <rect x="690" y="262" width="195" height="130" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="787.5" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Explicit match · 1</text>
        <text x="787.5" y="306" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git2::Delta → fixed byte</text>
        <text x="787.5" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">= old discriminant 0..=10</text>
        <text x="787.5" y="334" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pinned by a unit test</text>
        <text x="40" y="420" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Saturating fixes only differ from as past ranges no real input reaches; hashed fingerprint bytes are unchanged for every real input.</text>
        <text x="40" y="434" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Five cast_* expectations from rust-lints-dry-run went away with their casts. Read limits of n + 1 use saturating_add. The two addr() and one u32 → u64 fixes compile only on Windows.</text>
        <line x1="40" y1="452" x2="885" y2="452" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="468" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="478" width="14" height="10" rx="2" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="62" y="486" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">New lint config or not bit-identical</text>
        <rect x="260" y="478" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="282" y="486" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step or bit-identical replacement</text>
      </svg>
    </div>
  </div>
</body>
</html>
