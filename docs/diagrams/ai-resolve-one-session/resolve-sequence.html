<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resolve all conflicts in one agent session</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">AI conflict resolution · Sequence</p>
    <h1>Resolve all conflicts in one agent session</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="resolve-sequence-title resolve-sequence-desc">
        <title id="resolve-sequence-title">Resolve all conflicts in one agent session</title>
        <desc id="resolve-sequence-desc">The user clicks Resolve all. useAiResolveRuns makes one job with one shared run id, reads every target file in parallel through the resolver, drops binary files and files holding a sentinel line, and refuses the set when it is over the size budget. It then sends one acp_prompt with all files to the agent, which returns one answer with one block per file. The answer is split by path, and for each file still live the hook re-reads it, refuses it if it changed on disk, and otherwise lands the proposal in Output. Each row shows its own proposal or error.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- HEADERS -->
        <!-- User -->
        <rect x="52" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="52" y="72" width="152" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="128" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User</text>
        <text x="128" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">conflict workspace</text>

        <!-- Row -->
        <rect x="236" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="236" y="72" width="152" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="312" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AiConflictResolve</text>
        <text x="312" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AiConflictResolve.tsx</text>

        <!-- Hook (focal) -->
        <rect x="420" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="72" width="152" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="496" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">useAiResolveRuns</text>
        <text x="496" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ aiResolveModel.ts</text>

        <!-- Resolver -->
        <rect x="604" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="604" y="72" width="152" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="680" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Conflict resolver</text>
        <text x="680" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">useConflictResolver.ts</text>

        <!-- Agent -->
        <rect x="788" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="788" y="72" width="152" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="796" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="814" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUST</text>
        <text x="864" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">acp_prompt</text>
        <text x="864" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one adapter · one session</text>

        <!-- LIFELINES: centers 128, 312, 496, 680, 864 -->
        <line x1="128" y1="128" x2="128" y2="640" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="312" y1="128" x2="312" y2="640" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="496" y1="128" x2="496" y2="640" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="680" y1="128" x2="680" y2="640" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="864" y1="128" x2="864" y2="640" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- LOOP FRAME: per file -->
        <rect x="104" y="468" width="820" height="160" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="104" y="468" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="124" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
        <text x="152" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[each file still live, by path]</text>

        <!-- ACTIVATION BARS -->
        <rect x="308" y="164" width="8" height="44" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="492" y="196" width="8" height="420" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="0.8"/>
        <rect x="676" y="268" width="8" height="44" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="860" y="364" width="8" height="44" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="0.8"/>
        <rect x="676" y="500" width="8" height="76" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="308" y="592" width="8" height="24" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- MESSAGES -->
        <line x1="128" y1="168" x2="306" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="316" y1="200" x2="490" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 500 224 L 528 224 Q 536 224 536 232 L 536 240 Q 536 248 528 248 L 502 248" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="500" y1="272" x2="674" y2="272" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="676" y1="304" x2="502" y2="304" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M 500 320 L 528 320 Q 536 320 536 328 L 536 336 Q 536 344 528 344 L 502 344" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="500" y1="368" x2="858" y2="368" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="860" y1="400" x2="502" y2="400" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M 500 424 L 528 424 Q 536 424 536 432 L 536 440 Q 536 448 528 448 L 502 448" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- loop -->
        <line x1="500" y1="504" x2="674" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="676" y1="536" x2="502" y2="536" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="500" y1="568" x2="674" y2="568" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="492" y1="600" x2="318" y2="600" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- MESSAGE LABELS (masked) -->
        <rect x="170" y="150" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="218" y="159" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESOLVE ALL N</text>

        <rect x="340" y="182" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="404" y="191" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">START(AGENT, PATHS)</text>

        <rect x="544" y="230" width="232" height="12" rx="2" fill="#f5f5f5"/>
        <text x="548" y="239" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">ONE JOB · SHARED RUNID · "PREPARING"</text>

        <rect x="520" y="254" width="136" height="12" rx="2" fill="#f5f5f5"/>
        <text x="588" y="263" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REVALIDATE ×N · PARALLEL</text>

        <rect x="540" y="286" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="588" y="295" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CONFLICTED BODIES</text>

        <rect x="544" y="326" width="300" height="12" rx="2" fill="#f5f5f5"/>
        <text x="548" y="335" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">DROP BINARY / SENTINEL · REFUSE OVER 600 KB</text>

        <rect x="600" y="350" width="160" height="12" rx="2" fill="#f5f5f5"/>
        <text x="680" y="359" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ONE PROMPT · ALL FILES</text>

        <rect x="592" y="382" width="176" height="12" rx="2" fill="#f5f5f5"/>
        <text x="680" y="391" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ONE ANSWER · === FILE: BLOCKS</text>

        <rect x="544" y="430" width="176" height="12" rx="2" fill="#f5f5f5"/>
        <text x="548" y="439" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">SPLIT BY PATH · CHECK EACH</text>

        <rect x="528" y="486" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="588" y="495" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RE-READ FROM DISK</text>

        <rect x="528" y="518" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="588" y="527" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UNCHANGED? ELSE ERROR</text>

        <rect x="528" y="550" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="588" y="559" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LAND IN OUTPUT</text>

        <rect x="340" y="582" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="404" y="591" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROPOSAL OR ERROR</text>

        <!-- FOOTNOTE -->
        <text x="52" y="668" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Stop on one file bumps only that file's token, so its block never lands; the adapter is cancelled once no file of the job is still live. Stop on every file, or a repo switch, ends it at once.</text>
        <text x="52" y="682" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Each file is judged on its own: a missing, empty or marker-laden block, or a file changed on disk, errors that file only. A one-file request reuses the same path; a bare or fenced reply without sentinels is still accepted.</text>
        <text x="52" y="696" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Nothing is written or staged here: the proposal waits in Output for Apply &amp; stage or Discard. The agent is read-only (ACP gate and prompt).</text>

        <!-- LEGEND -->
        <line x1="52" y1="728" x2="948" y2="728" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="52" y="744" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="52" y="756" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="72" y="764" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Changed by this change</text>

        <rect x="200" y="752" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="212" y="764" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Activation</text>

        <line x1="300" y1="762" x2="328" y2="762" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="336" y="764" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call</text>

        <line x1="400" y1="762" x2="428" y2="762" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="436" y="764" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return or state change</text>

        <line x1="580" y1="762" x2="608" y2="762" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="616" y="764" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">New or changed step</text>
      </svg>
    </div>
  </div>
</body>
</html>
