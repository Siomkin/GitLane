<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A read-only git status no longer looks like a change</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 920px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Git status without optional locks · Before / after</p>
    <h1>A read-only git status no longer looks like a change</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 920 446" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="status-index-write-title status-index-write-desc">
        <title id="status-index-write-title">A read-only git status no longer looks like a change</title>
        <desc id="status-index-write-desc">Before, a read-only git status run by GitLane refreshed git's stat cache and rewrote .git/index; the repository watcher reported that write as a worktree change, the desktop re-synced, and for a remote repository the agent spent 50 to 200 milliseconds on a refresh. After, every git command GitLane starts runs with GIT_OPTIONAL_LOCKS=0, so the index is not rewritten, no event fires and the agent stays idle.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
        <text x="40" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">BEFORE · A READ-ONLY STATUS LOOKS LIKE A CHANGE</text>
        <rect x="40" y="96" width="170" height="70" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="125" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">git status</text>
        <text x="125" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dirty probe, previews</text>
        <text x="125" y="147" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">isolated_git_command()</text>
        <line x1="210" y1="131" x2="261" y2="131" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="265" y="96" width="170" height="70" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="350" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">writes .git/index</text>
        <text x="350" y="134" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stat-cache refresh</text>
        <text x="350" y="147" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nothing actually changed</text>
        <line x1="435" y1="131" x2="486" y2="131" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="490" y="96" width="170" height="70" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="575" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">watcher: repo-changed</text>
        <text x="575" y="134" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kind: worktree</text>
        <text x="575" y="147" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">desktop re-syncs (400 ms)</text>
        <line x1="660" y1="131" x2="711" y2="131" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="715" y="96" width="170" height="70" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="800" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">agent refresh</text>
        <text x="800" y="134" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">50–70 ms worktree</text>
        <text x="800" y="147" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~200 ms full (large repo)</text>
        <text x="40" y="238" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">AFTER · GIT_OPTIONAL_LOCKS=0 ON EVERY GIT COMMAND</text>
        <rect x="40" y="250" width="170" height="70" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="125" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">git status</text>
        <text x="125" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dirty probe, previews</text>
        <text x="125" y="301" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">isolated_git_command()</text>
        <line x1="210" y1="285" x2="261" y2="285" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="265" y="250" width="170" height="70" rx="6" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="350" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GIT_OPTIONAL_LOCKS=0</text>
        <text x="350" y="288" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no opportunistic</text>
        <text x="350" y="301" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">index refresh</text>
        <line x1="435" y1="285" x2="711" y2="285" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="491" y="268" width="164" height="12" rx="2" fill="#f5f5f5"/>
        <text x="573" y="277" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INDEX UNTOUCHED · NO EVENT</text>
        <rect x="715" y="250" width="170" height="70" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="800" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">nothing to refresh</text>
        <text x="800" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agent stays idle</text>
        <text x="40" y="352" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Measured on the remote box: plain git status → 5 events in 5 runs; with --no-optional-locks → 0 in 5. Idle watching costs 0% CPU.</text>
        <text x="40" y="366" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Optional locks cover only background refreshes; commit, checkout, staging and other writes still take their own locks.</text>
        <text x="40" y="380" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Status polling by other tools still rewrites the index, but the watcher now refreshes only when index entries change (path, id, mode, stage).</text>
        <line x1="40" y1="396" x2="885" y2="396" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="412" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="422" width="14" height="10" rx="2" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="62" y="430" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Changed in this PR</text>
        <rect x="200" y="422" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="222" y="430" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Unchanged</text>
        <rect x="320" y="422" width="14" height="10" rx="2" fill="#ffffff" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="342" y="430" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Wasted work (before)</text>
      </svg>
    </div>
  </div>
</body>
</html>
