<!DOCTYPE html>

<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {

      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;

      --font-serif:    'Instrument Serif', 'Noto Serif', serif;

    }

      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Ref-write feedback · Sequence</p>
    <h1>Deleting a branch on the remote, with a pending pill</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ref-write-sequence-title ref-write-sequence-desc">
        <title id="ref-write-sequence-title">Deleting a branch on the remote, with a pending pill</title>
        <desc id="ref-write-sequence-desc">The user confirms Delete on remote, which calls the store action deleteRemoteBranch. The action is wrapped in withRefWrite, which first adds an entry for origin/x to refWritesPending for this repository, so the origin/x pill shows a spinner and aria-busy at once through useRefPending. The runOp body then runs git push --delete through the Rust command delete_remote_branch. If the user double-clicks another ref meanwhile, that checkout runs and is not refused, because a pending write refuses nothing. When git returns, runOp refreshes the graph, and only after that the wrapper's finally block removes its own entry by id, so the spinner goes away as the ref leaves the graph.</desc>

        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <line x1="496" y1="128" x2="496" y2="600" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- FRAME: another ref double-clicked meanwhile -->

        <text x="732" y="475" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">REFRESHIFCURRENT</text>

        <rect x="556" y="486" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="588" y="495" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SETTLES</text>

        <rect x="544" y="530" width="184" height="12" rx="2" fill="#f5f5f5"/>
        <text x="548" y="539" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FINALLY: REMOVE OWN ENTRY BY ID</text>

        <rect x="334" y="554" width="140" height="12" rx="2" fill="#f5f5f5"/>

        <!-- ACTORS -->
        <rect x="52" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>

        <rect x="244" y="80" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>

        <rect x="788" y="72" width="152" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="796" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="814" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUST</text>
        <text x="864" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">git CLI</text>
        <text x="864" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git push --delete</text>

        <!-- FOOTNOTE -->
        <text x="52" y="636" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">The same wrapper covers removeBranch, deleteBranchAndRemote (both pills), deleteBranchWithWorktree, renameBranchTo, pushBranch, publishBranch, forcePush, deleteTag and pushTag.</text>
        <text x="52" y="650" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Entries live in refWritesPending, keyed by repository path, one per running write; overlapping writes each remove only their own entry, and other tabs are unaffected.</text>
        <text x="52" y="664" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Unlike checkoutPending, a pending write refuses nothing. useRefPending spins a pill while either record matches it, so checkout keeps its own spinner and busy guard.</text>
        <text x="52" y="678" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Delete branch &amp; worktree passes the dialog’s graph refresh in as afterDelete, so its spinner also lasts until the deleted ref leaves the graph.</text>
