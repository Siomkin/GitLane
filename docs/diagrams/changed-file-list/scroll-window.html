<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Only the rows near the visible area are mounted</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Changed-file list · Architecture</p>
    <h1>Only the rows near the visible area are mounted</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scroll-window-title scroll-window-desc">
        <title id="scroll-window-title">Only the rows near the visible area are mounted</title>
        <desc id="scroll-window-desc">The Working Changes inspector has one scroll container holding the header, the Unstaged list and the Staged list, so they scroll as one page. Each ChangedFileList calls useVirtualRows, which finds that scroll container and records the list's offset inside it as scrollMargin. The offset is re-read on every scroll, when a ResizeObserver sees the container or one of its children resize, and when a MutationObserver sees a child added or removed, such as the filter field. useVirtualizer then mounts only the rows in the visible area plus ten overscan rows on each side, positioned absolutely; the rest of the list is empty space of the full height, so the scrollbar and the section after it stay in place. Row heights are fixed CSS (26 px in Tree view, 46, 50 or 58 px in Path view), so rows are not measured. Arrow keys call scrollToIndex, so the next file comes into view even when it was not mounted. Each mounted row is a listitem with aria-setsize and aria-posinset, so screen readers hear the full count and position.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- SCROLL CONTAINER -->
        <text x="100" y="98" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">INSPECTOR BODY · OVERFLOW-AUTO · ONE SCROLLBAR</text>
        <rect x="100" y="108" width="330" height="480" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>

        <!-- header -->
        <rect x="116" y="122" width="298" height="46" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="128" y="142" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">7,530 changes on main</text>
        <text x="128" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">filter · Path / Tree toggle</text>

        <!-- unstaged list -->
        <text x="116" y="190" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.08em">UNSTAGED (7,490) · ChangedFileList</text>
        <rect x="116" y="198" width="298" height="282" rx="4" fill="url(#hatch)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <!-- overscan rows (above) -->
        <rect x="124" y="268" width="282" height="10" rx="2" fill="rgba(45,49,66,0.10)"/>
        <rect x="124" y="281" width="282" height="10" rx="2" fill="rgba(45,49,66,0.10)"/>
        <!-- visible rows -->
        <rect x="124" y="297" width="282" height="12" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="124" y="313" width="282" height="12" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="124" y="329" width="282" height="12" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="124" y="345" width="282" height="12" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="124" y="361" width="282" height="12" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
        <!-- overscan rows (below) -->
        <rect x="124" y="381" width="282" height="10" rx="2" fill="rgba(45,49,66,0.10)"/>
        <rect x="124" y="394" width="282" height="10" rx="2" fill="rgba(45,49,66,0.10)"/>
        <text x="265" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">not mounted · empty space</text>
        <text x="265" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">not mounted · full height kept</text>

        <!-- staged list -->
        <text x="116" y="506" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.08em">STAGED (40) · ChangedFileList</text>
        <rect x="116" y="514" width="298" height="60" rx="4" fill="url(#hatch)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="265" y="548" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">own virtualizer · same scroll</text>

        <!-- visible area -->
        <rect x="90" y="292" width="350" height="86" rx="3" fill="none" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="6,4"/>
        <rect x="292" y="286" width="98" height="12" rx="2" fill="#f5f5f5"/>
        <text x="341" y="295" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VISIBLE AREA</text>

        <!-- scrollMargin dimension -->
        <line x1="72" y1="108" x2="72" y2="198" stroke="#bf4520" stroke-width="1.2"/>
        <line x1="66" y1="108" x2="78" y2="108" stroke="#bf4520" stroke-width="1.2"/>
        <line x1="66" y1="198" x2="78" y2="198" stroke="#bf4520" stroke-width="1.2"/>
        <text x="60" y="153" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" transform="rotate(-90 60 153)" letter-spacing="0.06em">scrollMargin</text>

        <!-- RIGHT: CODE -->
        <!-- A: useVirtualRows (focal) -->
        <rect x="540" y="116" width="380" height="76" rx="6" fill="rgba(191,69,32,0.05)" stroke="#bf4520" stroke-width="1.4"/>
        <text x="560" y="140" fill="#bf4520" font-size="13" font-weight="600" font-family="'Geist', sans-serif">useVirtualRows</text>
        <text x="900" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">useVirtualRows.ts</text>
        <text x="560" y="160" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">Finds the nearest scrolling ancestor and records</text>
        <text x="560" y="176" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">the list's top inside it as scrollMargin.</text>

        <!-- B: observers -->
        <rect x="540" y="226" width="380" height="76" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="560" y="250" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Scroll · ResizeObserver · MutationObserver</text>
        <text x="560" y="270" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">Any scroll, a child resizing (Unstaged shrinks), or a</text>
        <text x="560" y="286" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">child added (the filter opens) → re-read scrollMargin.</text>

        <!-- C: virtualizer -->
        <rect x="540" y="336" width="380" height="76" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="560" y="360" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">useVirtualizer</text>
        <text x="900" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">@tanstack/react-virtual</text>
        <text x="560" y="380" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">Rows in view + 10 overscan each side, placed at</text>
        <text x="560" y="396" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">translateY(start − scrollMargin)</text>

        <!-- D: row heights + keys -->
        <rect x="540" y="446" width="380" height="116" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
        <text x="560" y="470" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Fixed row heights · keys · screen readers</text>
        <text x="560" y="490" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">Tree 26 px · Path 46 / 50 / 58 px</text>
        <text x="560" y="508" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">Exact estimates, so rows are never measured.</text>
        <text x="560" y="526" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">↑/↓ call scrollToIndex for a row not yet mounted.</text>
        <text x="560" y="546" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace">role=listitem · aria-setsize · aria-posinset</text>

        <!-- ARROWS -->
        <line x1="538" y1="154" x2="434" y2="154" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="448" y="138" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="488" y="147" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FINDS PARENT</text>

        <line x1="730" y1="226" x2="730" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="738" y="204" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="742" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RE-READ</text>

        <path d="M 540 374 L 470 374 L 470 335 L 444 335" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="474" y="378" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="478" y="387" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">MOUNTS</text>

        <!-- LEGEND -->
        <line x1="100" y1="612" x2="920" y2="612" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <rect x="100" y="626" width="14" height="10" rx="2" fill="rgba(191,69,32,0.05)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="122" y="635" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">new in this change</text>
        <rect x="250" y="626" width="14" height="10" rx="2" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="272" y="635" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">mounted row</text>
        <rect x="370" y="626" width="14" height="10" rx="2" fill="rgba(45,49,66,0.10)"/>
        <text x="392" y="635" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">overscan row</text>
        <rect x="496" y="626" width="14" height="10" rx="2" fill="url(#hatch)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="518" y="635" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">not mounted, height kept</text>
        <line x1="680" y1="631" x2="700" y2="631" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="6,4"/>
        <text x="708" y="635" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">visible area of the scroll container</text>
      </svg>
    </div>
  </div>
</body>
</html>
