<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A merge integrates the commit the user confirmed</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520; --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Merge by commit · Before / after</p>
    <h1>A merge integrates the commit the user confirmed</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="merge-before-after-title merge-before-after-desc">
        <title id="merge-before-after-title">A merge integrates the commit the user confirmed</title>
        <desc id="merge-before-after-desc">Before: GitLane checked that the source ref was at the confirmed commit, then told git to merge the ref by name, so a ref that moved after the check changed what was merged. After: GitLane keeps the validated commit id from the check, builds the message with fmt-merge-msg, and merges that commit id, so later movement of the ref is not read.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        
        <rect width="1000" height="740" fill="#f5f5f5"/><rect width="1000" height="740" fill="url(#dots)" opacity="0.55"/>
        <line x1="130" y1="96" x2="130" y2="628" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <line x1="380" y1="96" x2="380" y2="628" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <line x1="630" y1="96" x2="630" y2="628" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <line x1="870" y1="96" x2="870" y2="628" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <rect x="40" y="40" width="180" height="56" rx="6" fill="#f5f5f5"/><rect x="40" y="40" width="180" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="130" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Something else</text>
        <text x="130" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fetch or terminal</text>
        <rect x="290" y="40" width="180" height="56" rx="6" fill="#f5f5f5"/><rect x="290" y="40" width="180" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="380" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Source ref</text>
        <text x="380" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">refs/remotes/origin/topic</text>
        <rect x="540" y="40" width="180" height="56" rx="6" fill="#f5f5f5"/><rect x="540" y="40" width="180" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="630" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">GitLane</text>
        <text x="630" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">merge_into</text>
        <rect x="780" y="40" width="180" height="56" rx="6" fill="#f5f5f5"/><rect x="780" y="40" width="180" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="870" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Destination</text>
        <text x="870" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">refs/heads/main</text>
        <rect x="24" y="116" width="952" height="224" rx="6" fill="none" stroke="rgba(45,49,66,0.14)" stroke-dasharray="3,4"/><rect x="36" y="108" width="62" height="16" fill="#f5f5f5"/>
        <text x="43" y="120" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="600">BEFORE</text>
        <line x1="630" y1="160" x2="382" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="409.3" y="141" width="191.4" height="14" fill="#f5f5f5"/>
        <text x="505.0" y="152" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">CHECK: AT CONFIRMED COMMIT</text>
        <rect x="625" y="176" width="10" height="86" fill="#f5f5f5" stroke="#4f5d75"/>
        <text x="644" y="223.0" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">picks the name to merge</text>
        <line x1="130" y1="218" x2="378" y2="218" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="207.6" y="199" width="94.80000000000001" height="14" fill="#f5f5f5"/>
        <text x="255.0" y="210" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">REF ADVANCES</text>
        <line x1="630" y1="290" x2="868" y2="290" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="661.2" y="271" width="177.60000000000002" height="14" fill="#f5f5f5"/>
        <text x="750.0" y="282" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">MERGE --NO-FF &lt;REF NAME&gt;</text>
        <rect x="35" y="262" width="190" height="44" rx="6" fill="#f5f5f5"/><rect x="35" y="262" width="190" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1"/>
        <text x="130.0" y="281.0" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">The moved ref is merged</text>
        <text x="130.0" y="297.0" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">not the confirmed commit</text>
        <rect x="24" y="356" width="952" height="270" rx="6" fill="none" stroke="rgba(45,49,66,0.14)" stroke-dasharray="3,4"/><rect x="36" y="348" width="54" height="16" fill="#f5f5f5"/>
        <text x="43" y="360" fill="#bf4520" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="600">AFTER</text>
        <line x1="630" y1="400" x2="382" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="409.3" y="381" width="191.4" height="14" fill="#f5f5f5"/>
        <text x="505.0" y="392" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">CHECK: AT CONFIRMED COMMIT</text>
        <line x1="380" y1="438" x2="628" y2="438" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
        <rect x="436.9" y="419" width="136.2" height="14" fill="#f5f5f5"/>
        <text x="505.0" y="430" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">VALIDATED OID KEPT</text>
        <rect x="625" y="452" width="10" height="78" fill="#f5f5f5" stroke="#bf4520"/>
        <text x="644" y="495.0" fill="#bf4520" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">fmt-merge-msg builds the message</text>
        <line x1="130" y1="492" x2="378" y2="492" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="207.6" y="473" width="94.80000000000001" height="14" fill="#f5f5f5"/>
        <text x="255.0" y="484" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">REF ADVANCES</text>
        <text x="255" y="512" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">no longer read</text>
        <line x1="630" y1="556" x2="868" y2="556" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="647.4" y="537" width="205.20000000000002" height="14" fill="#f5f5f5"/>
        <text x="750.0" y="548" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">MERGE --NO-FF -M &lt;MSG&gt; &lt;OID&gt;</text>
        <rect x="742" y="568" width="212" height="46" rx="6" fill="#f5f5f5"/><rect x="742" y="568" width="212" height="46" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
        <text x="848.0" y="588.0" fill="#bf4520" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">The commit the user confirmed</text>
        <text x="848.0" y="604.0" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">same message as native git</text>
        <text x="24" y="654" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">The message is built from the line git merge would write for a local branch, a remote-tracking branch, or a commit, and --no-log keeps merge.log from listing commits twice.</text>
        <text x="24" y="674" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">If the ref has already moved when the check runs, the merge is refused and the user is asked to refresh.</text>
        <text x="24" y="694" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">The reflog still names the branch. Conflict markers in the file show the commit id, because git cannot set that label when merging by id.</text>
        <line x1="24" y1="712" x2="44" y2="712" stroke="#bf4520" stroke-width="1.2"/>
        <text x="50" y="716" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="start">new in this change</text>
      </svg>
    </div>
  </div>
</body>
</html>
