<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback across a checkout, before and after</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Checkout feedback · Before / after</p>
    <h1>What the user sees while a checkout runs</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="checkout-before-after-title checkout-before-after-desc">
        <title id="checkout-before-after-title">What the user sees while a checkout runs</title>
        <desc id="checkout-before-after-desc">A checkout has three phases: the worktree probe, git checkout with its hooks, and the history refresh. Before this change the clicked pill never changed and the progress card covered only the git phase, starting 400 ms after git started and ending when git returned. After it, the clicked pill shows a spinner from the click until the refresh ends, the progress card appears 400 ms after the click and stays until the refresh ends, and another checkout in the same repository is refused while this one runs.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- PHASE HEADER: x 220..940 -->
        <text x="52" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">PHASES</text>
        <rect x="220" y="60" width="150" height="40" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="295" y="78" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Worktree probe</text>
        <text x="295" y="92" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">list_worktrees</text>
        <rect x="374" y="60" width="356" height="40" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="552" y="78" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">git checkout + post-checkout hook</text>
        <text x="552" y="92" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">checkout_remote_branch</text>
        <rect x="734" y="60" width="206" height="40" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="837" y="78" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">History refresh</text>
        <text x="837" y="92" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">refreshIfCurrent</text>

        <!-- TIME MARKS -->
        <line x1="220" y1="112" x2="220" y2="436" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="300" y1="112" x2="300" y2="436" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="374" y1="112" x2="374" y2="436" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="454" y1="112" x2="454" y2="436" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="732" y1="112" x2="732" y2="436" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="940" y1="112" x2="940" y2="436" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="220" y="124" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLICK</text>
        <text x="300" y="124" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">+400 MS</text>
        <text x="454" y="124" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GIT +400 MS</text>
        <text x="732" y="124" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GIT RETURNS</text>
        <text x="940" y="124" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HISTORY SHOWN</text>

        <!-- BEFORE -->
        <rect x="40" y="140" width="912" height="112" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="40" y="140" width="56" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="68" y="152" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">BEFORE</text>

        <text x="52" y="184" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">Clicked pill</text>
        <line x1="220" y1="180" x2="940" y2="180" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <rect x="508" y="173" width="104" height="14" rx="2" fill="#f5f5f5"/>
        <text x="560" y="183" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="middle">no change at all</text>

        <text x="52" y="214" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">Progress card</text>
        <rect x="454" y="203" width="278" height="16" rx="3" fill="rgba(45,49,66,0.10)" stroke="#4f5d75" stroke-width="1"/>
        <text x="593" y="214" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">“Checking out develop…”</text>

        <text x="52" y="242" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">Second checkout</text>
        <rect x="374" y="231" width="358" height="16" rx="3" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="553" y="242" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="middle">a repeat double-click starts another git checkout</text>

        <!-- AFTER -->
        <rect x="40" y="276" width="912" height="148" rx="4" fill="rgba(191,69,32,0.02)" stroke="rgba(191,69,32,0.40)" stroke-width="1"/>
        <rect x="40" y="276" width="48" height="16" rx="2" fill="#f5f5f5" stroke="rgba(191,69,32,0.40)" stroke-width="1"/>
        <text x="64" y="288" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">AFTER</text>

        <text x="52" y="320" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">Clicked pill</text>
        <rect x="220" y="309" width="720" height="16" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="580" y="320" fill="#bf4520" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">spinner + aria-busy · checkoutPending[repo] = origin/develop</text>

        <text x="52" y="350" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">Progress card</text>
        <rect x="300" y="339" width="640" height="16" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="620" y="350" fill="#bf4520" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">“Checking out develop…” · one card for all three phases</text>

        <text x="52" y="380" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">Second checkout</text>
        <rect x="220" y="369" width="720" height="16" rx="3" fill="rgba(191,69,32,0.04)" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="580" y="380" fill="#bf4520" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="middle">refused with CheckoutBusyError: dropped on a pill, toasted from a menu</text>

        <text x="52" y="410" fill="#2d3142" font-size="11" font-weight="500" font-family="'Geist', sans-serif">Hook output</text>
        <rect x="732" y="399" width="208" height="16" rx="3" fill="rgba(45,49,66,0.10)" stroke="#4f5d75" stroke-width="1"/>
        <text x="836" y="410" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">“Checked out develop” card</text>

        <!-- FOOTNOTE -->
        <text x="52" y="462" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Phase widths are illustrative. A checkout that finishes, refresh included, within 400 ms still shows no card, only the brief pill spinner.</text>
        <text x="52" y="476" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Spinner and card also end when git fails (error toast) or when the “Branch is in another worktree” dialog opens. Other repository tabs never show the spinner.</text>
        <text x="52" y="490" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">The hook-output card appears only when the hook printed something; it is posted when git returns, so it can briefly sit beside the progress card during the refresh.</text>

        <!-- LEGEND -->
        <line x1="52" y1="508" x2="948" y2="508" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="52" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="52" y="534" width="22" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="80" y="542" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Added or widened by this change</text>
        <rect x="260" y="534" width="22" height="10" rx="2" fill="rgba(45,49,66,0.10)" stroke="#4f5d75" stroke-width="1"/>
        <text x="288" y="542" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Existing behaviour</text>
        <rect x="420" y="534" width="22" height="10" rx="2" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="448" y="542" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">What a second request does</text>
      </svg>
    </div>
  </div>
</body>
</html>
