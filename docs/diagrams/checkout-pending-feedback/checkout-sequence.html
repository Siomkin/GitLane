<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>Checking out a ref, with a busy guard</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Checkout feedback · Sequence</p>
    <h1>Checking out a ref, with a busy guard</h1>

        <title id="checkout-sequence-title">Checking out a ref, with a busy guard</title>
        <desc id="checkout-sequence-desc">A double-click on a remote ref pill calls checkoutRemoteBranch, which goes through runPendingCheckout. It records the ref as pending for this repository, so the pill shows a spinner at once, and starts a progress card that appears after 400 ms. The checkout body then probes worktrees, runs git with its hooks, and refreshes the history. A second checkout request while this runs is refused with CheckoutBusyError: a repeat double-click on the same pill drops it, any other request shows which checkout is running. When the body settles, whether it succeeded, failed or opened the worktree dialog, a finally block clears the pending entry and dismisses the card, and the spinner goes away.</desc>

        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- FRAME: second request while pending -->

        <!-- MESSAGES -->

        <rect x="160" y="446" width="116" height="12" rx="2" fill="#f5f5f5"/>

        <text x="404" y="479" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHECKOUT…</text>

        <rect x="334" y="494" width="140" height="12" rx="2" fill="#f5f5f5"/>

        <!-- FOOTNOTE -->
        <text x="52" y="784" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">The pending check and the SET happen before the first await, so a second request in the same repository always sees the entry. Entries are keyed by repository path; other tabs are unaffected.</text>
        <text x="52" y="798" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">checkoutBranch and checkoutDetached take the same path; only the keyed ref differs (branch name, or the full sha). The body may instead open the “Branch is in another worktree” dialog.</text>
        <text x="52" y="812" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Any other caller shows “A checkout of origin/develop is already running”. Creating a branch, merge, rebase and reset are refused the same way; a chained rebase never runs.</text>
