<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>When the terminal loads</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Lazy library leaves · Lifecycle</p>
    <h1>When the terminal loads</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="terminal-lazy-lifecycle-title terminal-lazy-lifecycle-desc">
        <title id="terminal-lazy-lifecycle-title">When the terminal loads</title>
        <desc id="terminal-lazy-lifecycle-desc">States of the terminal layer. From app start, TerminalLayer is an eager shell that calls loadAgents and renders nothing. The first time terminalView is not hidden, hasOpened latches and the TerminalBody chunk, xterm and the terminal stylesheets load behind a Suspense boundary with a null fallback. Once loaded, TerminalBody is mounted with useTerminalPanes and stays mounted through hide, collapse and repo switches for the rest of the session. There is no transition back to the shell-only state.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- START -->
        <circle cx="30" cy="145" r="5" fill="#2d3142"/>
        <line x1="36" y1="145" x2="58" y2="145" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="30" y="128" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP START</text>

        <rect x="60" y="110" width="180" height="70" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="150" y="134" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shell only</text>
        <text x="150" y="152" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">TerminalLayer</text>
        <text x="150" y="166" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">loadAgents() · renders nothing</text>
        <rect x="400" y="110" width="180" height="70" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="490" y="134" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Loading the body</text>
        <text x="490" y="152" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">hasOpened = true</text>
        <text x="490" y="166" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">Suspense fallback: null</text>
        <rect x="740" y="110" width="180" height="70" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="830" y="134" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Body mounted</text>
        <text x="830" y="152" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">TerminalBody · useTerminalPanes</text>
        <text x="830" y="166" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">xterm panes + PTYs</text>

        <!-- TRANSITIONS -->
        <line x1="240" y1="145" x2="398" y2="145" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="320" y="136" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FIRST OPEN</text>
        <text x="320" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">terminalView !== "hidden"</text>
        <line x1="580" y1="145" x2="738" y2="145" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="660" y="136" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHUNK LOADED</text>
        <path d="M 790 110 L 790 82 L 870 82 L 870 108" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="830" y="72" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HIDE · COLLAPSE · REPO SWITCH</text>

        <!-- NOTES UNDER STATES -->
        <text x="150" y="200" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">No xterm code or stylesheet is loaded.</text>
        <text x="150" y="214" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">The Settings agent badge already works.</text>
        <text x="490" y="200" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Fetches TerminalBody, xterm and the</text>
        <text x="490" y="214" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">terminal stylesheets (about 379 kB of JS).</text>
        <text x="830" y="200" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Stays mounted for the rest of the session,</text>
        <text x="830" y="214" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">so shells and scrollback survive.</text>

        <!-- FOOTNOTE -->
        <text x="40" y="258" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">There is no way back to “Shell only”: <tspan font-family="'Geist Mono', monospace">hasOpened</tspan> is never reset. Before this change the body was mounted from app start, so xterm loaded in every session.</text>
        <text x="40" y="274" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">“Open in terminal” queues its text in <tspan font-family="'Geist Mono', monospace">terminalInject</tspan> and opens the view; delivery waits until the target pane is alive, so text queued while the chunk loads is kept.</text>

        <!-- LEGEND -->
        <line x1="40" y1="294" x2="960" y2="294" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="310" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="318" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="326" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Added by this change</text>
        <rect x="210" y="318" width="14" height="10" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="230" y="326" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">As before: the body, mounted for the session</text>
      </svg>
    </div>
  </div>
</body>
</html>
