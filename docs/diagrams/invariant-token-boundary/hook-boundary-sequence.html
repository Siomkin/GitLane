<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git gives a hook no token value, but a hook can ask for one</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520; --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Token boundary · Sequence</p>
    <h1>Git gives a hook no token value, but a hook can ask for one</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hook-boundary-sequence-title hook-boundary-sequence-desc">
        <title id="hook-boundary-sequence-title">Git gives a hook no token value, but a hook can ask for one</title>
        <desc id="hook-boundary-sequence-desc">In a provider-token push, GitLane's broker holds the token and git's environment carries only its endpoint and nonce. The askpass helper fetches the token so git can authenticate. The pre-push hook then runs with no token value in its environment or arguments, though it can ask the same helper while the push runs.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="1000" height="860" fill="#f5f5f5"/>
        <rect width="1000" height="860" fill="url(#dots)" opacity="0.55"/>
        <line x1="110" y1="96" x2="110" y2="768" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <line x1="310" y1="96" x2="310" y2="768" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <line x1="510" y1="96" x2="510" y2="768" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <line x1="700" y1="96" x2="700" y2="768" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <line x1="890" y1="96" x2="890" y2="768" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <rect x="26" y="40" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="26" y="40" width="168" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="110" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">GitLane</text>
        <text x="110" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">credential broker</text>
        <rect x="226" y="40" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="226" y="40" width="168" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="310" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Askpass helper</text>
        <text x="310" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GIT_ASKPASS</text>
        <rect x="426" y="40" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="426" y="40" width="168" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="510" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">git push</text>
        <text x="510" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">run_push</text>
        <rect x="616" y="40" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="616" y="40" width="168" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="700" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Remote</text>
        <text x="700" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">HTTP server</text>
        <rect x="806" y="40" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="806" y="40" width="168" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="890" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">pre-push hook</text>
        <text x="890" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">trusted user code</text>
        <line x1="110" y1="140" x2="508" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="176.1" y="119" width="67.8" height="14" fill="#f5f5f5"/>
        <text x="210" y="130" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">SPAWN GIT</text>
        <text x="210" y="156" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">endpoint + nonce in env</text>
        <line x1="510" y1="188" x2="698" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="558.7" y="167" width="92.6" height="14" fill="#f5f5f5"/>
        <text x="605" y="178" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">GET INFO/REFS</text>
        <line x1="700" y1="228" x2="512" y2="228" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="589.7" y="207" width="30.6" height="14" fill="#f5f5f5"/>
        <text x="605" y="218" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">401</text>
        <line x1="510" y1="272" x2="312" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="366.8" y="251" width="86.4" height="14" fill="#f5f5f5"/>
        <text x="410" y="262" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">ASK PASSWORD</text>
        <text x="410" y="288" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">prompt in argv[1]</text>
        <line x1="310" y1="320" x2="112" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="182.3" y="299" width="55.4" height="14" fill="#f5f5f5"/>
        <text x="210" y="310" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">REQUEST</text>
        <text x="210" y="336" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">nonce + prompt</text>
        <line x1="110" y1="368" x2="308" y2="368" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="188.5" y="347" width="43.0" height="14" fill="#f5f5f5"/>
        <text x="210" y="358" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">TOKEN</text>
        <text x="210" y="384" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">only for its host</text>
        <line x1="310" y1="416" x2="508" y2="416" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="363.7" y="395" width="92.6" height="14" fill="#f5f5f5"/>
        <text x="410" y="406" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">STDOUT ANSWER</text>
        <line x1="510" y1="460" x2="698" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="568.0" y="439" width="74.0" height="14" fill="#f5f5f5"/>
        <text x="605" y="450" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">BASIC AUTH</text>
        <line x1="700" y1="500" x2="512" y2="500" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="558.7" y="479" width="92.6" height="14" fill="#f5f5f5"/>
        <text x="605" y="490" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">ADVERTISEMENT</text>
        <line x1="510" y1="552" x2="888" y2="552" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="561.8" y="531" width="86.4" height="14" fill="#f5f5f5"/>
        <text x="605" y="542" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">RUN PRE-PUSH</text>
        <text x="605" y="568" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">inherits git&#x27;s env</text>
        <rect x="802" y="572" width="176" height="46" rx="6" fill="#f5f5f5"/>
        <rect x="802" y="572" width="176" height="46" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
        <text x="890" y="591" fill="#bf4520" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">No token value</text>
        <text x="890" y="608" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">in env or argv</text>
        <rect x="294" y="636" width="612" height="116" rx="4" fill="none" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="294" y="636" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="314" y="648" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
        <text x="342" y="648" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">[if the hook runs the helper, which asks the broker]</text>
        <line x1="890" y1="692" x2="312" y2="692" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="754.9" y="671" width="80.2" height="14" fill="#f5f5f5"/>
        <text x="795" y="682" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">RUN ASKPASS</text>
        <line x1="310" y1="732" x2="888" y2="732" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="388.5" y="711" width="43.0" height="14" fill="#f5f5f5"/>
        <text x="410" y="722" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">TOKEN</text>
        <text x="24" y="794" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">The broker lasts only as long as the git command: GitLane drops it when git returns, so the route closes with the push.</text>
        <text x="24" y="814" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">In gh mode there is no broker. A hook inherits the -c credential helper and can run it the same way.</text>
        <line x1="24" y1="838" x2="44" y2="838" stroke="#bf4520" stroke-width="1.2"/>
        <text x="50" y="842" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="start">checked by the new push test</text>
        <line x1="260" y1="838" x2="280" y2="838" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text x="286" y="842" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="start">return</text>
      </svg>
    </div>
  </div>
</body>
</html>
