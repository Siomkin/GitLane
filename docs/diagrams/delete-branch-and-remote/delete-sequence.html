        <title id="delete-sequence-title">Deleting a branch and its remote counterpart</title>
        <desc id="delete-sequence-desc">Confirming Delete both in DeleteBranchDialog starts useDeleteBranchRun, which calls the deleteBranchAndRemote store action with a step callback. The action checks the repository is still the one the dialog was opened on, then runs delete_remote_branch, a git push --delete leased to the remote-tracking tip. If the push fails, it throws a StepOutcomeError saying nothing was deleted, and the local branch stays. Otherwise it reports the local step, calls removeBranch with force, which runs delete_branch leased to the previewed oid, reports the refresh step, and refreshes the graph. If the local delete fails, the error says the remote branch was deleted and the local one kept. On success the dialog shows every row done and closes itself.</desc>
