<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What a saved agent command runs after the pin</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 920px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Security review hardening · Flowchart</p>
    <h1>What a saved agent command runs after the pin</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 920 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adapter-pin-migration-title adapter-pin-migration-desc">
        <title id="adapter-pin-migration-title">What a saved agent command runs after the pin</title>
        <desc id="adapter-pin-migration-desc">When GitLane loads a saved ACP agent, it compares the command with the catalogue's npx adapters, ignoring the version. A command that is not a catalogue npx package is kept and starts in the repository. A catalogue package with no version, with the latest tag, or on a version an earlier GitLane release pinned is moved onto the current pin, claude-agent-acp 0.109.1 or codex-acp 2.9.0, and that is saved on the next save. A catalogue package on any other version is kept as the user set it and still starts from the home folder, not the repository.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- ARROWS (drawn first, under the nodes) -->
        <line x1="200" y1="108" x2="226" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="390" y1="108" x2="446" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="310" y1="144" x2="310" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="530" y1="144" x2="530" y2="192" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="610" y1="108" x2="696" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ARROW LABELS -->
        <rect x="402" y="102" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="418" y="111" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
        <rect x="319" y="164" width="22" height="12" rx="2" fill="#f5f5f5"/>
        <text x="322" y="173" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">NO</text>
        <rect x="539" y="157" width="168" height="12" rx="2" fill="#f5f5f5"/>
        <text x="542" y="166" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">NONE · @LATEST · EARLIER PIN</text>
        <rect x="616" y="91" width="74" height="12" rx="2" fill="#f5f5f5"/>
        <text x="653" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OTHER VERSION</text>

        <!-- NODES -->
        <rect x="40" y="80" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="80" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="120" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Saved agent loads</text>
        <text x="120" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">acp-agents.json · load_in</text>
        <polygon points="310,72 390,108 310,144 230,108" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="310" y="105" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Catalogue npx</text>
        <text x="310" y="118" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">package?</text>
        <polygon points="530,72 610,108 530,144 450,108" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="530" y="105" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Which</text>
        <text x="530" y="118" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">version?</text>
        <rect x="700" y="80" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="80" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="790" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kept as saved</text>
        <text x="790" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">still starts from home folder</text>
        <rect x="220" y="200" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="220" y="200" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="310" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Not a catalogue adapter</text>
        <text x="310" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kept · starts in the repo</text>
        <rect x="440" y="196" width="180" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="440" y="196" width="180" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="530" y="218" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Moved to the pin</text>
        <text x="530" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claude-agent-acp@0.109.1</text>
        <text x="530" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">codex-acp@2.9.0</text>
        <text x="530" y="262" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">written on the next save</text>

        <!-- FOOTNOTE -->
        <text x="40" y="306" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Before: saved rows moved onto @latest, so npx fetched whatever was newest on every launch. Catalogue: acp/catalogue.rs.</text>
        <text x="40" y="320" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">"Catalogue npx package" compares the command with its trailing @version removed. A command already equal to the pin needs no move.</text>
        <text x="40" y="334" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">"Earlier pin" means a command listed in SHIPPED_PINS. The list starts empty; whoever bumps a pin appends the old command in the same edit.</text>

        <!-- LEGEND -->
        <line x1="40" y1="350" x2="880" y2="350" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="366" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="376" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="384" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Behaviour changed in this work</text>
        <polygon points="220,381 228,376 236,381 228,386" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="244" y="384" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>
        <line x1="310" y1="382" x2="338" y2="382" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="346" y="384" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Into the new pin</text>
        <line x1="450" y1="382" x2="478" y2="382" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="486" y="384" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Next step</text>
      </svg>
    </div>
  </div>
</body>
</html>
