<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Every way out of the editor asks before dropping a draft</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520; --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Unsaved editor drafts · Decision flow</p>
    <h1>Every way out of the editor asks before dropping a draft</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="guarded-exits-title guarded-exits-desc">
        <title id="guarded-exits-title">Every way out of the editor asks before dropping a draft</title>
        <desc id="guarded-exits-desc">Eight groups of user exits all pass through guardDirtyFileView. With no dirty draft and no save running, the exit runs immediately. While a save is running the exit is refused and the draft is kept. Otherwise the Discard unsaved changes prompt appears: Discard runs the exit, Cancel leaves the editor and draft unchanged. Before this change only picking another file asked first.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="1000" height="680" fill="#f5f5f5"/>
        <rect width="1000" height="680" fill="url(#dots)" opacity="0.55"/>
        <rect x="24" y="44" width="236" height="372" rx="6" fill="#f5f5f5"/>
        <rect x="24" y="44" width="236" height="372" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="38" y="66" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="600">USER EXITS FROM THE EDITOR</text>
        <text x="38" y="92" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="start" font-weight="600">Repository tabs</text>
        <text x="38" y="106" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="start">click, ⌘1-9, close the active tab</text>
        <text x="38" y="133" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="start" font-weight="600">Worktrees</text>
        <text x="38" y="147" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="start">switch, add, hand-off landing</text>
        <text x="38" y="174" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="start" font-weight="600">Selection</text>
        <text x="38" y="188" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="start">changed file, commit, working tree</text>
        <text x="38" y="215" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="start" font-weight="600">Back to the graph</text>
        <text x="38" y="229" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="start">Home, branch reveal, Search</text>
        <text x="38" y="256" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="start" font-weight="600">Compare, file history</text>
        <text x="38" y="270" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="start">menus and ⌘↵ review</text>
        <text x="38" y="297" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="start" font-weight="600">Open another repository</text>
        <text x="38" y="311" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="start">add-repository screen</text>
        <text x="38" y="338" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="start" font-weight="600">Window close, Quit</text>
        <text x="38" y="352" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="start">red button, ⌘W, ⌘Q, Quit item</text>
        <text x="38" y="379" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="start" font-weight="600">Relaunch to update</text>
        <text x="38" y="393" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="start">and Install update on Windows</text>
        <polygon points="380,166 472,230 380,294 288,230" fill="#f5f5f5"/>
        <polygon points="380,166 472,230 380,294 288,230" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)"/>
        <text x="380" y="227" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Dirty draft, or</text>
        <text x="380" y="243" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">save running?</text>
        <polygon points="590,170 672,230 590,290 508,230" fill="#f5f5f5"/>
        <polygon points="590,170 672,230 590,290 508,230" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)"/>
        <text x="590" y="227" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Save still</text>
        <text x="590" y="243" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">running?</text>
        <rect x="726" y="190" width="250" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="726" y="190" width="250" height="80" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
        <text x="851.0" y="227.0" fill="#bf4520" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Discard unsaved changes?</text>
        <text x="851.0" y="244.0" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">guardDirtyFileView · requestConfirm</text>
        <rect x="726" y="60" width="250" height="66" rx="6" fill="#f5f5f5"/>
        <rect x="726" y="60" width="250" height="66" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="851.0" y="90.0" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">The exit runs</text>
        <text x="851.0" y="107.0" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">the action the user asked for</text>
        <rect x="470" y="352" width="240" height="70" rx="6" fill="#f5f5f5"/>
        <rect x="470" y="352" width="240" height="70" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="590.0" y="384.0" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Refused, draft kept</text>
        <text x="590.0" y="401.0" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">toast: file is still saving</text>
        <rect x="726" y="352" width="250" height="70" rx="6" fill="#f5f5f5"/>
        <rect x="726" y="352" width="250" height="70" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="851.0" y="384.0" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Editor and draft unchanged</text>
        <text x="851.0" y="401.0" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">nothing else happens</text>
        <path d="M260 230 L286 230" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M472 230 L506 230" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="477.0" y="211" width="24.0" height="14" fill="#f5f5f5"/>
        <text x="489" y="222" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">YES</text>
        <path d="M672 230 L724 230" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="689.0" y="211" width="18.0" height="14" fill="#f5f5f5"/>
        <text x="698" y="222" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">NO</text>
        <path d="M851 190 L851 128" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="827.0" y="152" width="48.0" height="14" fill="#f5f5f5"/>
        <text x="851" y="163" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">DISCARD</text>
        <path d="M851 270 L851 350" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="830.0" y="304" width="42.0" height="14" fill="#f5f5f5"/>
        <text x="851" y="315" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">CANCEL</text>
        <path d="M380 166 L380 93 L724 93" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="510.0" y="74" width="60.0" height="14" fill="#f5f5f5"/>
        <text x="540" y="85" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">NO, CLEAN</text>
        <path d="M590 290 L590 350" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="578.0" y="311" width="24.0" height="14" fill="#f5f5f5"/>
        <text x="590" y="322" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">YES</text>
        <rect x="24" y="446" width="952" height="76" rx="6" fill="none" stroke="rgba(45,49,66,0.14)" stroke-dasharray="3,4"/>
        <rect x="36" y="438" width="62" height="16" fill="#f5f5f5"/>
        <text x="43" y="450" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="600">BEFORE</text>
        <text x="44" y="482" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="start" font-weight="600">Only picking another file over a dirty editor asked first.</text>
        <text x="44" y="502" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Every other exit cleared the file view, so the typed text was gone without a prompt.</text>
        <text x="24" y="550" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Closing a background tab never asks: only the active tab holds the editor. A clean editor never asks.</text>
        <text x="24" y="570" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Staging, unstaging and opening Details now only move the selection (reselectFile), so the editor stays open.</text>
        <text x="24" y="590" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Discard re-checks for a save that started while the prompt was up, and drops the exit if one did.</text>
        <text x="24" y="610" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Store-driven wipes, such as a repository that has vanished, stay unguarded: nobody chose to leave.</text>
        <text x="24" y="630" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">While a save runs, window close and Quit offer “Close anyway” instead of refusing. Dock Quit and log-out cannot be intercepted.</text>
        <line x1="24" y1="662" x2="44" y2="662" stroke="#bf4520" stroke-width="1.2"/>
        <text x="50" y="666" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="start">new in this change</text>
      </svg>
    </div>
  </div>
</body>
</html>
