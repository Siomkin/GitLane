<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What the 2024 edition changes here</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 920px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Rust edition 2024 · Before / after</p>
    <h1>What the 2024 edition changes here</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="edition-2024-changes-title edition-2024-changes-desc">
        <title id="edition-2024-changes-title">What the 2024 edition changes here</title>
        <desc id="edition-2024-changes-desc">Under edition 2021 the temporaries of a block's tail expression are dropped after the block's locals; under 2024 they are dropped before them. All nine sites where the compiler flags this were reviewed and none needed a change. The PR has one commit each for making shell-words desktop-only, switching to edition 2024, applying the 2024 rustfmt style (153 files reorder imports, 13 add semicolons or braces, one line split out of install.rs), and #[expect] on the 23 functions where clippy's collapsible_if asks for let-chains, whose conversion is a follow-up.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
        <text x="40" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TAIL-EXPRESSION TEMPORARIES · WHEN THEY ARE DROPPED AT THE END OF A BLOCK</text>
        <text x="40" y="126" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">2021</text>
        <rect x="110" y="98" width="200" height="54" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="210" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Block finishes</text>
        <text x="210" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tail expression evaluated</text>
        <line x1="310" y1="125" x2="341" y2="125" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="345" y="98" width="200" height="54" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="445" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Locals dropped</text>
        <text x="445" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">e.g. a lock guard `host`</text>
        <line x1="545" y1="125" x2="576" y2="125" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="580" y="98" width="200" height="54" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tail temporaries dropped</text>
        <text x="680" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">e.g. a matched Result</text>
        <text x="40" y="196" fill="#bf4520" font-size="12" font-weight="600" font-family="'Geist', sans-serif">2024</text>
        <rect x="110" y="168" width="200" height="54" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="210" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Block finishes</text>
        <text x="210" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tail expression evaluated</text>
        <line x1="310" y1="195" x2="341" y2="195" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="345" y="168" width="200" height="54" rx="6" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="445" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tail temporaries dropped</text>
        <text x="445" y="206" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">now before the locals</text>
        <line x1="545" y1="195" x2="576" y2="195" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="580" y="168" width="200" height="54" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Locals dropped</text>
        <text x="680" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">after the temporaries</text>
        <rect x="790" y="98" width="100" height="124" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="840" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">9 sites</text>
        <text x="840" y="136" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reviewed</text>
        <text x="840" y="149" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">0 changed</text>
        <text x="40" y="262" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">WHAT THIS PR CHANGES · ONE COMMIT EACH</text>
        <rect x="40" y="274" width="195" height="78" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="58" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">shell-words</text>
        <text x="58" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">optional, desktop-only</text>
        <text x="58" y="325" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">agent build: no unused-</text>
        <text x="58" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">dependency warning</text>
        <rect x="250" y="274" width="195" height="78" rx="6" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="268" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">edition = "2024"</text>
        <text x="268" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">cargo fix: nothing to</text>
        <text x="268" y="325" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">rewrite; 9 drop-order</text>
        <text x="268" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">sites reviewed</text>
        <rect x="460" y="274" width="205" height="78" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="478" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">rustfmt 2024 style</text>
        <text x="478" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">153 files: import order</text>
        <text x="478" y="325" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">13 files: ; and { }</text>
        <text x="478" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">install.rs split: fetch.rs</text>
        <rect x="680" y="274" width="200" height="78" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="780" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">collapsible_if: #[expect]</text>
        <text x="780" y="312" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">31 sites in 23 functions</text>
        <text x="780" y="325" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">let-chains: follow-up</text>
        <text x="40" y="386" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">A site would need a fix only if a dropped-early temporary were a guard or handle a local still needs; at all nine it is a plain Result, Option or moved value.</text>
        <text x="40" y="400" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">No construct the edition makes a hard error exists in the crate (extern blocks, #[no_mangle], static mut, env::set_var). Toolchain stays 1.100.0.</text>
        <text x="40" y="414" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Windows-only code is checked by the Windows clippy job, dispatched on this branch before merge; tests, clippy (desktop + agent) and fmt pass locally.</text>
        <line x1="40" y1="430" x2="880" y2="430" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="446" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="456" width="14" height="10" rx="2" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="62" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">What 2024 changes</text>
        <rect x="200" y="456" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="222" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Unchanged</text>
        <rect x="320" y="456" width="14" height="10" rx="2" fill="#ffffff" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="342" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Deferred to a follow-up</text>
        <line x1="500" y1="462" x2="528" y2="462" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="536" y="464" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Then</text>
