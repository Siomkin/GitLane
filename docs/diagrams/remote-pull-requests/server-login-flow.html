<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What the server's login check shows</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 920px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">#574 · Flowchart</p>
    <h1>What the server's login check shows</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 920 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="server-login-flow-title server-login-flow-desc">
        <title id="server-login-flow-title">What the server's login check shows</title>
        <desc id="server-login-flow-desc">When a remote tab connects, or the user clicks Retry, forge_server_login runs on the server. With no gh or glab provider (Bitbucket, Cursor Origin) pull requests stay off. If the CLI is missing or older than the minimum, the UI shows an install or upgrade hint with the minimum version. If it is not signed in for the remote's host, the UI shows the exact login command with Open terminal and Retry and turns PR writes off. When signed in, the SSH chip shows the login and PR writes say which server login they run as.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- ARROWS (drawn first, under the nodes) -->
        <line x1="190" y1="108" x2="236" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="420" y1="108" x2="466" y2="108" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="614" y1="108" x2="676" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="540" y1="144" x2="540" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="624" y1="236" x2="676" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="540" y1="272" x2="540" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="624" y1="364" x2="676" y2="364" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="540" y1="400" x2="540" y2="448" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Retry loops back to the check -->
        <path d="M 880 364 L 896 364 Q 904 364 904 356 L 904 60 Q 904 52 896 52 L 338 52 Q 330 52 330 60 L 330 76" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- ARROW LABELS -->
        <rect x="622" y="90" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="646" y="99" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NONE</text>
        <rect x="548" y="166" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="584" y="175" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GH / GLAB</text>
        <rect x="634" y="218" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="648" y="227" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
        <rect x="548" y="294" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="564" y="303" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
        <rect x="634" y="346" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="648" y="355" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
        <rect x="548" y="418" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="564" y="427" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
        <rect x="540" y="46" width="152" height="12" rx="2" fill="#f5f5f5"/>
        <text x="616" y="55" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SIGN IN THERE · RETRY</text>

        <!-- NODES -->
        <!-- n1 start -->
        <rect x="40" y="80" width="150" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="80" width="150" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="115" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Remote tab connects</text>
        <text x="115" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">or Retry is clicked</text>

        <!-- n2 probe (focal) -->
        <rect x="240" y="80" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="80" width="180" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="330" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">forge_server_login</text>
        <text x="330" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">on the server · server_login.rs</text>

        <!-- d1 provider -->
        <polygon points="540,72 612,108 540,144 468,108" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="540" y="105" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CLI for the</text>
        <text x="540" y="118" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">remote?</text>

        <!-- n3 PRs off -->
        <rect x="680" y="80" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="80" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="780" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pull requests off</text>
        <text x="780" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Bitbucket · Cursor Origin</text>

        <!-- d2 usable -->
        <polygon points="540,200 624,236 540,272 456,236" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="540" y="233" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Installed and</text>
        <text x="540" y="246" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">new enough?</text>

        <!-- n4 install/upgrade -->
        <rect x="680" y="204" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="204" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="780" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Install or upgrade hint</text>
        <text x="780" y="242" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">"GitLane needs 2.95.0 or newer"</text>
        <text x="780" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chip: Sign in · writes off</text>

        <!-- d3 signed in -->
        <polygon points="540,328 624,364 540,400 456,364" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="540" y="361" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Signed in for</text>
        <text x="540" y="374" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">the host?</text>

        <!-- n5 sign-in hint -->
        <rect x="680" y="328" width="200" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="328" width="200" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="780" y="350" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sign-in hint</text>
        <text x="780" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gh auth login --hostname &lt;host&gt;</text>
        <text x="780" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Open terminal · Retry</text>
        <text x="780" y="394" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chip: Sign in · writes off</text>

        <!-- n6 signed in (user-visible result) -->
        <rect x="420" y="452" width="240" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="452" width="240" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="540" y="474" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pull requests work</text>
        <text x="540" y="490" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chip: GitHub as &lt;login&gt;</text>
        <text x="540" y="504" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">writes: Runs on &lt;server&gt; as &lt;login&gt;</text>

        <!-- FOOTNOTE -->
        <text x="40" y="552" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Asked once per connect and on Retry: a held answer is reused, concurrent askers share one request, and a host that disconnects is asked again on reconnect.</text>
        <text x="40" y="566" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">gh: the cached version check is dropped and run first, then the active, healthy account for the remote's host is taken. glab: glab --version, then glab api --hostname &lt;host&gt; user.</text>
        <text x="40" y="580" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Until the server answers, PR writes stay on and say they run with the server's own login. The command is built only for a plain hostname; GitLane never signs in itself.</text>

        <!-- LEGEND -->
        <line x1="40" y1="596" x2="880" y2="596" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="612" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="622" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="630" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">New in #574 / signed-in result</text>

        <polygon points="214,627 222,622 230,627 222,632" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="238" y="630" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

        <line x1="300" y1="628" x2="328" y2="628" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="336" y="630" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Next step</text>

        <line x1="400" y1="628" x2="428" y2="628" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="436" y="630" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">User fixes it on the server, then Retry</text>
      </svg>
    </div>
  </div>
</body>
</html>
