<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How the forge providers get their modes</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 920px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Rust bool modes · forge · Architecture</p>
    <h1>How the forge providers get their modes</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 920 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="forge-flag-enums-title forge-flag-enums-desc">
        <title id="forge-flag-enums-title">How the forge providers get their modes</title>
        <desc id="forge-flag-enums-desc">The pull request panel still sends deleteBranch, resolved and PrCreateInput.draft. The merge and thread commands convert deleteBranch into BranchAfterMerge and resolved into ThreadResolution, and the GitLab and Bitbucket create paths convert draft into DraftState. The provider methods take the enums. What each provider sends is unchanged: gh's --delete-branch and resolve or unresolve mutation, GitLab's should_remove_source_branch and Draft title prefix, Bitbucket's close_source_branch and draft fields, and Cursor Origin's resolve or reopen, whose merge ignores the branch choice.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
        <line x1="220" y1="170" x2="270" y2="170" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="229" y="153" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="245" y="162" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BOOL</text>
        <line x1="600" y1="170" x2="650" y2="170" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="609" y="153" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="625" y="162" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENUM</text>
        <rect x="40" y="110" width="180" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="130" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pull request panel</text>
        <text x="130" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">src/lib/api</text>
        <text x="130" y="161" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deleteBranch · resolved</text>
        <text x="130" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PrCreateInput.draft</text>
        <text x="130" y="187" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">wire fields unchanged</text>
        <rect x="274" y="100" width="326" height="140" rx="6" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="437" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Each flag converts once</text>
        <text x="437" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">commands/pulls.rs · provider create_pr</text>
        <text x="290" y="162" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">merge: deleteBranch →</text>
        <text x="302" y="174" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace">BranchAfterMerge::from_delete_branch</text>
        <text x="290" y="186" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">thread: resolved →</text>
        <text x="302" y="198" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace">ThreadResolution::from_resolved</text>
        <text x="290" y="210" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">GitLab/Bitbucket create: draft →</text>
        <text x="302" y="222" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace">DraftState::from_draft</text>
        <rect x="654" y="110" width="226" height="120" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="767" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Provider methods</text>
        <text x="767" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ForgeProvider::merge_pr</text>
        <text x="767" y="161" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ForgeProvider::set_thread_resolved</text>
        <text x="767" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gitlab / bitbucket create_pr</text>
        <text x="767" y="187" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">take the enum</text>
        <text x="40" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">WHAT EACH PROVIDER SENDS · UNCHANGED</text>
        <rect x="40" y="292" width="200" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="58" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">GitHub (gh)</text>
        <text x="58" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">--delete-branch on Delete</text>
        <text x="58" y="343" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">resolve / unresolve mutation</text>
        <text x="58" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">--draft: input.draft, as before</text>
        <rect x="260" y="292" width="200" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="278" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">GitLab</text>
        <text x="278" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">should_remove_source_branch</text>
        <text x="278" y="343" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">"Draft: " title prefix</text>
        <text x="278" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">on Delete / on Draft</text>
        <rect x="480" y="292" width="200" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="498" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Bitbucket</text>
        <text x="498" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">close_source_branch: bool</text>
        <text x="498" y="343" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">draft: bool</text>
        <text x="498" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">from == Delete / == Draft</text>
        <rect x="700" y="292" width="180" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="718" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Cursor Origin</text>
        <text x="718" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">pr thread resolve | reopen</text>
        <text x="718" y="343" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">merge ignores the choice</text>
        <text x="718" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">(no branch delete)</text>
        <text x="40" y="410" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Before: merge_pr(ctx, number, method, true) and set_thread_resolved(.., false) at the call sites.</text>
        <text x="40" y="424" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Behaviour is unchanged: the same gh flags, REST fields and origin words; tokens and GH_TOKEN handling are untouched.</text>
        <text x="40" y="438" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">A unit test in git/types/requests.rs pins from_delete_branch, from_resolved and from_draft.</text>
        <line x1="40" y1="456" x2="880" y2="456" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="482" width="14" height="10" rx="2" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="62" y="490" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Conversion added in this work</text>
        <rect x="220" y="482" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="242" y="490" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Signature now takes an enum</text>
        <rect x="400" y="482" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="422" y="490" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Unchanged caller</text>
        <line x1="530" y1="488" x2="558" y2="488" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="566" y="490" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Typed call</text>
        <line x1="650" y1="488" x2="678" y2="488" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="686" y="490" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call with wire flags</text>
      </svg>
    </div>
  </div>
</body>
</html>
