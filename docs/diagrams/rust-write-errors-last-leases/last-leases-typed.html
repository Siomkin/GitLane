<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The last stale leases are typed at the source</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 920px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Last stale leases · Before / after</p>
    <h1>The last stale leases are typed at the source</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 920 492" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="last-leases-typed-title last-leases-typed-desc">
        <title id="last-leases-typed-title">The last stale leases are typed at the source</title>
        <desc id="last-leases-typed-desc">Before, branch delete's symbolic-ref check, the partial-staging hunk and line checks and the remote-checkout retry built their failures with classify::stale as a String ending in Refresh and try again, and classify_failure read the kind from that text. After, each returns WriteError::stale with the same text, and From&lt;WriteError&gt; for CommandError sets staleLease by matching the variant. With no producer left, classify::stale is test-only.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
        <text x="40" y="84" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">BEFORE · THE LAST THREE STALE-LEASE PRODUCERS</text>
        <rect x="40" y="96" width="170" height="78" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="125" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">delete · staging · checkout</text>
        <text x="125" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">branch delete: symbolic ref</text>
        <text x="125" y="147" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">partial staging: hunk / line</text>
        <text x="125" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">remote checkout: retry</text>
        <line x1="210" y1="135" x2="261" y2="135" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="265" y="96" width="170" height="78" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="350" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">classify::stale</text>
        <text x="350" y="134" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Err(String)</text>
        <text x="350" y="147" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">… Refresh and try again.</text>
        <line x1="435" y1="135" x2="486" y2="135" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="490" y="96" width="170" height="78" rx="6" fill="#ffffff" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="575" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">classify_failure</text>
        <text x="575" y="134" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kind read from text:</text>
        <text x="575" y="147" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">suffix after index-lock,</text>
        <text x="575" y="160" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auth and network checks</text>
        <line x1="660" y1="135" x2="711" y2="135" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="715" y="96" width="170" height="78" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="800" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CommandError</text>
        <text x="800" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">staleLease</text>
        <text x="40" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">AFTER · TYPED WHERE THE LEASE FAILS</text>
        <rect x="40" y="236" width="170" height="78" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="125" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">delete · staging · checkout</text>
        <text x="125" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">branch delete: symbolic ref</text>
        <text x="125" y="287" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">partial staging: hunk / line</text>
        <text x="125" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">remote checkout: retry</text>
        <line x1="210" y1="275" x2="261" y2="275" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="265" y="236" width="170" height="78" rx="6" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="350" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WriteError::stale</text>
        <text x="350" y="274" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">StaleLease(..)</text>
        <text x="350" y="287" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">same message text</text>
        <line x1="435" y1="275" x2="711" y2="275" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="521" y="258" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="573" y="267" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO TEXT MATCHING</text>
        <rect x="715" y="236" width="170" height="78" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="800" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CommandError</text>
        <text x="800" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">staleLease</text>
        <rect x="265" y="332" width="395" height="44" rx="6" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="462.5" y="354" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">classify::stale is #[cfg(test)]</text>
        <text x="462.5" y="370" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no producer left; classify tests pin the text fallback</text>
        <text x="40" y="398" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Entry points now returning WriteError: delete_branch, apply_hunk, apply_line, apply_line_range, revert_line_range, checkout_remote_branch.</text>
        <text x="40" y="412" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">The retry's cause is git update-ref's own error, which never matches the index-lock, auth or network patterns, so its kind stays staleLease.</text>
        <text x="40" y="426" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Non-lease messages ("Patch-level staging is unavailable", "No lines were selected") stay WriteError::Git with unchanged text.</text>
        <line x1="40" y1="442" x2="880" y2="442" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="458" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="468" width="14" height="10" rx="2" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="62" y="476" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Added in this change</text>
        <rect x="200" y="468" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="222" y="476" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Unchanged</text>
        <rect x="320" y="468" width="14" height="10" rx="2" fill="#ffffff" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="342" y="476" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Kind read from message text (before)</text>
        <line x1="560" y1="474" x2="588" y2="474" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="596" y="476" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Typed path</text>
      </svg>
    </div>
  </div>
</body>
</html>
