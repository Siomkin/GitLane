<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launch restore phases and what each shows</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Session restore · State machine</p>
    <h1>Launch restore phases and what each shows</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="restore-lifecycle-title restore-lifecycle-desc">
        <title id="restore-lifecycle-title">Launch restore phases and what each shows</title>
        <desc id="restore-lifecycle-desc">sessionRestorePhase moves from pending to restoring when restoreSession starts the tab probe, then to the new opening phase when it hands the last active tab to loadRepo, and to complete when that open settles; with nothing to open it goes straight from restoring to complete. Pending and restoring show "Restoring workspace…". Opening shows the opening layer: the host, the connection or agent-install phase, and Cancel. The opening layer appears only once the open has been pending for 400 ms, so a quick local restore keeps "Restoring workspace…". Cancel clears pendingOpen and completes restore, so the welcome screen shows at once with the tabs kept, while the stale open later stands down.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- ARROWS (before nodes) -->
        <!-- pending -> restoring -->
        <line x1="190" y1="186" x2="248" y2="186" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- restoring -> opening (new) -->
        <line x1="420" y1="186" x2="488" y2="186" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- opening -> complete -->
        <line x1="710" y1="186" x2="788" y2="186" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- restoring -> complete (nothing to open), over the top -->
        <path d="M 335 150 L 335 96 L 875 96 L 875 148" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- opening -> welcome (cancel) -->
        <line x1="600" y1="232" x2="600" y2="300" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- ARROW LABELS -->
        <text x="219" y="176" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">START</text>
        <text x="454" y="168" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROBE</text>
        <text x="454" y="178" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DONE</text>
        <text x="749" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOADREPO</text>
        <text x="749" y="178" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SETTLES</text>
        <rect x="548" y="82" width="114" height="12" rx="2" fill="#f5f5f5"/>
        <text x="605" y="91" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NOTHING TO OPEN</text>
        <text x="610" y="264" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CANCEL</text>
        <text x="610" y="276" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">pendingOpen: null · phase Complete</text>

        <!-- NODE: pending -->
        <rect x="40" y="150" width="150" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="115" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pending</text>
        <text x="115" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tabs persisted</text>

        <!-- NODE: restoring -->
        <rect x="250" y="150" width="170" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="335" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Restoring</text>
        <text x="335" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">recents_status probe</text>

        <!-- NODE: opening (focal, new) -->
        <rect x="490" y="140" width="220" height="92" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="498" y="148" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="512" y="157" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEW</text>
        <text x="600" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Opening</text>
        <text x="600" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">await loadRepo(last tab)</text>
        <text x="600" y="216" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">restoring only while pendingOpen is set</text>

        <!-- NODE: complete -->
        <rect x="790" y="150" width="170" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="875" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Complete</text>
        <text x="875" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">set in finally</text>

        <!-- NODE: welcome after cancel -->
        <rect x="490" y="302" width="220" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="600" y="326" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Welcome screen at once</text>
        <text x="600" y="343" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">isRestoringShell → false · tabs kept</text>

        <!-- SCREEN ROW -->
        <text x="40" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ON SCREEN</text>
        <rect x="40" y="414" width="380" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="230" y="444" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">"Restoring workspace…"</text>
        <text x="230" y="462" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="middle">while tabs are checked, and the open's first 400 ms</text>

        <rect x="490" y="414" width="220" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="600" y="434" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">"Connecting to devbox…"</text>
        <text x="600" y="449" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">"Installing GitLane agent — uploading 62%"</text>
        <text x="600" y="466" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">ssh:// path · Cancel</text>

        <rect x="790" y="414" width="170" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="875" y="440" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">Repository, or</text>
        <text x="875" y="456" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">disconnected / Reconnect</text>

        <!-- column ties -->
        <line x1="335" y1="222" x2="335" y2="412" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="115" y1="222" x2="115" y2="412" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="875" y1="222" x2="875" y2="412" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- FOOTNOTE -->
        <text x="40" y="510" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Before this change the restoring screen ran until Complete, so an SSH tab showed "Restoring workspace…" for the whole connect, agent install or timeout, and the opening overlay with Cancel was hidden.</text>
        <text x="40" y="524" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Cancel ends restore at once (phase Complete); the stale open stands down because it no longer owns pendingOpen, so nothing is published. A summary or missing-repo state still wins over every phase.</text>

        <!-- LEGEND -->
        <line x1="40" y1="544" x2="960" y2="544" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="570" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="578" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Added by this change</text>
        <rect x="188" y="570" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="208" y="578" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">sessionRestorePhase value</text>
        <rect x="350" y="570" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="370" y="578" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Restore abandoned; its late result is ignored</text>
      </svg>
    </div>
  </div>
</body>
</html>
