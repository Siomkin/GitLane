<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Where the remaining mode flags became enums</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 920px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Rust bool modes · misc · Architecture</p>
    <h1>Where the remaining mode flags became enums</h1>

        <title id="misc-flag-enums-title">Where the remaining mode flags became enums</title>
        <desc id="misc-flag-enums-desc">Four commands still receive a bool from the frontend and convert it once: delete_branch's force into BranchDeleteMode, init_repo's readme into Readme, conflict_file's optional resolved into ConflictStage, and move_branch_to_worktree's carry into CarryChanges, which the remote agent's run.rs also converts. Each write or conflict function takes the enum. Three modes never cross IPC: CommitSigning in the squash objects, NormalizedMissing in the discard-all fingerprint, and Announce in the SSH connect command, where the Test connection stays silent. Behaviour is unchanged.</desc>

        </defs>

        <rect x="320" y="166" width="280" height="50" rx="6" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="338" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Readme::from_readme</text>
        <text x="338" y="204" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace">Skip · Seed</text>

        <text x="58" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">commands/worktrees.rs · agent/run.rs</text>

        <text x="658" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">takes the enum</text>
        <text x="40" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">INTERNAL ONLY · NO WIRE FLAG</text>

        <text x="58" y="406" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">CommitSigning</text>
        <text x="58" y="422" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace">Unsigned · Signed</text>
        <text x="58" y="435" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">squash_range::objects</text>
        <text x="58" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">commit_tree adds -S on Signed</text>
        <rect x="325" y="384" width="270" height="78" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="343" y="406" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">NormalizedMissing</text>
        <text x="343" y="422" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace">Skip · Verify</text>

        <text x="343" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">capture_tracked_digest</text>
        <rect x="610" y="384" width="270" height="78" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
