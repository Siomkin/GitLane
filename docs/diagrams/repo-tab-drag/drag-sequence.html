<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragging a repository tab in the desktop app</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Repository tabs · Sequence</p>
    <h1>Dragging a repository tab in the desktop app</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 768" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="drag-sequence-title drag-sequence-desc">
        <title id="drag-sequence-title">Dragging a repository tab in the desktop app</title>
        <desc id="drag-sequence-desc">One tab drag: the app's CSP blocks the style dnd-kit injects, the bundled dndFeedback.css places the dragged tab under the pointer, stripCollision picks a target on every pointer move, and the drop saves the new order through setTabOrder.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- LIFELINES: centers 128, 312, 496, 680, 856 -->
        <line x1="128" y1="128" x2="128" y2="648" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="312" y1="128" x2="312" y2="648" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="496" y1="128" x2="496" y2="648" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="680" y1="128" x2="680" y2="648" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="856" y1="128" x2="856" y2="648" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- LOOP FRAME: each pointer move (User .. stripCollision) -->
        <rect x="116" y="328" width="576" height="176" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="116" y="328" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="136" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
        <text x="164" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[each pointer move]</text>

        <!-- ACTIVATION BARS -->
        <rect x="308" y="164" width="8" height="412" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="676" y="412" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="852" y="564" width="8" height="64" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- MESSAGES -->
        <!-- M1 User -> dnd-kit -->
        <line x1="128" y1="168" x2="308" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M2 dnd-kit -> CSS: injected <style>, refused by the CSP -->
        <line x1="316" y1="212" x2="484" y2="212" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <line x1="490" y1="206" x2="502" y2="218" stroke="#2d3142" stroke-width="1.4"/>
        <line x1="502" y1="206" x2="490" y2="218" stroke="#2d3142" stroke-width="1.4"/>
        <!-- M3 dnd-kit self: popover + --dnd-* style attributes -->
        <path d="M 316 244 L 344 244 Q 352 244 352 252 L 352 260 Q 352 268 344 268 L 316 268" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M4 CSS -> dnd-kit: bundled rules place the tab (headline) -->
        <line x1="496" y1="304" x2="316" y2="304" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- M5 User -> dnd-kit -->
        <line x1="128" y1="384" x2="308" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M6 dnd-kit -> stripCollision -->
        <line x1="316" y1="416" x2="676" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M7 stripCollision -> dnd-kit (return) -->
        <line x1="676" y1="448" x2="316" y2="448" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M8 dnd-kit self: optimistic reorder -->
        <path d="M 316 472 L 344 472 Q 352 472 352 480 L 352 480 Q 352 488 344 488 L 316 488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M9 User -> dnd-kit -->
        <line x1="128" y1="536" x2="308" y2="536" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M10 dnd-kit -> RepoTabStrip -->
        <line x1="316" y1="568" x2="852" y2="568" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M11 RepoTabStrip self: setTabOrder -->
        <path d="M 860 596 L 888 596 Q 896 596 896 604 L 896 612 Q 896 620 888 620 L 860 620" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- MESSAGE LABELS (mask 6-8px clear of the stroke) -->
        <rect x="180" y="150" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="218" y="159" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POINTERDOWN</text>

        <rect x="360" y="194" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="404" y="203" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STYLE BLOCKED</text>

        <rect x="360" y="250" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="406" y="259" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POPOVER + VARS</text>

        <rect x="360" y="286" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="404" y="295" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UNDER POINTER</text>

        <rect x="180" y="366" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="218" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POINTERMOVE</text>

        <rect x="544" y="398" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="588" y="407" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COLLIDE(ITEM)</text>

        <rect x="544" y="430" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="588" y="439" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TARGET / NULL</text>

        <rect x="360" y="474" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="398" y="483" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REORDER DOM</text>

        <rect x="186" y="518" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="218" y="527" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POINTERUP</text>

        <rect x="736" y="550" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="768" y="559" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ONDRAGEND</text>

        <rect x="904" y="602" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="940" y="611" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SETTABORDER</text>

        <!-- ACTORS (after arrows) -->
        <!-- User (external) -->
        <rect x="52" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="52" y="72" width="152" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="60" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="74" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="128" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User</text>
        <text x="128" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tab drag handle</text>

        <!-- dnd-kit (library) -->
        <rect x="236" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="236" y="72" width="152" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="244" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="258" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIB</text>
        <text x="312" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dnd-kit</text>
        <text x="312" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">@dnd-kit/dom 0.5.1</text>

        <!-- Webview CSS (focal: new bundled rules) -->
        <rect x="420" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="420" y="72" width="152" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="428" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="442" y="89" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEW</text>
        <text x="496" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Webview CSS</text>
        <text x="496" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dndFeedback.css</text>

        <!-- stripCollision (focal: new rule) -->
        <rect x="604" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="604" y="72" width="152" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="612" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="626" y="89" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEW</text>
        <text x="680" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">stripCollision</text>
        <text x="680" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stripCollision.ts</text>

        <!-- RepoTabStrip (UI + store) -->
        <rect x="780" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="780" y="72" width="152" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="788" y="80" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="798" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="856" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RepoTabStrip</text>
        <text x="856" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">handleDragEnd</text>

        <!-- FOOTNOTE -->
        <text x="52" y="672" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">The CSP (style-src 'self') still refuses dnd-kit's injected sheet; the --dnd-* values it writes as style attributes are allowed, and dndFeedback.css reads them.</text>
        <text x="52" y="686" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">A cancelled drag changes nothing. setTabOrder rejects any order that is not the same set of open tabs, then saves the session and updates openPaths.</text>

        <!-- LEGEND -->
        <line x1="52" y1="704" x2="948" y2="704" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="52" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="52" y="736" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="72" y="744" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Added by this change</text>

        <rect x="200" y="732" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="212" y="744" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Activation</text>

        <line x1="300" y1="742" x2="328" y2="742" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="336" y="744" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call</text>

        <line x1="400" y1="742" x2="428" y2="742" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="436" y="744" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

        <line x1="512" y1="742" x2="536" y2="742" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <line x1="540" y1="737" x2="550" y2="747" stroke="#2d3142" stroke-width="1.4"/>
        <line x1="550" y1="737" x2="540" y2="747" stroke="#2d3142" stroke-width="1.4"/>
        <text x="560" y="744" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Blocked by the CSP</text>

        <line x1="684" y1="742" x2="712" y2="742" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="720" y="744" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">What the fix restores</text>
      </svg>
    </div>
  </div>
</body>
</html>
