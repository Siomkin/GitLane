<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a path on the server becomes a tab address</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 920px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Remote SSH hardening · Flowchart</p>
    <h1>How a path on the server becomes a tab address</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 920 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="locator-path-check-title locator-path-check-desc">
        <title id="locator-path-check-title">How a path on the server becomes a tab address</title>
        <desc id="locator-path-check-desc">A path the server reports (open_repo, list_worktrees) or a worktree path the user types on a remote tab goes through withLocator. A locator already on the same host is used as is. Otherwise the path must start with a slash: if it does, it is joined onto the tab's origin, such as ssh://devbox/srv/wt. If it does not, it is refused with an error, no connection is made, and a typed worktree is not created, because the check now runs before the write. Before this change the path was always joined, so @other.example/srv/x turned ssh://devbox into ssh://devbox@other.example and the tab connected there. The server's home directory is also dropped unless it starts with a slash, so the folder browser starts at the root.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- ARROWS -->
        <!-- server path into d1 -->
        <line x1="280" y1="108" x2="366" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- typed path into d1 (joins the same line) -->
        <path d="M280,236 H320 V108" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        <!-- d1 yes: used as is -->
        <line x1="554" y1="108" x2="636" y2="108" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- d1 no: into the added check -->
        <line x1="460" y1="148" x2="460" y2="194" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- d2 yes: joined -->
        <line x1="554" y1="236" x2="636" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- d2 no: refused -->
        <line x1="460" y1="276" x2="460" y2="326" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- ARROW LABELS -->
        <rect x="580" y="88" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="596" y="97" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
        <rect x="468" y="164" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="482" y="173" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
        <rect x="580" y="216" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="596" y="225" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
        <rect x="468" y="292" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="482" y="301" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>

        <!-- NODES -->
        <!-- entry: server path -->
        <rect x="40" y="80" width="240" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="80" width="240" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="160" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Server reports a path</text>
        <text x="160" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">open_repo · list_worktrees</text>

        <!-- entry: typed worktree path -->
        <rect x="40" y="208" width="240" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="208" width="240" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="160" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User types a worktree path</text>
        <text x="160" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">checked before add_worktree runs</text>

        <!-- d1: already a locator on this host -->
        <polygon points="460,68 554,108 460,148 366,108" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="460" y="105" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Already a locator</text>
        <text x="460" y="118" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">on this host?</text>

        <!-- d2: starts with slash (focal) -->
        <polygon points="460,196 554,236 460,276 366,236" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="460" y="233" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Path starts</text>
        <text x="460" y="246" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">with "/"?</text>

        <!-- result: used as is -->
        <rect x="640" y="80" width="240" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="80" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="760" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Used as is</text>
        <text x="760" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ssh://devbox/srv/wt</text>

        <!-- result: joined -->
        <rect x="640" y="208" width="240" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="208" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="760" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Joined onto the tab's host</text>
        <text x="760" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/srv/wt → ssh://devbox/srv/wt</text>

        <!-- result: refused (changed outcome) -->
        <rect x="320" y="330" width="280" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="330" width="280" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="460" y="354" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Refused with an error</text>
        <text x="460" y="370" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no connection to any other host</text>
        <text x="460" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">a typed worktree is not created</text>

        <!-- BEFORE / HOME NOTES -->
        <rect x="40" y="430" width="840" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
        <text x="56" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">BEFORE</text>
        <text x="56" y="470" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">There was no slash check: the path was always joined. On a tab at ssh://devbox, a server path of</text>
        <text x="56" y="485" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">@other.example/srv/x became ssh://devbox@other.example/srv/x, and the tab connected to other.example.</text>
        <text x="56" y="500" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">A typed worktree path was joined only after add_worktree had already created the worktree.</text>

        <text x="40" y="532" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">The server's home directory follows the same rule in Rust (server_home · forward.rs): kept only when it starts with "/", otherwise the folder browser starts at "/".</text>
        <text x="40" y="546" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">All paths enter through withLocator (paths.ts), the only place a server path becomes a tab address.</text>

        <!-- LEGEND -->
        <line x1="40" y1="562" x2="880" y2="562" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="578" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <polygon points="40,591 48,586 56,591 48,596" fill="#fbeee9" stroke="#bf4520" stroke-width="1"/>
        <text x="64" y="594" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Check added in this work</text>

        <rect x="196" y="586" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="216" y="594" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">New outcome</text>

        <rect x="300" y="586" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="320" y="594" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Where the path comes from</text>

        <polygon points="440,591 448,586 456,591 448,596" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="464" y="594" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Existing decision</text>

        <line x1="560" y1="592" x2="588" y2="592" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="596" y="594" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Path through the added check</text>
      </svg>
    </div>
  </div>
</body>
</html>
