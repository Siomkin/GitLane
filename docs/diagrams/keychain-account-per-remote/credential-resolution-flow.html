<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Which credential a GitHub remote uses</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520; --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Keychain token per remote · Flowchart</p>
    <h1>Which credential a GitHub remote uses</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 844" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credential-resolution-flow-title credential-resolution-flow-desc">
        <title id="credential-resolution-flow-title">Which credential a GitHub remote uses</title>
        <desc id="credential-resolution-flow-desc">A GitHub HTTPS remote uses a gh account when its URL username matches one, a token named by the URL, the token saved as the remote&#x27;s choice, or the host&#x27;s newest token.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="1000" height="844" fill="#f5f5f5"/>
        <rect width="1000" height="844" fill="url(#dots)" opacity="0.55"/>
        <line x1="360" y1="92" x2="360" y2="122" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="216" x2="360" y2="262" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="356" x2="360" y2="402" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="496" x2="360" y2="542" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="360" y1="636" x2="360" y2="682" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="310" x2="638" y2="310" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="450" x2="638" y2="450" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="480" y1="590" x2="638" y2="590" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M240 170 L128 170 Q120 170 120 178 L120 582 Q120 590 128 590 L238 590" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="170.8" y="149" width="18.4" height="14" fill="#f5f5f5"/><text x="180" y="160" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">NO</text>
        <rect x="379.7" y="233" width="24.5" height="14" fill="#f5f5f5"/><text x="392" y="244" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">YES</text>
        <rect x="378.8" y="373" width="18.4" height="14" fill="#f5f5f5"/><text x="388" y="384" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">NO</text>
        <rect x="378.8" y="513" width="18.4" height="14" fill="#f5f5f5"/><text x="388" y="524" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">NO</text>
        <rect x="378.8" y="653" width="18.4" height="14" fill="#f5f5f5"/><text x="388" y="664" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">NO</text>
        <rect x="547.7" y="289" width="24.5" height="14" fill="#f5f5f5"/><text x="560" y="300" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">YES</text>
        <rect x="547.7" y="429" width="24.5" height="14" fill="#f5f5f5"/><text x="560" y="440" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">YES</text>
        <rect x="547.7" y="569" width="24.5" height="14" fill="#f5f5f5"/><text x="560" y="580" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">YES</text>
        <rect x="240" y="36" width="240" height="56" rx="6" fill="#f5f5f5"/><rect x="240" y="36" width="240" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="360.0" y="61.0" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Fetch, push or PR load</text><text x="360.0" y="78.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GitHub HTTPS remote</text>
        <polygon points="360,124 480,170 360,216 240,170" fill="#f5f5f5"/><polygon points="360,124 480,170 360,216 240,170" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="360" y="168" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Username in the URL?</text><text x="360" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">https://user@github.com</text>
        <polygon points="360,264 480,310 360,356 240,310" fill="#f5f5f5"/><polygon points="360,264 480,310 360,356 240,310" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="360" y="308" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Matches a gh login?</text><text x="360" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">any case, same host</text>
        <polygon points="360,404 480,450 360,496 240,450" fill="#f5f5f5"/><polygon points="360,404 480,450 360,496 240,450" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="360" y="448" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Token saved for it?</text><text x="360" y="464" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">providerTokenKey</text>
        <polygon points="360,544 480,590 360,636 240,590" fill="#f5f5f5"/><polygon points="360,544 480,590 360,636 240,590" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="360" y="588" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Saved choice for remote?</text><text x="360" y="604" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">token still on this host</text>
        <rect x="240" y="684" width="240" height="56" rx="6" fill="#f5f5f5"/><rect x="240" y="684" width="240" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="360.0" y="709.0" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Newest token on the host</text><text x="360.0" y="726.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">else your credential helpers</text>
        <rect x="640" y="278" width="280" height="64" rx="6" fill="#f5f5f5"/><rect x="640" y="278" width="280" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="780.0" y="307.0" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Bound gh account</text><text x="780.0" y="324.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">githubGh</text>
        <rect x="640" y="418" width="280" height="64" rx="6" fill="#f5f5f5"/><rect x="640" y="418" width="280" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="780.0" y="447.0" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Token named by the URL</text><text x="780.0" y="464.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">providerToken</text>
        <rect x="640" y="558" width="280" height="64" rx="6" fill="#f5f5f5"/><rect x="640" y="558" width="280" height="64" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/><text x="780.0" y="587.0" fill="#bf4520" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Token chosen in the picker</text><text x="780.0" y="604.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gitlane.remoteTokenChoices</text>
        <text x="24" y="776" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Before this change the picker listed only gh accounts, so a token sharing a gh login could not be chosen: its username always matched gh first.</text>
        <text x="24" y="796" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">The picker shows the result of this same order. Repositories opened over SSH skip it: the server&#x27;s own credentials are used.</text>
        <line x1="24" y1="822" x2="44" y2="822" stroke="#bf4520" stroke-width="1.2"/><text x="52" y="826" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Added by this change</text>
      </svg>
    </div>
  </div>
</body>
</html>
