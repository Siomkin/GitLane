<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An old index.lock with no opener can still be in use</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520; --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Index lock recovery · Before / after</p>
    <h1>An old index.lock with no opener can still be in use</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 730" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lock-before-after-title lock-before-after-desc">
        <title id="lock-before-after-title">An old index.lock with no opener can still be in use</title>
        <desc id="lock-before-after-desc">Before: git commit -a creates and closes index.lock, then runs the pre-commit hook. GitLane saw a lock at least three seconds old with no opener, treated it as stale and removed it, and the commit that followed had an empty tree. After: GitLane also lists processes. The parent git is still alive during the hook, so the lock is reported as not stale and stays, and the commit records the staged tree.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="1000" height="730" fill="#f5f5f5"/>
        <rect width="1000" height="730" fill="url(#dots)" opacity="0.55"/>
        <line x1="130" y1="96" x2="130" y2="628" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <line x1="380" y1="96" x2="380" y2="628" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <line x1="630" y1="96" x2="630" y2="628" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <line x1="870" y1="96" x2="870" y2="628" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <rect x="40" y="40" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="40" width="180" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="130" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">git commit -a</text>
        <text x="130" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">parent git process</text>
        <rect x="290" y="40" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="290" y="40" width="180" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="380" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">index.lock</text>
        <text x="380" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.git/index.lock</text>
        <rect x="540" y="40" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="540" y="40" width="180" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="630" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">GitLane</text>
        <text x="630" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">classify_lock</text>
        <rect x="780" y="40" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="780" y="40" width="180" height="56" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
        <text x="870" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Process list</text>
        <text x="870" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ps · tasklist</text>
        <rect x="24" y="116" width="952" height="208" rx="6" fill="none" stroke="rgba(45,49,66,0.14)" stroke-dasharray="3,4"/>
        <rect x="36" y="108" width="62" height="16" fill="#f5f5f5"/>
        <text x="43" y="120" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="600">BEFORE</text>
        <line x1="130" y1="160" x2="378" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="179.0" y="141" width="150.0" height="14" fill="#f5f5f5"/>
        <text x="254.0" y="152" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">CREATE, WRITE, CLOSE</text>
        <rect x="125" y="176" width="10" height="70" fill="#f5f5f5" stroke="#4f5d75"/>
        <text x="144" y="215" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">pre-commit hook runs, any length</text>
        <line x1="630" y1="200" x2="382" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="431.0" y="181" width="150.0" height="14" fill="#f5f5f5"/>
        <text x="506.0" y="192" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">OLD ≥ 3 S, NO OPENER</text>
        <line x1="630" y1="240" x2="388" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="437.45" y="221" width="143.1" height="14" fill="#f5f5f5"/>
        <text x="509.0" y="232" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">STALE, SO REMOVE IT</text>
        <path d="M373 233 L387 247 M387 233 L373 247" stroke="#2d3142" stroke-width="2"/>
        <rect x="35" y="264" width="190" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="35" y="264" width="190" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1"/>
        <text x="130" y="282" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Hook ends, git commits</text>
        <text x="130" y="298" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">commit with an empty tree</text>
        <rect x="24" y="340" width="952" height="280" rx="6" fill="none" stroke="rgba(45,49,66,0.14)" stroke-dasharray="3,4"/>
        <rect x="36" y="332" width="54" height="16" fill="#f5f5f5"/>
        <text x="43" y="344" fill="#bf4520" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="600">AFTER</text>
        <line x1="130" y1="384" x2="378" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="179.0" y="365" width="150.0" height="14" fill="#f5f5f5"/>
        <text x="254.0" y="376" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">CREATE, WRITE, CLOSE</text>
        <rect x="125" y="400" width="10" height="130" fill="#f5f5f5" stroke="#4f5d75"/>
        <text x="144" y="462" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">pre-commit hook runs,</text>
        <text x="144" y="477" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">parent git stays alive</text>
        <line x1="630" y1="424" x2="382" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="431.0" y="405" width="150.0" height="14" fill="#f5f5f5"/>
        <text x="506.0" y="416" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">OLD ≥ 3 S, NO OPENER</text>
        <line x1="630" y1="464" x2="868" y2="464" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="677.45" y="445" width="143.1" height="14" fill="#f5f5f5"/>
        <text x="749.0" y="456" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">ANY NON-DAEMON GIT?</text>
        <line x1="870" y1="502" x2="632" y2="502" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
        <rect x="693.25" y="483" width="115.5" height="14" fill="#f5f5f5"/>
        <text x="751.0" y="494" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">YES: GIT COMMIT</text>
        <rect x="440" y="530" width="380" height="58" rx="6" fill="#f5f5f5"/>
        <rect x="440" y="530" width="380" height="58" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
        <text x="630" y="551" fill="#bf4520" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">stale: false, the lock stays</text>
        <text x="630" y="572" fill="#2d3142" font-size="10.5" font-family="'Geist', sans-serif" text-anchor="middle">A git process is still running. Finish other git commands, then retry.</text>
        <rect x="35" y="544" width="190" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="35" y="544" width="190" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="130" y="562" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Hook ends, git commits</text>
        <text x="130" y="578" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">the staged tree</text>
        <text x="24" y="656" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">If the listing fails or takes over 5 s, the lock stays and the user is told to check by hand. With no git running, removal works as before, and remove_index_lock checks again just before deleting.</text>
        <text x="24" y="676" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Skipped as long-lived daemons on macOS and Linux: fsmonitor, credential-cache. Windows tasklist shows no arguments, so any git.exe counts as live.</text>
        <text x="24" y="696" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Any git on the machine counts, in any repository, including a git log open in a pager. A false “live” only withholds the one-click removal.</text>
        <line x1="24" y1="712" x2="44" y2="712" stroke="#bf4520" stroke-width="1.2"/>
        <text x="50" y="716" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="start">new in this change</text>
      </svg>
    </div>
  </div>
</body>
</html>
