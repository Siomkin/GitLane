<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drafting a commit message, before and after</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Commit draft · Before / after</p>
    <h1>Drafting a commit message, before and after</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="draft-before-after-title draft-before-after-desc">
        <title id="draft-before-after-title">Drafting a commit message, before and after</title>
        <desc id="draft-before-after-desc">Measured Draft runs with the Claude Code agent on a 23-file, 86 KB staged diff. Before: after a 2-second start the agent spent about 19 seconds on five tool calls (git diff, then a tool search and three searches for output its plugins had trimmed) before writing, finishing at 25 seconds. After: GitLane reads the staged diff with staged_patch in milliseconds and puts it in the prompt, so the agent makes no tool calls and finishes at about 13 seconds.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- TIME AXIS: 0 s at x=120, 26 s at x=940 -->
        <line x1="120" y1="56" x2="950" y2="56" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="120" y="46" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CLICK DRAFT</text>
        <line x1="436" y1="52" x2="436" y2="60" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="436" y="46" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">10 S</text>
        <line x1="751" y1="52" x2="751" y2="60" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="751" y="46" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">20 S</text>
        <text x="940" y="46" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">TIME</text>

        <!-- BEFORE LANE -->
        <text x="40" y="118" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">BEFORE</text>
        <rect x="120" y="100" width="67" height="30" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="153" y="119" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Start</text>
        <rect x="190" y="100" width="606" height="30" rx="4" fill="rgba(45,49,66,0.06)" stroke="#2d3142" stroke-width="1"/>
        <text x="493" y="119" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">Agent reads the diff itself — 5 tool calls, each a full model turn</text>
        <rect x="799" y="100" width="106" height="30" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="852" y="119" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Writing</text>
        <text x="912" y="119" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist Mono', monospace">25 s</text>
        <!-- tool-call ticks at 4.7, 7.4, 8.8, 11.4, 14.5 s -->
        <g stroke="#2d3142" stroke-width="1.2">
          <line x1="268" y1="130" x2="268" y2="137"/>
          <line x1="353" y1="130" x2="353" y2="137"/>
          <line x1="398" y1="130" x2="398" y2="137"/>
          <line x1="480" y1="130" x2="480" y2="137"/>
          <line x1="577" y1="130" x2="577" y2="137"/>
        </g>
        <g fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">
          <text x="268" y="148">1</text>
          <text x="353" y="148">2</text>
          <text x="398" y="148">3</text>
          <text x="480" y="148">4</text>
          <text x="577" y="148">5</text>
        </g>
        <text x="120" y="170" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">1 runs <tspan font-family="'Geist Mono', monospace">git diff --staged</tspan>; its long output comes back trimmed by the agent's own plugins, so 2 looks up a search tool and 3–5 search for the rest.</text>

        <!-- AFTER LANE -->
        <text x="40" y="238" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">AFTER</text>
        <line x1="120" y1="206" x2="120" y2="250" stroke="#bf4520" stroke-width="1.6"/>
        <text x="126" y="210" fill="#bf4520" font-size="8.5" font-family="'Geist Mono', monospace">staged_patch · milliseconds</text>
        <rect x="123" y="220" width="52" height="30" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="149" y="239" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Start</text>
        <rect x="178" y="220" width="136" height="30" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="246" y="239" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">Diff in the prompt</text>
        <rect x="317" y="220" width="204" height="30" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="419" y="239" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">Writing</text>
        <text x="528" y="239" fill="#bf4520" font-size="10" font-weight="600" font-family="'Geist Mono', monospace">13 s</text>
        <text x="178" y="270" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">no tool calls</text>

        <!-- FOOTNOTE -->
        <text x="40" y="320" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Measured with the Claude Code ACP agent on a 23-file, 86 KB staged diff; times vary by model and run. Codex with the diff in the prompt finished in 5 s.</text>
        <text x="40" y="336" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">A staged diff over 200 KB, or one that cannot be read, sends the old prompt, and the run looks like the Before lane.</text>

        <!-- LEGEND -->
        <line x1="40" y1="356" x2="960" y2="356" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="380" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="388" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Added by this change</text>
        <rect x="188" y="380" width="14" height="10" rx="2" fill="rgba(45,49,66,0.06)" stroke="#2d3142" stroke-width="1"/>
        <text x="208" y="388" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Removed: tool turns</text>
        <rect x="336" y="380" width="14" height="10" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="356" y="388" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Unchanged agent work</text>
      </svg>
    </div>
  </div>
</body>
</html>
