<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A terminal on the server</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 920px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">#506 · Sequence</p>
    <h1>A terminal on the server</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 920 724" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="terminal-sequence-title terminal-sequence-desc">
        <title id="terminal-sequence-title">A terminal on the server</title>
        <desc id="terminal-sequence-desc">Opening a remote tab's terminal: the webview calls pty_spawn_remote with the tab's locator, which runs the user's own ssh in a local PTY to start a login shell in the repository's folder on the server; keystrokes and output then flow through the PTY until the shell exits.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- LIFELINES: 120, 320, 520, 760 -->
        <line x1="120" y1="128" x2="120" y2="592" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="320" y1="128" x2="320" y2="592" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="520" y1="128" x2="520" y2="592" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="760" y1="128" x2="760" y2="592" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- LOOP: while the terminal is open (Webview .. Server) -->
        <rect x="308" y="360" width="464" height="144" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="308" y="360" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="328" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
        <text x="356" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[while the terminal is open]</text>

        <!-- ACTIVATION BARS -->
        <rect x="516" y="192" width="8" height="380" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="756" y="264" width="8" height="276" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- MESSAGES -->
        <line x1="120" y1="168" x2="320" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="320" y1="196" x2="516" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 524 220 L 548 220 Q 556 220 556 228 L 556 236 Q 556 244 548 244 L 524 244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="524" y1="268" x2="756" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 764 288 L 788 288 Q 796 288 796 296 L 796 304 Q 796 312 788 312 L 764 312" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="516" y1="336" x2="320" y2="336" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="320" y1="400" x2="516" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="524" y1="424" x2="756" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="756" y1="452" x2="524" y2="452" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="516" y1="480" x2="320" y2="480" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="756" y1="536" x2="524" y2="536" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="516" y1="564" x2="320" y2="564" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>

        <!-- MESSAGE LABELS -->
        <rect x="192" y="150" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="220" y="159" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TERMINAL</text>

        <rect x="372" y="178" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="420" y="187" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPAWN(LOCATOR)</text>

        <rect x="564" y="226" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="612" y="235" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SSH ARGS + KEY</text>

        <rect x="600" y="250" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="259" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SSH IN A PTY</text>

        <rect x="804" y="294" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="842" y="303" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOGIN SHELL</text>

        <rect x="388" y="318" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="420" y="327" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SESSIONID</text>

        <rect x="388" y="382" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="420" y="391" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PTY_WRITE</text>

        <rect x="604" y="406" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="415" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KEYSTROKES</text>

        <rect x="616" y="434" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="443" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUTPUT</text>

        <rect x="392" y="462" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="420" y="471" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PTY-DATA</text>

        <rect x="600" y="518" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="527" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHELL EXITS</text>

        <rect x="392" y="546" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="420" y="555" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PTY-EXIT</text>

        <!-- ACTORS -->
        <rect x="44" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="44" y="72" width="152" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="52" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="66" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="120" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User</text>
        <text x="120" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Terminal or shortcut</text>

        <rect x="244" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="244" y="72" width="152" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="252" y="80" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="262" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="320" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Webview</text>
        <text x="320" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">api.ptySpawn</text>

        <rect x="436" y="72" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="436" y="72" width="168" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="444" y="80" width="24" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="456" y="89" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IPC</text>
        <text x="520" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pty_spawn_remote</text>
        <text x="520" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">local PTY · terminal.rs</text>

        <rect x="684" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="684" y="72" width="152" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="692" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="706" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
        <text x="760" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Server</text>
        <text x="760" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shell in the repo folder</text>

        <!-- FOOTNOTE -->
        <text x="44" y="616" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">pty_spawn_remote takes locator, not path, so invoke() never forwards it to the agent. It runs your own ssh here: -t -e none -S none, the tab's key file, its own connection.</text>
        <text x="44" y="630" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">On the server: cd to the worktree (the path travels base64-encoded), then exec "${SHELL:-/bin/sh}" -l. A missing folder shows the shell's error and the terminal closes.</text>
        <text x="44" y="644" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Password and passphrase questions appear in the terminal itself; no askpass is used. pty_resize and pty_kill work as for a local terminal.</text>

        <!-- LEGEND -->
        <line x1="44" y1="664" x2="876" y2="664" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="44" y="680" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="44" y="696" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="64" y="704" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">New in #506</text>

        <rect x="160" y="692" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="172" y="704" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Activation</text>

        <line x1="256" y1="702" x2="284" y2="702" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="292" y="704" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call</text>

        <line x1="344" y1="702" x2="372" y2="702" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="380" y="704" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

        <line x1="448" y1="702" x2="476" y2="702" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <text x="484" y="704" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Event</text>

        <line x1="548" y1="702" x2="576" y2="702" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="584" y="704" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Output reaches the terminal</text>
      </svg>
    </div>
  </div>
</body>
</html>
