<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saving an access token to the keychain</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 920px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">credential-connect · Sequence</p>
    <h1>Saving an access token to GitLane's keychain</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 920 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="save-title save-desc">
        <title id="save-title">Saving an access token to GitLane's keychain</title>
        <desc id="save-desc">The Access token panel hands the pasted token to saveTransportToken, which stores it once through save_provider_token in the OS keychain under a fresh id, then runs check_remote_access for each open remote on that host. The backend runs git ls-remote with GitLane's askpass bridge answering from the keychain. If every remote refuses, the new token is deleted and any previous token stays; otherwise the panel says the remote accepted it for reading and that pushing needs write access.</desc>
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#bf4520"/>
          </marker>
        </defs>
        <style>
          .name { font-family: 'Geist', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
          .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; fill: #4f5d75; }
          .msg { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.04em; fill: #2d3142; }
          .note { font-family: 'Geist', system-ui, sans-serif; font-size: 11.5px; fill: #4f5d75; }
          .frame-label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; fill: #4f5d75; }
        </style>

        <!-- lifeline headers -->
        <g>
          <rect x="20" y="24" width="150" height="48" rx="8" fill="#ffffff" stroke="#4f5d75"/>
          <text x="95" y="45" text-anchor="middle" class="name">Access token panel</text>
          <text x="95" y="61" text-anchor="middle" class="sub">KeychainTokenForm.tsx</text>

          <rect x="205" y="24" width="150" height="48" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="2"/>
          <text x="280" y="45" text-anchor="middle" class="name">saveTransportToken</text>
          <text x="280" y="61" text-anchor="middle" class="sub">accounts/credentials.ts</text>

          <rect x="390" y="24" width="150" height="48" rx="8" fill="#ffffff" stroke="#4f5d75"/>
          <text x="465" y="45" text-anchor="middle" class="name">Rust commands</text>
          <text x="465" y="61" text-anchor="middle" class="sub">auth.rs · remotes.rs</text>

          <rect x="575" y="24" width="150" height="48" rx="8" fill="#ffffff" stroke="#4f5d75"/>
          <text x="650" y="45" text-anchor="middle" class="name">OS keychain</text>
          <text x="650" y="61" text-anchor="middle" class="sub">secrets.rs</text>

          <rect x="760" y="24" width="140" height="48" rx="8" fill="#ffffff" stroke="#4f5d75"/>
          <text x="830" y="45" text-anchor="middle" class="name">Git host</text>
          <text x="830" y="61" text-anchor="middle" class="sub">github.com · gitlab…</text>
        </g>

        <!-- lifelines -->
        <g stroke="#4f5d75" stroke-dasharray="3 4" stroke-width="1">
          <line x1="95" y1="72" x2="95" y2="610"/>
          <line x1="280" y1="72" x2="280" y2="610" stroke="#bf4520"/>
          <line x1="465" y1="72" x2="465" y2="610"/>
          <line x1="650" y1="72" x2="650" y2="610"/>
          <line x1="830" y1="72" x2="830" y2="610"/>
        </g>

        <!-- messages -->
        <g fill="none" stroke-width="1.3">
          <line x1="95" y1="112" x2="276" y2="112" stroke="#bf4520" marker-end="url(#arrow-accent)"/>
          <line x1="280" y1="152" x2="461" y2="152" stroke="#4f5d75" marker-end="url(#arrow)"/>
          <line x1="465" y1="192" x2="646" y2="192" stroke="#4f5d75" marker-end="url(#arrow)"/>
          <line x1="280" y1="242" x2="461" y2="242" stroke="#4f5d75" marker-end="url(#arrow)"/>
          <line x1="465" y1="282" x2="826" y2="282" stroke="#4f5d75" marker-end="url(#arrow)"/>
          <line x1="830" y1="322" x2="469" y2="322" stroke="#4f5d75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
          <line x1="465" y1="362" x2="284" y2="362" stroke="#4f5d75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
        </g>
        <g>
          <text x="186" y="105" text-anchor="middle" class="msg">SAVE · PROVIDER, HOST, USER, TOKEN</text>
          <text x="372" y="145" text-anchor="middle" class="msg">save_provider_token</text>
          <text x="556" y="185" text-anchor="middle" class="msg">STORE · FRESH ID</text>
          <text x="372" y="235" text-anchor="middle" class="msg">check_remote_access</text>
          <text x="372" y="256" text-anchor="middle" class="sub">per open remote · providerToken ref</text>
          <text x="646" y="275" text-anchor="middle" class="msg">git ls-remote --quiet origin HEAD</text>
          <text x="646" y="298" text-anchor="middle" class="sub">askpass bridge answers from the keychain</text>
          <text x="648" y="315" text-anchor="middle" class="msg">REFS · OR 401 / 403</text>
          <text x="372" y="355" text-anchor="middle" class="msg">CHECK RESULT · ERROR CODE</text>
        </g>

        <!-- ALT frame -->
        <rect x="40" y="392" width="640" height="200" rx="4" fill="none" stroke="#4f5d75"/>
        <path d="M40,392 h196 v18 l-8,8 h-188 z" fill="#ffffff" stroke="#4f5d75"/>
        <text x="50" y="408" class="frame-label">ALT  EVERY REMOTE REFUSED</text>
        <g fill="none" stroke-width="1.3" stroke="#4f5d75">
          <line x1="280" y1="442" x2="461" y2="442" marker-end="url(#arrow)"/>
          <line x1="465" y1="472" x2="646" y2="472" marker-end="url(#arrow)"/>
          <line x1="280" y1="506" x2="99" y2="506" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
        </g>
        <text x="372" y="435" text-anchor="middle" class="msg">delete_provider_token</text>
        <text x="556" y="465" text-anchor="middle" class="msg">REMOVE NEW TOKEN</text>
        <text x="188" y="499" text-anchor="middle" class="msg">"DID NOT ACCEPT" · DETAILS</text>

        <line x1="40" y1="524" x2="680" y2="524" stroke="#4f5d75" stroke-dasharray="6 4"/>
        <text x="50" y="540" class="frame-label">[ELSE]</text>
        <g fill="none" stroke-width="1.3">
          <line x1="280" y1="572" x2="99" y2="572" stroke="#bf4520" stroke-dasharray="5 4" marker-end="url(#arrow-accent)"/>
        </g>
        <text x="188" y="557" text-anchor="middle" class="msg">"ACCEPTED IT FOR READING"</text>
        <text x="188" y="588" text-anchor="middle" class="sub">+ pushing needs write access</text>

        <!-- footnotes -->
        <g>
          <text x="20" y="646" class="note">• The token crosses IPC once, into save_provider_token, from the form's own state. Git gets it from GitLane's askpass broker; hooks and Git's environment never see it.</text>
          <text x="20" y="666" class="note">• A refused token never replaces a working one: the previous token for the same account is removed only after the check passes.</text>
          <text x="20" y="686" class="note">• "My Git credential helper" takes the other path: approve_https_credential, then the same check through the user's helpers.</text>
        </g>
        <!-- legend -->
        <g transform="translate(20,700)">
          <line x1="0" y1="6" x2="26" y2="6" stroke="#bf4520" stroke-width="2"/><text x="32" y="10" class="sub">new code</text>
          <line x1="110" y1="6" x2="136" y2="6" stroke="#4f5d75" stroke-dasharray="5 4"/><text x="142" y="10" class="sub">return</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
