<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a refused fetch or push becomes a message</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 920px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">credential-connect · Flowchart</p>
    <h1>How a refused fetch or push becomes a message</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="err-title err-desc">
        <title id="err-title">How a refused fetch or push becomes a message</title>
        <desc id="err-desc">Git's error output goes through classify_failure in classify.rs, which checks patterns in order and returns an auth code. forbidden (a 403, or Permission to repo denied to login) says the credential works but lacks permission and opens the Access token tab with Contents highlighted. credentialsMissing (terminal prompts disabled) says no saved credential reached the server and offers a GitLane token. credentialsRejected, new in this change (Authentication failed or Invalid username or token), names expiry, revocation and the resource owner. sshPublickey keeps its SSH key message. Every auth code offers Fix authentication.</desc>
        <defs>
          <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/>
          </marker>
        </defs>
        <style>
          .name { font-family: 'Geist', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
          .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; fill: #4f5d75; }
          .body { font-family: 'Geist', system-ui, sans-serif; font-size: 11.5px; fill: #2d3142; }
          .msg { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9.5px; letter-spacing: 0.04em; fill: #4f5d75; }
          .note { font-family: 'Geist', system-ui, sans-serif; font-size: 11.5px; fill: #4f5d75; }
        </style>

        <!-- source -->
        <rect x="20" y="200" width="150" height="62" rx="8" fill="#ffffff" stroke="#4f5d75"/>
        <text x="95" y="224" text-anchor="middle" class="name">Git's error output</text>
        <text x="95" y="242" text-anchor="middle" class="sub">fetch · pull · push ·</text>
        <text x="95" y="255" text-anchor="middle" class="sub">post-save check</text>

        <!-- classifier (focal) -->
        <rect x="215" y="194" width="160" height="74" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="2"/>
        <text x="295" y="220" text-anchor="middle" class="name">classify_failure</text>
        <text x="295" y="238" text-anchor="middle" class="sub">classify.rs</text>
        <text x="295" y="254" text-anchor="middle" class="sub">first matching pattern</text>
        <line x1="170" y1="231" x2="211" y2="231" stroke="#4f5d75" stroke-width="1.3" marker-end="url(#a)"/>

        <!-- codes column x=430..600 ; outcomes x=650..900 -->
        <g>
          <!-- forbidden -->
          <rect x="415" y="30" width="210" height="58" rx="8" fill="#ffffff" stroke="#4f5d75"/>
          <text x="520" y="53" text-anchor="middle" class="name">forbidden</text>
          <text x="520" y="70" text-anchor="middle" class="sub">403 · "Permission to … denied"</text>
          <rect x="655" y="22" width="255" height="74" rx="8" fill="#ffffff" stroke="#4f5d75"/>
          <text x="667" y="42" class="body">Authenticated, but may not do this here.</text>
          <text x="667" y="58" class="body">HTTPS: Contents Read and write / repo.</text>
          <text x="667" y="74" class="body">SSH: the key's account needs write.</text>
          <text x="667" y="89" class="sub">Fix authentication… → Contents</text>

          <!-- credentialsMissing -->
          <rect x="415" y="142" width="210" height="58" rx="8" fill="#ffffff" stroke="#4f5d75"/>
          <text x="520" y="165" text-anchor="middle" class="name">credentialsMissing</text>
          <text x="520" y="182" text-anchor="middle" class="sub">"terminal prompts disabled"</text>
          <rect x="655" y="134" width="255" height="74" rx="8" fill="#ffffff" stroke="#4f5d75"/>
          <text x="667" y="154" class="body">No saved credential reached the server.</text>
          <text x="667" y="170" class="body">The helper didn't answer.</text>
          <text x="667" y="186" class="sub">Use a GitLane token instead</text>
          <text x="667" y="200" class="sub">Fix authentication… → Access token</text>

          <!-- credentialsRejected (new) -->
          <rect x="415" y="254" width="210" height="58" rx="8" fill="#ffffff" stroke="#bf4520" stroke-width="2"/>
          <text x="520" y="277" text-anchor="middle" class="name">credentialsRejected</text>
          <text x="520" y="294" text-anchor="middle" class="sub">"Authentication failed" · 401</text>
          <rect x="655" y="246" width="255" height="74" rx="8" fill="#ffffff" stroke="#4f5d75"/>
          <text x="667" y="266" class="body">The server rejected the credential:</text>
          <text x="667" y="282" class="body">expired, revoked, or a fine-grained</text>
          <text x="667" y="298" class="body">token for another resource owner.</text>
          <text x="667" y="313" class="sub">Fix authentication… → Access token</text>

          <!-- sshPublickey -->
          <rect x="415" y="366" width="210" height="58" rx="8" fill="#ffffff" stroke="#4f5d75"/>
          <text x="520" y="389" text-anchor="middle" class="name">sshPublickey</text>
          <text x="520" y="406" text-anchor="middle" class="sub">"Permission denied (publickey)"</text>
          <rect x="655" y="366" width="255" height="58" rx="8" fill="#ffffff" stroke="#4f5d75"/>
          <text x="667" y="388" class="body">SSH authentication failed: load a key</text>
          <text x="667" y="404" class="body">that has access to this remote.</text>
        </g>

        <!-- fan-out from classifier (orthogonal) -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.3">
          <path d="M375,231 H395 V59 H411" marker-end="url(#a)"/>
          <path d="M395,171 H411" marker-end="url(#a)"/>
          <path d="M395,231 V283 H411" marker-end="url(#a)"/>
          <path d="M395,283 V395 H411" marker-end="url(#a)"/>
          <path d="M625,59 H651" marker-end="url(#a)"/>
          <path d="M625,171 H651" marker-end="url(#a)"/>
          <path d="M625,283 H651" marker-end="url(#a)"/>
          <path d="M625,395 H651" marker-end="url(#a)"/>
        </g>
        
        
        
        

        <!-- footnotes -->
        <text x="20" y="470" class="note">• The first matching pattern wins: sshPublickey, forbidden, credentialsMissing, credentialsRejected. Other output (unreachable, not found) keeps its message.</text>
        <text x="20" y="490" class="note">• Every message also has a collapsed Details with Git's own output, redacted in the backend; no token ever appears in the copy.</text>
        <text x="20" y="510" class="note">• GitHub's SSH refusal prints no 403, so the forbidden pattern also matches a "Permission to … denied to …" line.</text>
        <g transform="translate(20,530)">
          <rect x="0" y="0" width="22" height="12" rx="3" fill="#ffffff" stroke="#bf4520" stroke-width="2"/><text x="30" y="10" class="sub">new or changed in this change</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
