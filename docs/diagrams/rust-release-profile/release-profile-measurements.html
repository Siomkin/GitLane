<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop release profile: size against build time</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Rust release profile · Measurements</p>
    <h1>Desktop release profile: binary size against build time</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="release-profile-measurements-title release-profile-measurements-desc">
        <title id="release-profile-measurements-title">Desktop release profile: binary size against build time</title>
        <desc id="release-profile-measurements-desc">Desktop release binary size and clean build time for four Cargo release profiles on macOS arm64 and Linux x86_64. Default: 32.3 and 41.9 MB. Thin LTO: 33.0 and 42.4 MB at 1.32 and 1.28 times the build time. One codegen unit, the adopted profile: 22.4 and 29.4 MB at 1.71 and 1.78 times. Thin LTO plus one codegen unit: 23.3 and 29.9 MB at 2.43 and 2.44 times, over the 2 times limit.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
        <text x="250" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">BINARY SIZE (MB)</text>
        <text x="640" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CLEAN BUILD TIME (× DEFAULT)</text>
        <line x1="250" y1="70" x2="250" y2="300" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <text x="250" y="66" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0</text>
        <line x1="322" y1="70" x2="322" y2="300" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <text x="322" y="66" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">10</text>
        <line x1="394" y1="70" x2="394" y2="300" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <text x="394" y="66" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">20</text>
        <line x1="466" y1="70" x2="466" y2="300" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <text x="466" y="66" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">30</text>
        <line x1="538" y1="70" x2="538" y2="300" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <text x="538" y="66" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">40</text>
        <line x1="640" y1="70" x2="640" y2="300" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <text x="640" y="66" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0×</text>
        <line x1="760" y1="70" x2="760" y2="300" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <text x="760" y="66" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1×</text>
        <line x1="880" y1="70" x2="880" y2="300" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <text x="880" y="66" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">2×</text>
        <line x1="880" y1="70" x2="880" y2="300" stroke="#bf4520" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="884" y="308" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">2× LIMIT</text>
        <text x="40" y="100" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="500">Default</text>
        <text x="40" y="114" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">16 units · thin-local LTO</text>
        <rect x="250" y="88" width="232.6" height="14" rx="2" fill="rgba(45,49,66,0.55)" stroke="#2d3142" stroke-width="1"/>
        <text x="488.55999999999995" y="98.5" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" paint-order="stroke" stroke="#f5f5f5" stroke-width="4" stroke-linejoin="round">32.3</text>
        <rect x="640" y="88" width="120.0" height="14" rx="2" fill="rgba(45,49,66,0.55)" stroke="#2d3142" stroke-width="1"/>
        <text x="766" y="98.5" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" paint-order="stroke" stroke="#f5f5f5" stroke-width="4" stroke-linejoin="round">1.00×</text>
        <rect x="250" y="106" width="301.7" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="557.6800000000001" y="116.5" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" paint-order="stroke" stroke="#f5f5f5" stroke-width="4" stroke-linejoin="round">41.9</text>
        <rect x="640" y="106" width="120.0" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="766" y="116.5" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" paint-order="stroke" stroke="#f5f5f5" stroke-width="4" stroke-linejoin="round">1.00×</text>
        <text x="40" y="154" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="500">Thin LTO</text>
        <text x="40" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">lto = "thin"</text>
        <rect x="250" y="142" width="237.6" height="14" rx="2" fill="rgba(45,49,66,0.55)" stroke="#2d3142" stroke-width="1"/>
        <text x="493.6" y="152.5" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" paint-order="stroke" stroke="#f5f5f5" stroke-width="4" stroke-linejoin="round">33.0</text>
        <rect x="640" y="142" width="158.4" height="14" rx="2" fill="rgba(45,49,66,0.55)" stroke="#2d3142" stroke-width="1"/>
        <text x="804.4" y="152.5" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" paint-order="stroke" stroke="#f5f5f5" stroke-width="4" stroke-linejoin="round">1.32×</text>
        <rect x="250" y="160" width="305.3" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="561.28" y="170.5" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" paint-order="stroke" stroke="#f5f5f5" stroke-width="4" stroke-linejoin="round">42.4</text>
        <rect x="640" y="160" width="153.6" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="799.6" y="170.5" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" paint-order="stroke" stroke="#f5f5f5" stroke-width="4" stroke-linejoin="round">1.28×</text>
        <rect x="24" y="188" width="940" height="48" rx="4" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
        <text x="40" y="208" fill="#bf4520" font-size="11" font-family="'Geist', sans-serif" font-weight="600">One codegen unit</text>
        <text x="40" y="222" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">codegen-units = 1 · adopted</text>
        <rect x="250" y="196" width="161.3" height="14" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1"/>
        <text x="417.28" y="206.5" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" paint-order="stroke" stroke="#f2eae8" stroke-width="4" stroke-linejoin="round">22.4</text>
        <rect x="640" y="196" width="205.2" height="14" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1"/>
        <text x="851.2" y="206.5" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" paint-order="stroke" stroke="#f2eae8" stroke-width="4" stroke-linejoin="round">1.71×</text>
        <rect x="250" y="214" width="211.7" height="14" rx="2" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
        <text x="467.68" y="224.5" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" paint-order="stroke" stroke="#f2eae8" stroke-width="4" stroke-linejoin="round">29.4</text>
        <rect x="640" y="214" width="213.6" height="14" rx="2" fill="#ffffff" stroke="#bf4520" stroke-width="1"/>
        <text x="859.6" y="224.5" fill="#bf4520" font-size="9" font-family="'Geist Mono', monospace" font-weight="600" paint-order="stroke" stroke="#f2eae8" stroke-width="4" stroke-linejoin="round">1.78×</text>
        <text x="40" y="262" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="500">Both</text>
        <text x="40" y="276" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">thin LTO + codegen-units = 1</text>
        <rect x="250" y="250" width="167.8" height="14" rx="2" fill="rgba(45,49,66,0.55)" stroke="#2d3142" stroke-width="1"/>
        <text x="423.76" y="260.5" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" paint-order="stroke" stroke="#f5f5f5" stroke-width="4" stroke-linejoin="round">23.3</text>
        <rect x="640" y="250" width="291.6" height="14" rx="2" fill="rgba(45,49,66,0.55)" stroke="#2d3142" stroke-width="1"/>
        <text x="937.6" y="260.5" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" paint-order="stroke" stroke="#f5f5f5" stroke-width="4" stroke-linejoin="round">2.43×</text>
        <rect x="250" y="268" width="215.3" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="471.28" y="278.5" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" paint-order="stroke" stroke="#f5f5f5" stroke-width="4" stroke-linejoin="round">29.9</text>
        <rect x="640" y="268" width="292.8" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="938.8" y="278.5" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" font-weight="400" paint-order="stroke" stroke="#f5f5f5" stroke-width="4" stroke-linejoin="round">2.44×</text>
        <line x1="40" y1="326" x2="960" y2="326" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
        <rect x="40" y="340" width="22" height="12" rx="2" fill="rgba(45,49,66,0.55)" stroke="#2d3142" stroke-width="1"/>
        <text x="70" y="349.5" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">macOS arm64 · default 85 s</text>
        <rect x="250" y="340" width="22" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="349.5" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Linux x86_64 · default 86 s</text>
        <rect x="460" y="340" width="22" height="12" rx="2" fill="rgba(191,69,32,0.10)" stroke="#bf4520" stroke-width="1"/>
        <text x="490" y="349.5" fill="#bf4520" font-size="8.5" font-family="'Geist Mono', monospace">adopted: [profile.release] codegen-units = 1</text>
        <text x="40" y="376" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Clean cargo build --release of the desktop binary, each profile in an empty target dir. One codegen unit: ~30% smaller on both platforms for 1.71–1.78× build time.</text>
        <text x="40" y="392" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace">Thin LTO adds size and time. The agent binary is unchanged: [profile.agent] already sets lto = true and codegen-units = 1.</text>
      </svg>
    </div>
  </div>
</body>
</html>
