  <style>

      display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .diagram-container { width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }

    svg { width:100%; min-width:1000px; display:block; }
    @media print { .diagram-container { overflow-x:visible; } svg { min-width:0; } }
  </style>

    <p class="eyebrow">AI conflict resolution · Sequence</p>
    <h1>Stop ends the whole “Resolve all” run</h1>
    <div class="diagram-container">

        <title id="stop-whole-run-title">Stop ends the whole “Resolve all” run</title>
        <desc id="stop-whole-run-desc">A Resolve all run sends a.json and b.json to the agent in one session; logo.png was refused before the prompt because it is binary. The user presses Stop on a.json. useAiResolveRuns.stop clears every file the prompt carried that still belongs to this run (a.json and b.json), but leaves logo.png and its error. Once no file of the run is waiting, releaseIfIdle calls acp_cancel with the run id, and the Rust side reaps the adapter&#x27;s whole process group. The pending acp_prompt then fails, which is ignored because both files were cleared. Before this change, Stop cleared only a.json and the adapter kept running for b.json; with a refused sibling it was never cancelled at all.</desc>
        <defs>

        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

<rect x="389.2" y="353.0" width="181.6" height="12" rx="2" fill="#f5f5f5"/>
<text x="480.0" y="362.0" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACP_PROMPT FAILS · ADAPTER GONE</text>
<text x="372" y="394" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" text-anchor="start">ignored — a.json and b.json were cleared, nothing lands</text>
<line x1="360" y1="428" x2="130" y2="428" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="148.60000000000002" y="413.0" width="192.79999999999998" height="12" rx="2" fill="#f5f5f5"/>
<text x="245.0" y="422.0" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BANNER GONE · RESOLVE ALL ENABLED</text>
<rect x="40" y="478" width="920" height="54" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.18)"/>
<text x="52" y="496" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">BEFORE</text>
<text x="110" y="496" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Stop called clear(a.json) only: b.json kept waiting, so the adapter ran on and its answer still landed for b.json.</text>
<text x="110" y="512" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">With a refused sibling such as logo.png, the run never looked idle: even stopping every file left the adapter running until it answered or hit the 5-minute limit.</text>
<text x="110" y="526" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="start">Resolving a file by hand still uses clear(path): only that file leaves the run.</text>
