<!DOCTYPE html>
<html lang="en">
<head>

  <title>The agent answers each conflict, not the whole file</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif','Noto Serif',serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh;
      display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .diagram-container { width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:1000px; display:block; }
    @media print { .diagram-container { overflow-x:visible; } svg { min-width:0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">AI conflict resolution · Before / after</p>
    <h1>The agent answers each conflict, not the whole file</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="per-conflict-answer-title per-conflict-answer-desc">
        <title id="per-conflict-answer-title">The agent answers each conflict, not the whole file</title>
        <desc id="per-conflict-answer-desc">Before: GitLane sent each conflicted file and asked the agent to write the complete resolved file back, so a one-line conflict in a large file meant thousands of output lines and minutes of waiting. After: unsendableReason refuses a file with a sentinel line, incomplete markers or an ambiguous &lt;&lt;&lt;&lt;&lt;&lt;&lt; line before anything is sent. The prompt still carries the whole file, with each conflict labelled === CONFLICT n ===. The agent replies with only each conflict&#x27;s replacement lines. rebuild puts each replacement in place of its conflict, unwraps a code fence the agent added, matches the conflict&#x27;s line endings, and refuses the file if a conflict is unanswered or markers remain. The rebuilt file lands in Output for review, exactly as a whole-file answer did.</desc>

          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
