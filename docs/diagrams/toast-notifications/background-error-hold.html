<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A push that fails while GitLane is in the background</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520; --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Toast notifications · Sequence</p>
    <h1>A push that fails while GitLane is in the background</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="background-error-hold-title background-error-hold-desc">
        <title id="background-error-hold-title">A push that fails while GitLane is in the background</title>
        <desc id="background-error-hold-desc">The window hold set on blur survives the progress toast closing, so the error&#x27;s countdown starts only when the user returns.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="1000" height="700" fill="#f5f5f5"/>
        <rect width="1000" height="700" fill="url(#dots)" opacity="0.55"/>
        <line x1="140" y1="80" x2="140" y2="590" stroke="rgba(45,49,66,0.32)" stroke-width="1" stroke-dasharray="4,4"/><line x1="400" y1="80" x2="400" y2="590" stroke="rgba(45,49,66,0.32)" stroke-width="1" stroke-dasharray="4,4"/><line x1="640" y1="80" x2="640" y2="590" stroke="rgba(45,49,66,0.32)" stroke-width="1" stroke-dasharray="4,4"/><line x1="860" y1="80" x2="860" y2="590" stroke="rgba(45,49,66,0.32)" stroke-width="1" stroke-dasharray="4,4"/><line x1="860" y1="124" x2="642" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="640" y1="164" x2="402" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="140" y1="280" x2="398" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="140" y1="396" x2="398" y2="396" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="860" y1="476" x2="642" y2="476" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="640" y1="516" x2="402" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="733.0" y="103" width="34" height="14" fill="#f5f5f5"/><text x="750.0" y="114" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.05em">BLUR</text><rect x="477.5" y="143" width="85" height="14" fill="#f5f5f5"/><text x="520.0" y="154" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.05em">PAUSE WINDOW</text><rect x="243.5" y="259" width="53" height="14" fill="#f5f5f5"/><text x="270.0" y="270" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.05em">DISMISS</text><rect x="234.0" y="375" width="72" height="14" fill="#f5f5f5"/><text x="270.0" y="386" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.05em">SHOW ERROR</text><rect x="730.0" y="455" width="40" height="14" fill="#f5f5f5"/><text x="750.0" y="466" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.05em">FOCUS</text><rect x="474.5" y="495" width="91" height="14" fill="#f5f5f5"/><text x="520.0" y="506" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.05em">RESUME WINDOW</text><rect x="76.0" y="28" width="128" height="48" rx="6" fill="#f5f5f5"/><rect x="76.0" y="28" width="128" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="140" y="49" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Push action</text><text x="140" y="65" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">remotes.ts</text><rect x="336.0" y="28" width="128" height="48" rx="6" fill="#f5f5f5"/><rect x="336.0" y="28" width="128" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="400" y="49" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Store</text><text x="400" y="65" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">notifications.ts</text><rect x="576.0" y="28" width="128" height="48" rx="6" fill="#f5f5f5"/><rect x="576.0" y="28" width="128" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="640" y="49" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Toasts</text><text x="640" y="65" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">ToastStack.tsx</text><rect x="796.0" y="28" width="128" height="48" rx="6" fill="#f5f5f5"/><rect x="796.0" y="28" width="128" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="860" y="49" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">App window</text><text x="860" y="65" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">user in another app</text><rect x="302.55" y="178" width="194.89999999999998" height="27" rx="4" fill="#f5f5f5"/><rect x="302.55" y="178" width="194.89999999999998" height="27" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/><text x="400" y="195" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">holds: window · paused = true</text><rect x="100.5" y="226" width="79.0" height="27" rx="4" fill="#f5f5f5"/><rect x="100.5" y="226" width="79.0" height="27" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/><text x="140" y="243" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">push fails</text><rect x="305.6" y="296" width="188.79999999999998" height="42" rx="4" fill="#f5f5f5"/><rect x="305.6" y="296" width="188.79999999999998" height="42" rx="4" fill="rgba(191,69,32,0.07)" stroke="#bf4520" stroke-width="1"/><text x="400" y="313" fill="#bf4520" font-size="10" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">endStackHolds() keeps window</text><text x="400" y="328" fill="#bf4520" font-size="10" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">paused stays true</text><rect x="296.45" y="410" width="207.1" height="42" rx="4" fill="#f5f5f5"/><rect x="296.45" y="410" width="207.1" height="42" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/><text x="400" y="427" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">error stored with its full 12 s</text><text x="400" y="442" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">countdown not started</text><rect x="311.7" y="530" width="176.6" height="27" rx="4" fill="#f5f5f5"/><rect x="311.7" y="530" width="176.6" height="27" rx="4" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/><text x="400" y="547" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">no holds left: 12 s starts</text><text x="24" y="622" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start">Without the kept hold, the empty stack between the progress toast and the error would release the pause and the error would expire unseen.</text><text x="24" y="642" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start">Pointer, focus and selection holds end with the last toast. The window hold is released only when GitLane is active and visible again.</text><rect x="24" y="667" width="20" height="12" rx="3" fill="rgba(191,69,32,0.07)" stroke="#bf4520"/><text x="52" y="677" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start">The decision that keeps the error from expiring unseen</text>
      </svg>
    </div>
  </div>
</body>
</html>
