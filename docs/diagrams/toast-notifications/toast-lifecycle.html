<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a toast moves from shown to gone</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520; --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Toast notifications · State machine</p>
    <h1>How a toast moves from shown to gone</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="toast-lifecycle-title toast-lifecycle-desc">
        <title id="toast-lifecycle-title">How a toast moves from shown to gone</title>
        <desc id="toast-lifecycle-desc">A toast waits on its operation or counts down, is frozen while any hold applies, and plays a 320 ms leaving state before it is removed.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="1000" height="620" fill="#f5f5f5"/>
        <rect width="1000" height="620" fill="url(#dots)" opacity="0.55"/>
        <path d="M48 244 L48 92 Q48 84 56 84 L158 84" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="56" y1="252" x2="158" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M48 260 L48 444 Q48 452 56 452 L158 452" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="270" y1="120" x2="270" y2="214" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="232" y1="288" x2="232" y2="410" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="308" y1="412" x2="308" y2="290" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="382" y1="240" x2="638" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="382" y1="264" x2="638" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M382 84 L742 84 Q750 84 750 92 L750 214" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M382 452 L742 452 Q750 452 750 444 L750 290" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="862" y1="252" x2="934" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="74.5" y="63" width="59" height="14" fill="#f5f5f5"/><text x="104" y="74" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.05em">PROGRESS</text><rect x="81.0" y="231" width="46" height="14" fill="#f5f5f5"/><text x="104" y="242" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.05em">NOTIFY</text><rect x="63.5" y="431" width="85" height="14" fill="#f5f5f5"/><text x="106" y="442" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.05em">ALREADY HELD</text><rect x="278" y="160" width="59" height="14" fill="#f5f5f5"/><text x="282" y="171" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" letter-spacing="0.05em">RESOLVED</text><rect x="146" y="343" width="78" height="14" fill="#f5f5f5"/><text x="220" y="354" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="end" letter-spacing="0.05em">HOLD STARTS</text><rect x="316" y="343" width="91" height="14" fill="#f5f5f5"/><text x="320" y="354" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="start" letter-spacing="0.05em">ALL HOLDS END</text><rect x="483.5" y="219" width="53" height="14" fill="#f5f5f5"/><text x="510" y="230" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.05em">TIME UP</text><rect x="471.0" y="271" width="78" height="14" fill="#f5f5f5"/><text x="510" y="282" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.05em">× OR ACTION</text><rect x="511.0" y="63" width="98" height="14" fill="#f5f5f5"/><text x="560" y="74" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.05em">OPERATION ENDS</text><rect x="521.0" y="431" width="78" height="14" fill="#f5f5f5"/><text x="560" y="442" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.05em">× OR ACTION</text><rect x="875.0" y="231" width="46" height="14" fill="#f5f5f5"/><text x="898" y="242" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle" letter-spacing="0.05em">320 MS</text><circle cx="48" cy="252" r="6" fill="#2d3142"/><circle cx="944" cy="252" r="8" fill="none" stroke="#2d3142" stroke-width="1.2"/><circle cx="944" cy="252" r="5" fill="#2d3142"/><rect x="160" y="48" width="220" height="72" rx="8" fill="#f5f5f5"/><rect x="160" y="48" width="220" height="72" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="270.0" y="74" fill="#2d3142" font-size="13.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Waiting on the operation</text><text x="270.0" y="93" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">kind progress</text><text x="270.0" y="108" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">no countdown, no close</text><rect x="160" y="216" width="220" height="72" rx="8" fill="#f5f5f5"/><rect x="160" y="216" width="220" height="72" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="270.0" y="242" fill="#2d3142" font-size="13.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Counting down</text><text x="270.0" y="261" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">default 5 s · warning 8 s</text><text x="270.0" y="276" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">action 10 s · error 12 s</text><rect x="160" y="412" width="220" height="80" rx="8" fill="#f5f5f5"/><rect x="160" y="412" width="220" height="80" rx="8" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="270.0" y="438" fill="#2d3142" font-size="13.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Held</text><text x="270.0" y="457" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">pointer · focus</text><text x="270.0" y="472" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">selection · window</text><rect x="640" y="216" width="220" height="72" rx="8" fill="#f5f5f5"/><rect x="640" y="216" width="220" height="72" rx="8" fill="rgba(191,69,32,0.07)" stroke="#bf4520" stroke-width="1"/><text x="750.0" y="242" fill="#bf4520" font-size="13.5" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Leaving</text><text x="750.0" y="261" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">fades left, row collapses</text><text x="750.0" y="276" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="400" text-anchor="middle">in leaving list, inert</text><text x="24" y="540" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start">A duration set by the caller replaces the default: push success 5 s, checkout output 15 s.</text><text x="24" y="560" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start">Held keeps the remaining time and continues only when no hold is left. A toast dropped by the four-card limit is removed at once.</text><circle cx="34" cy="593" r="5" fill="#2d3142"/><text x="52" y="597" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start">Toast shown</text><circle cx="160" cy="593" r="7" fill="none" stroke="#2d3142"/><circle cx="160" cy="593" r="4" fill="#2d3142"/><text x="178" y="597" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start">Removed</text><rect x="252" y="587" width="20" height="12" rx="3" fill="rgba(191,69,32,0.07)" stroke="#bf4520"/><text x="280" y="597" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" font-weight="400" text-anchor="start">State added by this change</text>
      </svg>
    </div>
  </div>
</body>
</html>
