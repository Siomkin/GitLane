<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A branch paused in a rebase is still in use</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520; --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Branch claims · Before / after</p>
    <h1>A branch paused in a rebase is still in use</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="claim-before-after-title claim-before-after-desc">
        <title id="claim-before-after-title">A branch paused in a rebase is still in use</title>
        <desc id="claim-before-after-desc">Before: a worktree paused in a rebase is listed as detached, so GitLane found no worktree holding the branch and deleted it while the rebase was still running. After: GitLane also reads each worktree's rebase and bisect state through branch_claim, refuses the deletion with a message naming the rebase and the worktree, and the rebase can continue on its branch.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="1000" height="700" fill="#f5f5f5"/>
        <rect width="1000" height="700" fill="url(#dots)" opacity="0.55"/>
        <line x1="130" y1="96" x2="130" y2="596" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <line x1="400" y1="96" x2="400" y2="596" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <line x1="640" y1="96" x2="640" y2="596" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <line x1="870" y1="96" x2="870" y2="596" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <rect x="40" y="40" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="40" width="180" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="130" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Linked worktree</text>
        <text x="130" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git rebase, paused</text>
        <rect x="310" y="40" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="310" y="40" width="180" height="56" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
        <text x="400" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Worktree state</text>
        <text x="400" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">worktree list · rebase-merge</text>
        <rect x="550" y="40" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="550" y="40" width="180" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="640" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">GitLane</text>
        <text x="640" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">delete_branch</text>
        <rect x="780" y="40" width="180" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="780" y="40" width="180" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="870" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Branch ref</text>
        <text x="870" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">refs/heads/feature</text>
        <rect x="24" y="116" width="952" height="208" rx="6" fill="none" stroke="rgba(45,49,66,0.14)" stroke-dasharray="3,4"/>
        <rect x="36" y="108" width="62" height="16" fill="#f5f5f5"/>
        <text x="43" y="120" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="600">BEFORE</text>
        <line x1="130" y1="160" x2="398" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="185.55" y="141" width="156.9" height="14" fill="#f5f5f5"/>
        <text x="264.0" y="152" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">PAUSED, HEAD DETACHED</text>
        <line x1="640" y1="196" x2="402" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="435.65" y="177" width="170.70000000000002" height="14" fill="#f5f5f5"/>
        <text x="521.0" y="188" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">IS FEATURE CHECKED OUT?</text>
        <line x1="400" y1="232" x2="638" y2="232" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="444.0" y="213" width="150.0" height="14" fill="#f5f5f5"/>
        <text x="519.0" y="224" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">NO WORKTREE LISTS IT</text>
        <line x1="640" y1="268" x2="862" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="724.3" y="249" width="53.400000000000006" height="14" fill="#f5f5f5"/>
        <text x="751.0" y="260" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">DELETE</text>
        <path d="M863 261 L877 275 M877 261 L863 275" stroke="#2d3142" stroke-width="2"/>
        <rect x="35" y="256" width="190" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="35" y="256" width="190" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="#2d3142" stroke-width="1"/>
        <text x="130" y="274" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Rebase still running</text>
        <text x="130" y="290" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">its branch is gone</text>
        <rect x="24" y="340" width="952" height="240" rx="6" fill="none" stroke="rgba(45,49,66,0.14)" stroke-dasharray="3,4"/>
        <rect x="36" y="332" width="54" height="16" fill="#f5f5f5"/>
        <text x="43" y="344" fill="#bf4520" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="600">AFTER</text>
        <line x1="130" y1="384" x2="398" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="185.55" y="365" width="156.9" height="14" fill="#f5f5f5"/>
        <text x="264.0" y="376" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">PAUSED, HEAD DETACHED</text>
        <line x1="640" y1="424" x2="402" y2="424" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="425.3" y="405" width="191.4" height="14" fill="#f5f5f5"/>
        <text x="521.0" y="416" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">DOES ANY WORKTREE HOLD IT?</text>
        <line x1="400" y1="462" x2="638" y2="462" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
        <rect x="468.15" y="443" width="101.7" height="14" fill="#f5f5f5"/>
        <text x="519.0" y="454" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">BEING REBASED</text>
        <rect x="440" y="492" width="400" height="62" rx="6" fill="#f5f5f5"/>
        <rect x="440" y="492" width="400" height="62" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
        <text x="640" y="514" fill="#bf4520" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">branch_claim refuses, the ref stays</text>
        <text x="640" y="535" fill="#2d3142" font-size="10.5" font-family="'Geist', sans-serif" text-anchor="middle">Cannot delete branch feature: it is being rebased in the worktree at …</text>
        <rect x="35" y="510" width="190" height="44" rx="6" fill="#f5f5f5"/>
        <rect x="35" y="510" width="190" height="44" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="130" y="528" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">rebase --continue</text>
        <text x="130" y="544" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">finishes on feature</text>
        <text x="24" y="624" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">A branch counts as held when a worktree has it checked out, is rebasing it, has queued it with rebase --update-refs, or started a bisect from it.</text>
        <text x="24" y="644" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Squashing a branch that isn't checked out runs the same check, twice: before building the new commits and again just before moving the ref.</text>
        <text x="24" y="664" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Delete branch and worktree checks the other worktrees before removing anything, and all worktrees again after the removal.</text>
        <line x1="24" y1="682" x2="44" y2="682" stroke="#bf4520" stroke-width="1.2"/>
        <text x="50" y="686" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="start">new in this change</text>
      </svg>
    </div>
  </div>
</body>
</html>
