<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>When the update indicator appears</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 920px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Software update · Flowchart</p>
    <h1>When the update indicator appears</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 920 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skip-flowchart-title skip-flowchart-desc">
        <title id="skip-flowchart-title">When the update indicator appears</title>
        <desc id="skip-flowchart-desc">What an update check does with its result: no newer build means up to date; a manual check always offers the newer build; the launch check stays silent when the build is exactly the version the user skipped, and otherwise offers it with the titlebar indicator. Choosing Skip this version saves that version, so the next launch check is silent about it.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- ARROWS -->
        <line x1="400" y1="100" x2="400" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="272" y1="168" x2="216" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="400" y1="212" x2="400" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 272 284 L 136 284 L 136 496 L 296 496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="400" y1="328" x2="400" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="528" y1="400" x2="636" y2="400" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="400" y1="444" x2="400" y2="468" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="400" y1="520" x2="400" y2="564" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 528 588 L 760 588 L 760 428" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- ARROW LABELS -->
        <rect x="232" y="162" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="244" y="171" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
        <rect x="406" y="220" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="420" y="229" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
        <rect x="148" y="266" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="196" y="275" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO · MANUAL CHECK</text>
        <rect x="406" y="336" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="420" y="345" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
        <rect x="568" y="382" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="582" y="391" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">YES</text>
        <rect x="408" y="450" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="420" y="459" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO</text>
        <rect x="404" y="536" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="456" y="545" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SKIP THIS VERSION</text>
        <rect x="588" y="570" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="644" y="579" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEXT LAUNCH CHECK</text>

        <!-- NODES -->
        <rect x="292" y="52" width="216" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="292" y="52" width="216" height="48" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="73" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Update check finds a result</text>
        <text x="400" y="88" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">check_update_on_channel</text>
        <polygon points="400,124 528,168 400,212 272,168" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="165" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Is a newer build</text>
        <text x="400" y="179" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">offered?</text>
        <rect x="56" y="144" width="160" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="144" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="136" y="165" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Up to date</text>
        <text x="136" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">upToDate · throttle stamped</text>
        <polygon points="400,240 528,284 400,328 272,284" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="281" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Started by the</text>
        <text x="400" y="295" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">launch check?</text>
        <polygon points="400,356 528,400 400,444 272,400" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="400" y="397" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Exactly the version</text>
        <text x="400" y="411" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">the user skipped?</text>
        <rect x="636" y="376" width="248" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="636" y="376" width="248" height="52" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="760" y="397" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stay silent</text>
        <text x="760" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">idle · throttle stamped · handle freed</text>
        <rect x="296" y="468" width="208" height="52" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="468" width="208" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="489" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Offered</text>
        <text x="400" y="504" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">available · indicator lit</text>
        <rect x="272" y="564" width="256" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="272" y="564" width="256" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="400" y="585" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Version skipped</text>
        <text x="400" y="600" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">skippedUpdateVersion saved</text>

        <!-- FOOTNOTE -->
        <text x="44" y="652" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Only an exact version match is silent: a newer release than the skipped one is offered as usual. "Stay silent" leaves the About card on "Check for updates", never "You're up to date".</text>
        <text x="44" y="666" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">"Skip this version" exists only while an update is offered, never while it downloads or waits for a relaunch; it also closes the What's new dialog. "Later" only closes the dialog.</text>

        <!-- LEGEND -->
        <line x1="44" y1="688" x2="876" y2="688" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="44" y="704" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="44" y="716" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="64" y="724" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">New in this change</text>
        <line x1="176" y1="722" x2="204" y2="722" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="212" y="724" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Next step</text>
        <line x1="288" y1="722" x2="316" y2="722" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="324" y="724" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">On a later launch</text>
      </svg>
    </div>
  </div>
</body>
</html>
