<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seeing what's new before updating</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 920px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Software update · Sequence</p>
    <h1>Seeing what's new before updating</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 920 724" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="notes-sequence-title notes-sequence-desc">
        <title id="notes-sequence-title">Seeing what's new before updating</title>
        <desc id="notes-sequence-desc">Opening the What's new dialog from the titlebar update indicator: the webview asks list_release_notes, once per offered version, for the releases after the running version up to the offered one; Rust fetches the public GitHub Releases list, filters it by channel and version, strips the installer boilerplate and returns the notes. If the request fails, the dialog shows a GitHub link and the update stays installable.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- LIFELINES: 120, 320, 560, 800 -->
        <line x1="120" y1="128" x2="120" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="320" y1="128" x2="320" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="560" y1="128" x2="560" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="800" y1="128" x2="800" y2="560" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ALT: fetched / failed (Webview .. list_release_notes) -->
        <rect x="332" y="372" width="272" height="112" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="332" y="372" width="32" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="348" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
        <text x="372" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[fetched]</text>
        <line x1="332" y1="428" x2="604" y2="428" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="340" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[offline, rate-limited or non-2xx]</text>

        <!-- ACTIVATION BARS -->
        <rect x="316" y="164" width="8" height="364" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="556" y="244" width="8" height="220" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="0.8"/>
        <rect x="796" y="272" width="8" height="36" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- MESSAGES -->
        <line x1="120" y1="168" x2="316" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 324 192 L 348 192 Q 356 192 356 200 L 356 208 Q 356 216 348 216 L 324 216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="324" y1="248" x2="556" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="564" y1="276" x2="796" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="796" y1="304" x2="564" y2="304" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M 564 328 L 588 328 Q 596 328 596 336 L 596 344 Q 596 352 588 352 L 564 352" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="556" y1="408" x2="324" y2="408" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
        <line x1="556" y1="464" x2="324" y2="464" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="120" y1="516" x2="316" y2="516" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- MESSAGE LABELS -->
        <rect x="172" y="150" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="220" y="159" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPEN WHAT'S NEW</text>

        <rect x="364" y="198" width="132" height="12" rx="2" fill="#f5f5f5"/>
        <text x="430" y="207" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ONCE PER OFFERED VERSION</text>

        <rect x="364" y="230" width="152" height="12" rx="2" fill="#f5f5f5"/>
        <text x="440" y="239" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CURRENT, OFFERED, BETA</text>

        <rect x="608" y="258" width="144" height="12" rx="2" fill="#f5f5f5"/>
        <text x="680" y="267" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GET /RELEASES?PER_PAGE=50</text>

        <rect x="644" y="286" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="680" y="295" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON PAGE</text>

        <rect x="604" y="334" width="176" height="12" rx="2" fill="#f5f5f5"/>
        <text x="692" y="343" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILTER · ORDER · CAP 10 · STRIP</text>

        <rect x="396" y="390" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="440" y="399" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RELEASENOTES</text>

        <rect x="404" y="446" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="440" y="455" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ERROR</text>

        <rect x="156" y="498" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="220" y="507" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INSTALL · SKIP · LATER</text>

        <!-- ACTORS -->
        <rect x="44" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="44" y="72" width="152" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="52" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="66" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="120" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User</text>
        <text x="120" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">titlebar update icon</text>

        <rect x="236" y="72" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="236" y="72" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="244" y="80" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="254" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="320" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Webview</text>
        <text x="320" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WhatsNewDialog · useUpdates</text>

        <rect x="472" y="72" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="472" y="72" width="176" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="480" y="80" width="24" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="492" y="89" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IPC</text>
        <text x="560" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">list_release_notes</text>
        <text x="560" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Rust · release_notes.rs</text>

        <rect x="716" y="72" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="716" y="72" width="168" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="724" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="738" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="800" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GitHub Releases API</text>
        <text x="800" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">public, no sign-in</text>

        <!-- FOOTNOTE -->
        <text x="44" y="592" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Notes load only when the What's new dialog or the About card shows an offered update, once per offered version; a failed load may retry. They never touch the update's status.</text>
        <text x="44" y="606" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Kept: releases after the running version up to the offered one, newest first; stable leaves out pre-releases, beta keeps them; at most ten, then a link to GitHub.</text>
        <text x="44" y="620" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">The "Desktop builds for GitLane…" line and the "macOS build is unsigned" footer are removed. The GET runs in Rust over UreqTransport (30 s timeout), so the webview CSP is unchanged.</text>
        <text x="44" y="634" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">On ERROR the dialog shows "Couldn't load release notes." with a View on GitHub link, and Install update still works.</text>

        <!-- LEGEND -->
        <line x1="44" y1="660" x2="876" y2="660" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="44" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="44" y="692" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="64" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">New in this change</text>

        <rect x="176" y="688" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="188" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Activation</text>

        <line x1="272" y1="698" x2="300" y2="698" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="308" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call</text>

        <line x1="360" y1="698" x2="388" y2="698" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="396" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

        <line x1="464" y1="698" x2="492" y2="698" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
        <text x="500" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Notes reach the dialog</text>
      </svg>
    </div>
  </div>
</body>
</html>
