<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A PR write first reads the pull request back</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520; --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', 'Noto Serif', serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">PR write target · Sequence</p>
    <h1>A PR write first reads the pull request back</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1000 736" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pr-write-read-back-title pr-write-read-back-desc">
        <title id="pr-write-read-back-title">A PR write first reads the pull request back</title>
        <desc id="pr-write-read-back-desc">A PR write sends the number and the selected row URL; check_then_write reads the current URL from the provider and runs the write only if the two match, otherwise the write is refused.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="1000" height="736" fill="#f5f5f5"/>
        <rect width="1000" height="736" fill="url(#dots)" opacity="0.55"/>
        <rect x="24" y="352" width="952" height="236" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)"/>
        <line x1="120" y1="96" x2="120" y2="588" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <line x1="380" y1="96" x2="380" y2="588" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <line x1="640" y1="96" x2="640" y2="588" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <line x1="880" y1="96" x2="880" y2="588" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="2,4"/>
        <rect x="24" y="352" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)"/>
        <text x="44" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ALT</text>
        <rect x="24" y="40" width="192" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="24" y="40" width="192" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="120" y="63" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">PR row</text>
        <text x="120" y="81" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">PrMergeMenu, writes.ts</text>
        <rect x="284" y="40" width="192" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="284" y="40" width="192" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="380" y="63" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">checked_forge_op</text>
        <text x="380" y="81" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">github.rs</text>
        <rect x="544" y="40" width="192" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="544" y="40" width="192" height="56" rx="6" fill="rgba(191,69,32,0.06)" stroke="#bf4520" stroke-width="1"/>
        <text x="640" y="63" fill="#bf4520" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">check_then_write</text>
        <text x="640" y="81" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">write_target.rs</text>
        <rect x="784" y="40" width="192" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="784" y="40" width="192" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="880" y="63" fill="#2d3142" font-size="13" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">GithubProvider</text>
        <text x="880" y="81" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">forge CLI or REST</text>
        <line x1="120" y1="140" x2="378" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="201.3" y="119" width="97.39999999999999" height="14" fill="#f5f5f5"/>
        <text x="250.0" y="130" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">NUMBER, PR_URL</text>
        <text x="394" y="180" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">resolves provider and repository once</text>
        <line x1="380" y1="216" x2="638" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="461.3" y="195" width="97.39999999999999" height="14" fill="#f5f5f5"/>
        <text x="510.0" y="206" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">TARGETS, WRITE</text>
        <line x1="640" y1="256" x2="878" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="711.3" y="235" width="97.39999999999999" height="14" fill="#f5f5f5"/>
        <text x="760.0" y="246" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">PR_URL(NUMBER)</text>
        <line x1="880" y1="296" x2="642" y2="296" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="720.45" y="275" width="79.1" height="14" fill="#f5f5f5"/>
        <text x="760.0" y="286" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">CURRENT URL</text>
        <text x="626" y="332" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="end">compares, ignoring case and a trailing slash</text>
        <rect x="72" y="354" width="88" height="15" fill="#f5f5f5"/>
        <text x="76" y="365" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start">[URL matches]</text>
        <line x1="640" y1="412" x2="878" y2="412" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="729.6" y="391" width="60.8" height="14" fill="#f5f5f5"/>
        <text x="760.0" y="402" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">MERGE_PR</text>
        <line x1="880" y1="456" x2="122" y2="456" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="485.7" y="435" width="48.599999999999994" height="14" fill="#f5f5f5"/>
        <text x="510" y="446" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">RESULT</text>
        <line x1="32" y1="484" x2="968" y2="484" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="72" y="495" width="214" height="15" fill="#f5f5f5"/>
        <text x="76" y="506" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start">[different, empty, or read failed]</text>
        <line x1="640" y1="548" x2="122" y2="548" stroke="#bf4520" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
        <rect x="482.65" y="527" width="54.699999999999996" height="14" fill="#f5f5f5"/>
        <text x="510" y="538" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">REFUSED</text>
        <text x="510" y="566" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">error shown; refresh the list and retry</text>
        <rect x="796" y="522" width="168" height="46" rx="6" fill="#f5f5f5"/>
        <rect x="796" y="522" width="168" height="46" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="880" y="541" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">The write never runs</text>
        <text x="880" y="558" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle">merge_pr is not called</text>
        <text x="24" y="620" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Before: the write sent only the number, so after a repository or remote change it could land on a different pull request.</text>
        <text x="24" y="640" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Merge stack, Approve, Close, Reopen, Ready and Resolve thread take this same path. The URL comes from the row the user clicked.</text>
        <text x="24" y="660" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">Linking a stack checks every number against its own URL, and one mismatch stops the whole link.</text>
        <text x="24" y="680" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="start">PR_URL reads only the pull request record, so an oversized diff cannot block a write.</text>
        <line x1="24" y1="698" x2="44" y2="698" stroke="#bf4520" stroke-width="1.2"/>
        <text x="50" y="702" fill="#bf4520" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="start">new in this change</text>
      </svg>
    </div>
  </div>
</body>
</html>
