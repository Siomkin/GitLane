name: Set up pinned Rust
description: Install the Rust channel declared by the repository toolchain file

inputs:
  components:
    description: Optional comma-separated Rust components
    required: false
    default: ""
  targets:
    description: Optional comma-separated compilation targets
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Read repository toolchain
      id: toolchain
      shell: bash
      run: |
        CHANNEL=$(awk -F'"' '/^channel =/ { print $2; exit }' rust-toolchain.toml)
        if [[ ! "$CHANNEL" =~ ^[0-9A-Za-z._+-]+$ ]]; then
          echo "Invalid or missing channel in rust-toolchain.toml."
          exit 1
        fi
        echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

    # Jobs can share a rustup home, and rustup does not lock it: install under
    # a lock first, so the step below changes nothing. GitHub-hosted machines
    # run one job each.
    - name: Pre-install Rust ${{ steps.toolchain.outputs.channel }} under the rustup home lock
      if: runner.environment == 'self-hosted'
      shell: bash
      env:
        CHANNEL: ${{ steps.toolchain.outputs.channel }}
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: bash "$GITHUB_ACTION_PATH/install-locked.sh"

    - name: Install Rust ${{ steps.toolchain.outputs.channel }}
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
