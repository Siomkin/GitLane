name: Check out PR merge ref
description: On pull_request_target, re-checkout the untrusted merge ref and fail if the PR head moved. Inert on every other event — the caller's github.sha checkout is already the right tree. Callers must checkout github.sha first so this local composite exists on disk.

runs:
  using: composite
  steps:
    # v7 refuses a refs/pull/N/merge checkout when the head repo differs from
    # the base repo, so this step is where a FORK PR fails — by design, see the
    # threat-model note in ci.yml. Same-repo PRs are exempt. Adding
    # `allow-unsafe-pr-checkout: true` here restores fork CI and accepts the
    # pwn-request risk; do that deliberately, not to un-red a fork PR.
    - if: github.event_name == 'pull_request_target'
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        ref: refs/pull/${{ github.event.pull_request.number }}/merge
        # Depth 2 keeps the merge ref's parents available for the check below.
        fetch-depth: 2
        persist-credentials: false

    # refs/pull/N/merge is mutable: it re-resolves at checkout time, while the
    # runner decision was made from the event payload. Fail if the PR head
    # moved in between so a late push can't ride an already-trusted run.
    - name: Verify merge ref still matches the scheduled head
      if: github.event_name == 'pull_request_target'
      shell: bash
      env:
        EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD_SHA" || {
          echo "PR head changed after this run was scheduled; the synchronize run supersedes this one."
          exit 1
        }
