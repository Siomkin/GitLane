name: Docs

# The published site tracks releases, not `latest`: a merge only proves the
# docs build, a release tag is what promotes them. `workflow_dispatch` is the
# escape hatch for fixing published docs between releases. No `paths` filter on
# push — path filtering is unreliable for tag pushes, and the check is cheap.
on:
  push:
    branches: [latest]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # No workflow-level `paths:` on PRs either: a path-filtered workflow never
  # reports, so a required "Lint + build" would sit Pending on every non-docs PR.
  # The `changes` job filters instead, and a skipped job reports Success.
  pull_request:
    branches: [latest]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  # A push to latest or a release tag always finishes; only PR runs cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deliberately NOT `pull_request_target`: this workflow reads a Cloudflare
# token, and the deploy job must never be reachable from fork-PR code. The
# check job runs untrusted PR code but holds no secrets; the deploy job holds
# the secret but only ever runs on a release tag or a manual dispatch.
permissions:
  contents: read

defaults:
  run:
    working-directory: docs-site

jobs:
  changes:
    name: Detect docs changes
    # Drafts skip; `ready_for_review` runs it.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.docs }}
    steps:
      # On PRs paths-filter reads the changed files from the API, so no checkout.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            docs:
              - 'docs-site/**'
              - '.github/workflows/docs.yml'

  check:
    name: Lint + build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      # astro checks the Node version; don't inherit the runner image's (22.23.3 broke astro 7.4.2).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      # nimbus-docs >= 0.17 lints against .nimbus/ files that `astro build` writes.
      - run: bun run lint:docs

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      # astro checks the Node version; don't inherit the runner image's (22.23.3 broke astro 7.4.2).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned to the version `docs-site/bun.lock` resolves, so a deploy
          # never depends on the action's default: v3 of the action installed
          # Wrangler v3 against this v4-era `wrangler.jsonc`, and v4 silently
          # switched that default to `latest`. This job only runs on stable
          # release tags, so a surprise here would surface mid-release.
          wranglerVersion: "4.151.3"
          workingDirectory: docs-site
          command: deploy
