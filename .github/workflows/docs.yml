name: Docs

# The published site tracks releases, not `latest`: a merge only proves the
# docs build, a release tag is what promotes them. `workflow_dispatch` is the
# escape hatch for fixing published docs between releases. No `paths` filter on
# push — path filtering is unreliable for tag pushes, and the check is cheap.
on:
  push:
    branches: [latest]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [latest]
    paths: ["docs-site/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Deliberately NOT `pull_request_target`: this workflow reads a Cloudflare
# token, and the deploy job must never be reachable from fork-PR code. The
# check job runs untrusted PR code but holds no secrets; the deploy job holds
# the secret but only ever runs on a release tag or a manual dispatch.
permissions:
  contents: read

defaults:
  run:
    working-directory: docs-site

jobs:
  check:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.2.20"
      - run: bun install --frozen-lockfile
      - run: bun run lint:docs
      - run: bun run typecheck
      - run: bun run build

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: docs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.2.20"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned to the version `docs-site/bun.lock` resolves, so a deploy
          # never depends on the action's default: v3 of the action installed
          # Wrangler v3 against this v4-era `wrangler.jsonc`, and v4 silently
          # switched that default to `latest`. This job only runs on stable
          # release tags, so a surprise here would surface mid-release.
          wranglerVersion: "4.114.0"
          workingDirectory: docs-site
          command: deploy
