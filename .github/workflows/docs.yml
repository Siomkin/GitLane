name: Docs

# The published site tracks releases, not `latest`: a merge only proves the
# docs build, a release tag is what promotes them. `workflow_dispatch` is the
# escape hatch for fixing published docs between releases. No `paths` filter on
# push — path filtering is unreliable for tag pushes, and the check is cheap.
on:
  push:
    branches: [latest]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [latest]
    paths: ["docs-site/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Deliberately NOT `pull_request_target`: this workflow reads a Cloudflare
# token, and the deploy job must never be reachable from fork-PR code. The
# check job runs untrusted PR code but holds no secrets; the deploy job holds
# the secret but only ever runs on a release tag or a manual dispatch.
permissions:
  contents: read

defaults:
  run:
    working-directory: docs-site

jobs:
  check:
    name: Lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"
      - run: bun install --frozen-lockfile
      - run: bun run lint:docs
      - run: bun run typecheck
      - run: bun run build

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: docs
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.20"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs-site
          command: deploy
