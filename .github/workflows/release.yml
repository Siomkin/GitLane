name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.0. Required: the tag alone carries the version (the tree's manifests are not bumped per release)."
        required: true
        type: string
      manifest_only:
        description: "Only repoint the rolling beta manifest to an existing public release."
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Self-hosted runners may export a host-level CARGO_TARGET_DIR. Tauri's CLI
  # honors it, but tauri-action discovers release artifacts under
  # src-tauri/target, so keep the build output at that path. On self-hosted legs
  # that path is a symlink into a persistent dir (see "Use persistent build dir"
  # in release-app), which keeps the compile warm across releases.
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target

jobs:
  preflight:
    name: Release preflight
    if: github.event_name != 'workflow_dispatch' || !inputs.manifest_only
    # Run preflight on the self-hosted Mac mini so a release fails before the
    # matrix if the macOS runner is unavailable or not started from the GUI
    # session needed for DMG packaging. (GL-78)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 35
    outputs:
      release_tag: ${{ steps.release-tag.outputs.release_tag }}
      release_commit: ${{ steps.release-commit.outputs.release_commit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha) }}
          fetch-depth: 0

      # Keep setup logic in the workflow definition rather than a repository-local
      # action from the checked-out build tree: historical release tags predate
      # `.github/actions/setup-rust`. Those tags originally built on `stable`, while
      # newer trees declare an exact channel in rust-toolchain.toml.
      - name: Resolve release Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          CHANNEL=stable
          if [[ -f rust-toolchain.toml ]]; then
            CHANNEL=$(awk -F'"' '/^channel =/ { print $2; exit }' rust-toolchain.toml)
          fi
          if [[ ! "$CHANNEL" =~ ^[0-9A-Za-z._+-]+$ ]]; then
            echo "Invalid Rust channel in release tree."
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.rust-toolchain.outputs.channel }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      # No Rust cache here: preflight compiles nothing (see the note at the end of
      # this job), so restoring a target-dir archive was pure wasted minutes.

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release tag
        id: release-tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_TAG" ]]; then
            RELEASE_TAG="$DISPATCH_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            # No fallback to the tree's app version: the manifests are stamped
            # from the tag at build time (GL-288), so the checked-in version is
            # a source-build baseline and must never name a release.
            echo "A release needs an explicit v* tag (tag push or dispatch input)."
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "Missing release tag."
            exit 1
          fi
          # Allow an optional SemVer pre-release suffix (e.g. v0.2.0-beta.1) so
          # beta/rc builds can ship on the beta channel (GL-76); a bare
          # vMAJOR.MINOR.PATCH is still the stable form.
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z][0-9A-Za-z]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z][0-9A-Za-z]*))*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG (expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease, e.g. v0.2.0-beta.1)"
            exit 1
          fi
          # Cargo's SemVer parser stores numeric identifiers as u64. Reject an
          # otherwise well-shaped tag here instead of discovering overflow only
          # after the draft release and build matrix have started.
          # shellcheck disable=SC2016
          bun -e '
            try {
              const version = process.env.RELEASE_TAG.slice(1);
              const dash = version.indexOf("-");
              const core = dash === -1 ? version : version.slice(0, dash);
              const prerelease = dash === -1 ? "" : version.slice(dash + 1);
              const max = 18_446_744_073_709_551_615n;
              const numeric = [
                ...core.split("."),
                ...prerelease.split(".").filter((part) => /^[0-9]+$/.test(part)),
              ];
              for (const part of numeric) {
                if (BigInt(part) > max) throw new Error(`numeric identifier exceeds u64: ${part}`);
              }
            } catch (error) {
              console.error(`Invalid Cargo-compatible release tag ${process.env.RELEASE_TAG}:`, error);
              process.exit(1);
            }
          '

      # The version is no longer maintained by hand in the tree: each build leg
      # stamps the tag's version into the manifests before building (see "Stamp
      # app version from release tag" in release-app), so tagging a current
      # `latest` commit is the whole release trigger — no bump PR.

      - name: Resolve and validate release commit
        id: release-commit
        run: |
          git fetch --no-tags origin latest:refs/remotes/origin/latest
          if ! git fetch --no-tags origin \
            "refs/tags/$RELEASE_TAG:refs/gitlane-release/$RELEASE_TAG"
          then
            echo "Release tag $RELEASE_TAG must already exist on origin."
            echo "Create it from a commit on latest; the workflow never creates release tags."
            exit 1
          fi
          RELEASE_COMMIT=$(git rev-parse "refs/gitlane-release/$RELEASE_TAG^{commit}")
          CHECKED_OUT_COMMIT=$(git rev-parse HEAD)
          if [[ "$CHECKED_OUT_COMMIT" != "$RELEASE_COMMIT" ]]; then
            echo "Checked-out commit $CHECKED_OUT_COMMIT does not match release commit $RELEASE_COMMIT."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/latest; then
            echo "Release tag $RELEASE_TAG must publish a commit reachable from origin/latest."
            echo "Merge the release commit to latest before tagging or re-running this workflow."
            exit 1
          fi
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

      # Fail fast with a clear message instead of letting the bundle step die
      # opaquely: createUpdaterArtifacts is always on, so a missing/empty signing
      # secret would otherwise surface as a confusing minisign error per platform.
      - name: Validate updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "createUpdaterArtifacts is enabled but TAURI_SIGNING_PRIVATE_KEY is not set."
            echo "Add TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD) as repo secrets — see GL-24."
            exit 1
          fi
          # The GL-24 key is password-encrypted, so the bundler needs the password too.
          # Without it the minisign step still fails — just late and opaquely, per
          # platform — which is exactly what this preflight exists to prevent.
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is set but TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not."
            echo "The updater key is encrypted — add TAURI_SIGNING_PRIVATE_KEY_PASSWORD as a repo secret (see GL-24)."
            exit 1
          fi

      # No test/build steps here on purpose. The "Validate release tag is on
      # latest" step above proves this commit is already reachable from `latest`,
      # and `latest` only advances through CI-passed PRs (ci.yml runs the
      # frontend typecheck+build+tests and the Rust/desktop build on every push
      # to latest). Re-running `bun run build` / `bun run test` / `cargo test`
      # here would test a tree CI already validated — and block the whole build
      # matrix behind a redundant full re-test on the Mac runner. Preflight is
      # now pure release-specific validation (tag shape, Cargo compatibility,
      # on-latest, signing secrets); the matrix legs do the real artifact build.

  prepare-release:
    name: Prepare private release draft
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create or validate the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.release_tag }}
          COMMIT: ${{ needs.preflight.outputs.release_commit }}
        run: |
          # Version tags are protected from update/deletion by the repository's
          # active tag ruleset. Re-read the remote ref immediately before release
          # creation and prove its peeled commit still matches every build leg.
          git fetch --no-tags --force origin \
            "refs/tags/$TAG:refs/gitlane-release/$TAG"
          TAG_COMMIT=$(git rev-parse "refs/gitlane-release/$TAG^{commit}")
          if [[ "$TAG_COMMIT" != "$COMMIT" ]]; then
            echo "Remote tag $TAG resolves to $TAG_COMMIT, not validated release commit $COMMIT."
            exit 1
          fi

          if IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "Release $TAG is already public; refusing to mutate it from a matrix rerun."
              exit 1
            fi
            echo "Resuming existing draft release $TAG."
            exit 0
          fi

          PRERELEASE_ARGS=()
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            "${PRERELEASE_ARGS[@]}" \
            --title "GitLane $TAG" \
            --notes "Desktop builds for GitLane. Not sure which file to download? See the [install guide](https://github.com/Siomkin/GitLane#install)." \
            --generate-notes

  release-app:
    name: Release app (${{ matrix.name }})
    needs: [preflight, prepare-release]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Runner assignment: the macOS + Linux legs build on self-hosted runners
        # (Mac mini `mac-gitlane`, Ubuntu host `linux-gitlane`) to save the 10x-billed
        # macOS minutes and the heavy Linux Tauri compile. Windows stays GitHub-hosted.
        # These legs only run on tag / workflow_dispatch (maintainer-only), so
        # self-hosted is safe even once the repo is public. The Mac runner is started
        # on-demand (`./run.sh`) before a release; the Linux runner is an always-on
        # systemd service. Start the Mac runner BEFORE pushing the tag or the mac legs
        # sit queued waiting for it.
        include:
          - name: linux
            runner: [self-hosted, Linux, X64]
            args: ""
          - name: macos-arm64
            runner: [self-hosted, macOS, ARM64]
            args: "--target aarch64-apple-darwin"
          - name: macos-x86_64
            runner: [self-hosted, macOS, ARM64]
            args: "--target x86_64-apple-darwin"
          - name: windows
            runner: windows-latest
            # NSIS only. The MSI/WiX target can't encode a non-numeric SemVer
            # pre-release identifier (e.g. `0.2.0-beta.2` → the bundler aborts with
            # "optional pre-release identifier ... must be numeric-only and cannot
            # be greater than 65535 for msi target"), so `--targets all` fails on
            # every beta tag. NSIS is Tauri's recommended Windows installer and
            # accepts the full version; the updater artifact still rides the NSIS
            # bundle via bundle.createUpdaterArtifacts. (GL-78)
            args: "--bundles nsis"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_commit }}

      - name: Resolve release Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          CHANNEL=stable
          if [[ -f rust-toolchain.toml ]]; then
            CHANNEL=$(awk -F'"' '/^channel =/ { print $2; exit }' rust-toolchain.toml)
          fi
          if [[ ! "$CHANNEL" =~ ^[0-9A-Za-z._+-]+$ ]]; then
            echo "Invalid Rust channel in release tree."
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.rust-toolchain.outputs.channel }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ startsWith(matrix.name, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Self-hosted legs (linux + both macOS triples): compile into a persistent
      # dir on the box, reused release-to-release — a version bump recompiles only
      # the app crate, not every dependency. tauri-action discovers artifacts under
      # src-tauri/target (see the CARGO_TARGET_DIR note above), so the redirect is
      # a symlink: the path tauri-action reads is unchanged, the contents live in
      # $HOME. checkout's git clean removes the symlink each run (never the
      # contents), so it's recreated here. The two macOS triples coexist inside
      # target/<triple>/release. If a box's disk fills, delete the dir — cargo
      # rebuilds it.
      - name: Use persistent build dir (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          PERSIST="$HOME/.cache/gitlane-release/target"
          mkdir -p "$PERSIST"
          rm -rf src-tauri/target
          ln -sfn "$PERSIST" src-tauri/target

      # GitHub-hosted (windows) still round-trips the GitHub cache API — its disk
      # is ephemeral. Saving is safe here; the old save-if:false existed because
      # saving the packaged target hung on the self-hosted Mac, which no longer
      # uses this step at all.
      - name: Cache Rust build (github-hosted)
        if: runner.environment == 'github-hosted'
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # The tree's manifests are NOT bumped per release (GL-288): the tag alone
      # carries the version, and this step rewrites package.json,
      # src-tauri/tauri.conf.json, src-tauri/Cargo.toml, and the gitlane entry in
      # src-tauri/Cargo.lock in the build checkout before bun install / tauri
      # build read them. That covers every consumer: the bundler/updater version
      # (tauri.conf.json), the About box (CARGO_PKG_VERSION from Cargo.toml), and
      # artifact names. Runs after setup-bun and uses bun -e — self-hosted legs
      # do not guarantee a system node, and setup-bun only installs bun. Inline
      # rather than a repo script, consistent with the "historical release tags
      # predate repository-local actions" convention above; it's a no-op when
      # the tree already carries the tag's version, so dispatch-rerunning an old
      # hand-bumped tag through this newer workflow still works. RELEASE_TAG is
      # regex-validated in preflight and passed via env, never interpolated.
      - name: Stamp app version from release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          # shellcheck disable=SC2016
          bun -e '
            import * as fs from "node:fs";
            try {
              const version = process.env.RELEASE_TAG.replace(/^v/, "");
              const patch = (path, from) => {
                const before = fs.readFileSync(path, "utf8");
                if (!from.test(before)) throw new Error(`no version field found in ${path}`);
                fs.writeFileSync(path, before.replace(from, `$1${version}$2`));
              };
              const cargoPackageBlock = (text) => {
                const start = text.search(/^\[package\]\r?$/m);
                if (start < 0) throw new Error("no [package] table found in src-tauri/Cargo.toml");
                const tail = text.slice(start + 1);
                const relativeEnd = tail.search(/^\[/m);
                const end = relativeEnd < 0 ? text.length : start + 1 + relativeEnd;
                const block = text.slice(start, end);
                if (!/^name\s*=\s*"gitlane"\s*$/m.test(block)) {
                  throw new Error("src-tauri/Cargo.toml [package] is not gitlane");
                }
                return { start, end, block };
              };
              const cargoPath = "src-tauri/Cargo.toml";
              const cargoBefore = fs.readFileSync(cargoPath, "utf8");
              const cargo = cargoPackageBlock(cargoBefore);
              const cargoAfterBlock = cargo.block.replace(/(^version\s*=\s*")[^"]+(")/m, `$1${version}$2`);
              if (cargoAfterBlock === cargo.block) throw new Error(`no gitlane package version found in ${cargoPath}`);
              fs.writeFileSync(cargoPath, cargoBefore.slice(0, cargo.start) + cargoAfterBlock + cargoBefore.slice(cargo.end));

              patch("package.json", /("version":\s*")[^"]+(")/);
              patch("src-tauri/tauri.conf.json", /("version":\s*")[^"]+(")/);
              patch(
                "src-tauri/Cargo.lock",
                /(\[\[package\]\]\r?\nname = "gitlane"\r?\nversion = ")[^"]+(")/,
              );
              for (const [path, read] of [
                ["package.json", (p) => JSON.parse(fs.readFileSync(p, "utf8")).version],
                ["src-tauri/tauri.conf.json", (p) => JSON.parse(fs.readFileSync(p, "utf8")).version],
                [cargoPath, (p) => cargoPackageBlock(fs.readFileSync(p, "utf8")).block.match(/^version\s*=\s*"([^"]+)"/m)?.[1]],
                ["src-tauri/Cargo.lock", (p) => fs.readFileSync(p, "utf8").match(/\[\[package\]\]\r?\nname = "gitlane"\r?\nversion = "([^"]+)"/)?.[1]],
              ]) {
                const found = read(path);
                if (found !== version) throw new Error(`${path} reads back ${found}, expected ${version}`);
                console.log(`${path}: ${found}`);
              }
            } catch (error) {
              console.error("Failed to stamp release version:", error);
              process.exit(1);
            }
          '

      - name: Install Linux Tauri dependencies
        # Only GitHub-hosted Linux needs this. The self-hosted `linux-gitlane` runner
        # runs as an unprivileged, sudo-less user with these deps preinstalled on the
        # host, so `sudo apt-get` there would fail — runner.environment gates it out.
        if: matrix.name == 'linux' && runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # macOS DMG bundling gotcha (self-hosted Mac mini): `bundle_dmg.sh` (create-dmg)
      # runs an AppleScript `tell application "Finder"` step to lay out the DMG window,
      # which needs the runner to be started from a GUI/Aqua session — a bare SSH
      # `./run.sh` has no WindowServer and the DMG step fails ("error running
      # bundle_dmg.sh"). Start the runner from a console/screen-shared Terminal.app.
      # This step is separate defensive hygiene: both macOS legs share one mini and
      # mount a volume named after productName, so an interrupted prior run can leave
      # /Volumes/GitLane* mounted and make the next `hdiutil attach` fail. (GL-78)
      - name: Detach stale DMG volumes
        if: runner.os == 'macOS'
        run: |
          for vol in /Volumes/GitLane*; do
            [ -e "$vol" ] || continue
            echo "Detaching stale volume: $vol"
            hdiutil detach "$vol" -force || true
          done

      - name: Build and publish release artifact
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only artifacts produced by this workflow may query/install signed
          # updater releases. Source builds keep the checked-in baseline version
          # and identify themselves as rebuild-to-update builds in Settings.
          VITE_GITLANE_OFFICIAL_RELEASE: "1"
          # linuxdeploy + appimagetool are themselves AppImages, which need the
          # FUSE 2 runtime to mount-and-run. Ubuntu 24.04+/26.04 no longer ship
          # libfuse2 by default, so on an upgraded self-hosted runner the AppImage
          # bundle step fails instantly with "failed to run linuxdeploy" while the
          # build, .deb, and .rpm all succeed. Extract-and-run makes those tools
          # self-extract to a temp dir instead of FUSE-mounting, so the AppImage
          # builds with no libfuse2 on the box and survives OS reprovisioning.
          # Only the linux leg runs these tools (empty on the mac/windows legs,
          # which don't touch AppImages).
          APPIMAGE_EXTRACT_AND_RUN: ${{ matrix.name == 'linux' && '1' || '' }}
          # Updater signing (minisign — separate from Apple code signing). With
          # bundle.createUpdaterArtifacts=true the bundler signs the update package
          # with this key and uploads the `.sig` beside it. The manifest that points
          # at them is assembled once in publish-release (GL-370).
          # Both secrets MUST be set on the repo or the macOS/Windows/Linux bundle
          # step fails — see GL-24 for the key (~/.gitlane/updater.key) and password.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code-signing + notarization are intentionally NOT wired here yet.
          # Gotcha: passing `APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}`
          # when the secret is unset yields an *empty* (but present) env var, which
          # Tauri's bundler treats as "sign me" — it then runs `security import` on
          # empty cert data and the macOS leg fails. So we omit the vars entirely
          # and ship unsigned (ad-hoc) macOS builds for the alpha phase.
          #
          # To enable real signing later, set APPLE_CERTIFICATE / *_PASSWORD /
          # APPLE_SIGNING_IDENTITY (+ APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID for
          # notarization) as repo secrets, and add them back here ONLY guarded so an
          # unset secret never produces an empty value (e.g. set them in a prior
          # `if: secrets.APPLE_CERTIFICATE != ''` step via $GITHUB_ENV).
        with:
          tauriScript: bun tauri
          # A pre-release tag (contains a "-", e.g. v0.2.0-beta.1) builds beta
          # artifacts: `--config` swaps the updater endpoint to the beta-channel
          # manifest (GL-76). Absolute path (via github.workspace) so it resolves
          # regardless of the tauri CLI's working dir. Stable tags build unchanged.
          args: ${{ matrix.args }}${{ contains(needs.preflight.outputs.release_tag, '-') && format(' --config {0}/src-tauri/tauri.beta.conf.json', github.workspace) || '' }}
          tagName: ${{ needs.preflight.outputs.release_tag }}
          releaseName: GitLane ${{ needs.preflight.outputs.release_tag }}
          # Keep the install-guide link: the asset list alone gives no guidance on
          # which file to pick (Linux ships three formats — GL-83).
          releaseBody: "Desktop builds for GitLane. Not sure which file to download? See the [install guide](https://github.com/Siomkin/GitLane#install)."
          # Every matrix leg uploads into the same private draft. Publishing from
          # a leg would expose an incomplete release when another platform fails;
          # publish-release flips the draft only after the whole matrix succeeds.
          releaseDraft: true
          # Pre-release tags publish a GitHub pre-release, so the `/latest/` alias
          # (the stable updater endpoint) keeps ignoring them; the beta channel is
          # served separately by the publish-beta-manifest job below.
          prerelease: ${{ contains(needs.preflight.outputs.release_tag, '-') }}
          generateReleaseNotes: true
          # tauri-action@v1 (currently resolved) expects `releaseAssetNamePattern`.
          # `assetNamePattern` is rejected as an unknown input (##[warning] Unexpected
          # input(s) 'assetNamePattern') and ignored, so assets ship under default
          # tauri names (GitLane_<version>_<arch>.<ext>) instead of this pattern. The
          # earlier GL-78 note had the two names swapped for this action version —
          # verified from the release job logs (valid inputs include
          # releaseAssetNamePattern, not assetNamePattern).
          releaseAssetNamePattern: GitLane-[version]-${{ matrix.name }}-[bundle][ext]
          # The legs upload artifacts and their `.sig` files, never latest.json.
          # Each leg used to publish its own merged copy of the manifest, which
          # made four writers of one file: for v2.1.0 the macos-x86_64 upload
          # replaced the arm64 entry instead of merging it, and the release could
          # not be published until the manifest was repaired by hand. The manifest
          # is now written exactly once, in publish-release, from the assets this
          # matrix attached (GL-370).
          uploadUpdaterJson: false

  publish-release:
    name: Publish complete release
    needs: [preflight, release-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # The single writer of latest.json. Every artifact and `.sig` the matrix
      # attached is already on the draft, so the manifest is derived from the
      # release itself rather than merged four times in flight (GL-370).
      - name: Assemble the updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.release_tag }}
          # Mirrors the legs' releaseBody so the manifest's notes keep saying
          # what they said before this job took the manifest over.
          MANIFEST_NOTES: "Desktop builds for GitLane. Not sure which file to download? See the [install guide](https://github.com/Siomkin/GitLane#install)."
        run: |
          rm -rf signatures latest.json assets.json
          mkdir signatures
          gh release download "$TAG" --pattern '*.sig' --dir signatures
          gh release view "$TAG" --json assets --jq '.assets' > assets.json
          node -e '
            const fs = require("fs");
            const version = process.env.TAG.replace(/^v/, "");
            const assets = JSON.parse(fs.readFileSync("assets.json", "utf8"));
            const byName = new Map(assets.map((asset) => [asset.name, asset]));
            // Exact names, not suffix patterns: asset names are unique per
            // release, so an exact lookup cannot be satisfied by a stale asset
            // left from another version or by two assets racing for one key.
            // Keep this table in lockstep with releaseAssetNamePattern above.
            // The bare platform key is what the updater asks for; the suffixed
            // ones let a specific bundle be targeted, and Linux needs deb and
            // rpm as well as the AppImage — an installed .deb offered the
            // AppImage entry would be handed bytes it cannot install.
            const bundles = [
              [`GitLane-${version}-macos-arm64-app.app.tar.gz`, ["darwin-aarch64", "darwin-aarch64-app"]],
              [`GitLane-${version}-macos-x86_64-app.app.tar.gz`, ["darwin-x86_64", "darwin-x86_64-app"]],
              [`GitLane-${version}-linux-appimage.AppImage`, ["linux-x86_64", "linux-x86_64-appimage"]],
              [`GitLane-${version}-linux-deb.deb`, ["linux-x86_64-deb"]],
              [`GitLane-${version}-linux-rpm.rpm`, ["linux-x86_64-rpm"]],
              [`GitLane-${version}-windows-nsis.exe`, ["windows-x86_64", "windows-x86_64-nsis"]],
            ];
            const platforms = {};
            const consumed = new Set();
            for (const [name, targets] of bundles) {
              const bundle = byName.get(name);
              if (!bundle) throw new Error(`${name} is not attached to ${process.env.TAG}`);
              if (!byName.has(`${name}.sig`)) throw new Error(`${name} has no .sig on the release`);
              // A .sig file already holds the base64 signature the manifest
              // carries verbatim. Re-encoding it ships an update no client can
              // verify, so this reads the file and trims the trailing newline
              // an editor or transfer may have added — nothing else.
              const signature = fs.readFileSync(`signatures/${name}.sig`, "utf8").trim();
              if (!signature) throw new Error(`${name}.sig is empty`);
              for (const target of targets) platforms[target] = { signature, url: bundle.apiUrl };
              consumed.add(`${name}.sig`);
            }
            // Fail closed on drift. Silently skipping a signature we do not
            // recognise is how a manifest passes the gate below (it checks only
            // the four bare targets) while a .deb install is quietly left with
            // no update path of its own.
            const stray = assets
              .filter((asset) => asset.name.endsWith(".sig") && !consumed.has(asset.name))
              .map((asset) => asset.name);
            if (stray.length) throw new Error(`unrecognised signature assets: ${stray.join(", ")}`);
            const expected = bundles.flatMap(([, targets]) => targets).sort();
            const built = Object.keys(platforms).sort();
            if (built.join() !== expected.join()) {
              throw new Error(`manifest has ${built.join(", ")}; expected ${expected.join(", ")}`);
            }
            const manifest = {
              version,
              notes: process.env.MANIFEST_NOTES,
              pub_date: new Date().toISOString(),
              platforms,
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
            console.log(`latest.json ${version}: ${built.join(", ")}`);
          '
          # Only reached when the script above validated every entry: the step
          # shell is `bash -e`, so a throw aborts before anything is uploaded.
          gh release upload "$TAG" latest.json --clobber

      - name: Publish the completed draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          # Downloaded back rather than trusting the local copy: this validates
          # the manifest clients will actually fetch.
          rm -f latest.json
          gh release download "$TAG" --pattern latest.json
          MANIFEST_VERSION="${TAG#v}"
          jq -e --arg version "$MANIFEST_VERSION" '.version == $version' latest.json >/dev/null
          for PLATFORM in \
            darwin-aarch64 \
            darwin-x86_64 \
            linux-x86_64 \
            windows-x86_64
          do
            if ! jq -e --arg platform "$PLATFORM" '
              .platforms[$platform] as $entry
              | ($entry | type) == "object"
                and ($entry.url | type) == "string"
                and ($entry.url | length) > 0
                and ($entry.signature | type) == "string"
                and ($entry.signature | length) > 0
            ' latest.json >/dev/null; then
              echo "latest.json is missing a complete $PLATFORM updater entry."
              exit 1
            fi
          done
          gh release view "$TAG" --json assets --jq '[.assets[] | .apiUrl, .url]' > release-asset-urls.json
          if ! jq -e --slurpfile assets release-asset-urls.json '
            all(.platforms[].url; . as $url | ($assets[0] | index($url)) != null)
          ' latest.json >/dev/null; then
            echo "latest.json references an updater asset that is not attached to $TAG."
            exit 1
          fi

          IS_PRERELEASE=false
          if [[ "$TAG" == *-* ]]; then
            IS_PRERELEASE=true
          fi
          gh release edit "$TAG" --draft=false --prerelease="$IS_PRERELEASE"

  # Roll the beta channel's manifest after every release. GitHub's `/latest/`
  # alias can't serve a pre-release, so the beta channel is a fixed `beta` release
  # holding a rolling latest.json at a stable URL
  # (releases/download/beta/latest.json). It runs for BOTH beta and stable tags so
  # testers can graduate: the manifest is set to the LAST-PUBLISHED release, not
  # the highest semver. Normal increasing-order releases keep it on the newest
  # build; a stable shipped after the last beta is offered to testers
  # (0.2.0 > 0.2.0-beta.x). The updater never downgrades, so an out-of-order lower
  # tag just leaves higher-pre-release testers unchanged until the next higher
  # release rolls it forward. See docs/release-channels.md. (GL-76)
  publish-beta-manifest:
    name: Roll the beta channel manifest
    needs: [preflight, publish-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Copy latest.json onto the rolling `beta` release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Validated to ^v…(-prerelease)? in preflight, so it's shell-safe; still
          # passed via env rather than inlined into the run script.
          TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          # Pull the manifest publish-release assembled for the versioned
          # release; its asset URLs point back at that release, so the copy on
          # `beta` keeps resolving to the right artifacts.
          gh release download "$TAG" --pattern latest.json --clobber
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta \
              --prerelease \
              --title "GitLane beta channel" \
              --notes "Rolling updater manifest for the beta channel. Artifacts live on the versioned releases — do not download from here."
          fi
          gh release upload beta latest.json --clobber

  rollback-beta-manifest:
    name: Restore the beta channel manifest
    if: github.event_name == 'workflow_dispatch' && inputs.manifest_only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Validate and copy an existing release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "Manifest-only rollback requires an explicit version tag."
            exit 1
          fi
          IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [[ "$IS_DRAFT" != "false" ]]; then
            echo "Manifest-only rollback requires an already-public release."
            exit 1
          fi

          rm -f latest.json
          gh release download "$TAG" --pattern latest.json
          MANIFEST_VERSION="${TAG#v}"
          jq -e --arg version "$MANIFEST_VERSION" '.version == $version' latest.json >/dev/null
          for PLATFORM in \
            darwin-aarch64 \
            darwin-x86_64 \
            linux-x86_64 \
            windows-x86_64
          do
            if ! jq -e --arg platform "$PLATFORM" '
              .platforms[$platform] as $entry
              | ($entry | type) == "object"
                and ($entry.url | type) == "string"
                and ($entry.url | length) > 0
                and ($entry.signature | type) == "string"
                and ($entry.signature | length) > 0
            ' latest.json >/dev/null; then
              echo "latest.json is missing a complete $PLATFORM updater entry."
              exit 1
            fi
          done
          gh release view "$TAG" --json assets --jq '[.assets[] | .apiUrl, .url]' > release-asset-urls.json
          if ! jq -e --slurpfile assets release-asset-urls.json '
            all(.platforms[].url; . as $url | ($assets[0] | index($url)) != null)
          ' latest.json >/dev/null; then
            echo "latest.json references an updater asset that is not attached to $TAG."
            exit 1
          fi

          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta \
              --prerelease \
              --title "GitLane beta channel" \
              --notes "Rolling updater manifest for the beta channel. Artifacts live on the versioned releases — do not download from here."
          fi
          gh release upload beta latest.json --clobber
