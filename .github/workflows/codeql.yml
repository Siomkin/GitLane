name: CodeQL

# Advanced setup replacing GitHub's default CodeQL setup, which re-analysed every
# language from scratch on every push (Rust alone ~7 min) and never cancelled a
# superseded PR run. Default setup must be switched off (Settings -> Code
# security -> CodeQL analysis) once this lands: code scanning rejects uploads from
# an advanced workflow while default setup is enabled.

on:
  push:
    branches: [latest]
  pull_request:
    branches: [latest]
  # Query packs update without a repository change; keep a full weekly scan.
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

concurrency:
  # Scheduled and manual scans get their own lanes and always finish. A newer
  # push to latest cancels the older push's scan: the newer commit contains it.
  group: codeql-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  changes:
    name: Pick languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            actions:
              - '.github/**'
            javascript-typescript:
              - 'src/**'
              - 'docs-site/**'
              - '*.ts'
              - '*.js'
              - 'package.json'
              - 'bun.lock'
            workflow:
              - '.github/workflows/codeql.yml'

      # PRs scan only the languages they touch; every other event scans all three.
      # Rust is never scanned on PRs: at ~7 min it was the slowest check on every
      # Rust PR. Pushes to latest and the weekly schedule still scan it, so Rust
      # findings land after merge. The PR therefore has no "Analyze (rust)" job at
      # all (not a skipped one) — it must not be a required check.
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          ACTIONS: ${{ steps.filter.outputs.actions }}
          JS: ${{ steps.filter.outputs.javascript-typescript }}
          WORKFLOW: ${{ steps.filter.outputs.workflow }}
        run: |
          langs=()
          all=false
          [[ "$EVENT" != pull_request || "$WORKFLOW" == true ]] && all=true
          [[ "$all" == true || "$ACTIONS" == true ]] && langs+=('"actions"')
          [[ "$all" == true || "$JS" == true ]] && langs+=('"javascript-typescript"')
          [[ "$EVENT" != pull_request ]] && langs+=('"rust"')
          echo "languages=[$(IFS=,; echo "${langs[*]}")]" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    # GitHub-hosted only: this runs PR code, so it must never reach a self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
