name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Auto-label PR
    # Configure TRUSTED_CI_USER under Settings -> Secrets and variables -> Actions
    # -> Variables. Both the PR opener and event actor must match it to use the
    # persistent runner; everyone else stays GitHub-hosted.
    runs-on: ${{ fromJSON((github.event.pull_request.user.login != vars.TRUSTED_CI_USER || github.actor != vars.TRUSTED_CI_USER) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64"]') }}
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
