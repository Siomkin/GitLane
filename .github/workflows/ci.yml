name: CI

on:
  push:
    branches: [latest]
  pull_request:
    branches: [latest]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changed areas
    # All Linux CI runs on the self-hosted, network-isolated `linux-gitlane` host to
    # save GitHub-hosted minutes. When the repo goes public, gate fork PRs behind
    # "Require approval for all external contributors" (Settings → Actions → General)
    # so untrusted code can't auto-run on the box.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # `rust` gates cargo test, which doesn't consume src/** at all — a
          # frontend-only PR must not pay for a Rust compile (see rust-tests' `if`).
          filters: |
            frontend:
              - 'src/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'tsconfig*.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            rust:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'

  # PRs + latest: fast frontend gate when frontend/package/CI inputs changed.
  frontend:
    name: Frontend (typecheck + build + tests)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (eslint — architecture import boundaries)
        run: bun run lint

      - name: Build frontend (tsc --noEmit + vite build)
        run: bun run build

      - name: Frontend tests
        run: bun run test -- --run

  # Full Rust/Tauri test suite whenever Rust-side inputs changed — on PRs and on
  # pushes to latest alike. CI stops at tests: app bundles are a release concern,
  # built and signed only by release.yml when a v* tag is pushed.
  rust-tests:
    name: Rust tests (linux)
    # Only when Rust-side inputs changed — a frontend-only PR skips the Rust
    # compile entirely.
    if: >
      always() &&
      needs.changes.outputs.rust == 'true' &&
      needs.frontend.result != 'failure' &&
      needs.frontend.result != 'cancelled'
    needs: [changes, frontend]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Self-hosted: compile into a persistent target dir on the box instead of the
      # GitHub cache API. actions/checkout wipes the workspace (git clean -ffdx)
      # every run, and rust-cache round-trips ~700 MB archives over the network even
      # on a hit — with a persistent dir only changed crates recompile, at zero
      # transfer cost. ~/.cargo (registry downloads) already persists via $HOME.
      # If the box's disk fills up, just delete this dir; cargo rebuilds it.
      - name: Use persistent cargo target dir (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          echo "CARGO_TARGET_DIR=$HOME/.cache/gitlane-ci/target" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

      - name: Cache Rust build (github-hosted fallback)
        if: runner.environment == 'github-hosted'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux Tauri dependencies
        # Skipped on the self-hosted runner (sudo-less user; deps preinstalled on the
        # host). runner.environment keeps this working if a job ever runs hosted.
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
