name: CI

on:
  push:
    branches: [develop, staging, latest]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            desktop:
              - 'src/**'
              - 'src-tauri/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'tsconfig*.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'

  # PRs + every branch: fast frontend gate when frontend/package/CI inputs changed.
  frontend:
    name: Frontend (typecheck + build + tests)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend (tsc --noEmit + vite build)
        run: bun run build

      - name: Frontend tests
        run: bun run test -- --run

  # staging/latest only: ONE Linux job that compiles once (debug), runs the full
  # Rust/Tauri test suite, then bundles the desktop app from the SAME target dir —
  # so the bundle reuses the test compile instead of recompiling from scratch
  # (cargo test and `tauri build --debug` share target/debug deps).
  #
  # The bundle is UNSIGNED here: tauri.ci.conf.json disables createUpdaterArtifacts,
  # so no TAURI_SIGNING_* secrets are needed. That's deliberate — updater signing is
  # a release concern (release.yml owns it), and it keeps this check building on
  # fork PRs, where GitHub withholds repo secrets.
  desktop-linux-check:
    name: Desktop build + tests (linux)
    if: >
      always() &&
      (github.ref == 'refs/heads/staging' || github.base_ref == 'staging' ||
      github.ref == 'refs/heads/latest' || github.base_ref == 'latest') &&
      needs.changes.outputs.desktop == 'true' &&
      needs.frontend.result != 'failure' &&
      needs.frontend.result != 'cancelled'
    needs: [changes, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: oven-sh/setup-bun@v2

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # Debug bundle, reusing the test compile (same target/debug). The CI config
      # override disables updater-artifact signing, so no signing key is needed —
      # real signed bundles + latest.json come from release.yml.
      - name: Build app bundle (debug, unsigned)
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: bun tauri
          args: --debug --config src-tauri/tauri.ci.conf.json

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: GitLane-linux-debug-bundle
          path: |
            src-tauri/target/debug/bundle/deb/*.deb
            src-tauri/target/debug/bundle/appimage/*.AppImage
            src-tauri/target/debug/bundle/rpm/*.rpm
          if-no-files-found: error
