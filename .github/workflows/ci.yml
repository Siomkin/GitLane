name: CI

on:
  push:
    branches: [develop, staging, latest]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Frontend-only gate for this phase: typecheck + build + unit/render tests.
  # The Rust/Tauri compile and the desktop bundle build are intentionally left
  # out of PR/develop CI (too slow, not needed yet) — release.yml still builds
  # the full desktop bundle on v* tags.
  frontend:
    name: Frontend (typecheck + build + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend (tsc --noEmit + vite build)
        run: bun run build

      - name: Frontend tests
        run: bun run test -- --run
