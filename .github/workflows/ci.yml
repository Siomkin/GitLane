name: CI

on:
  push:
    branches: [develop, staging, latest]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Always (PRs + every branch): fast frontend gate — typecheck + build + tests.
  frontend:
    name: Frontend (typecheck + build + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend (tsc --noEmit + vite build)
        run: bun run build

      - name: Frontend tests
        run: bun run test -- --run

  # staging/latest only: the full Rust/Tauri test suite. Skipped on develop and
  # ordinary PRs (too slow for this phase); the frontend job covers those.
  rust-tests:
    name: Rust tests
    if: github.ref == 'refs/heads/staging' || github.base_ref == 'staging' || github.ref == 'refs/heads/latest' || github.base_ref == 'latest'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  # staging/latest only: build the desktop bundle as a promotion sanity check.
  desktop-app-build:
    name: Desktop app build (${{ matrix.name }})
    if: github.ref == 'refs/heads/staging' || github.base_ref == 'staging' || github.ref == 'refs/heads/latest' || github.base_ref == 'latest'
    needs: [frontend, rust-tests]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-24.04
            args: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: oven-sh/setup-bun@v2

      - name: Install Linux Tauri dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Mirror release.yml's preflight: createUpdaterArtifacts signs the bundle, so
      # a missing key/password (e.g. fork PRs, where GitHub withholds repo secrets)
      # would otherwise fail deep in minisign instead of here with a clear message.
      - name: Validate updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" || -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "This promotion build signs updater artifacts, but TAURI_SIGNING_PRIVATE_KEY / _PASSWORD are not set."
            echo "Repository secrets are unavailable in this context (e.g. a fork PR). Run from a branch with secrets — see GL-24."
            exit 1
          fi

      - name: Build app artifact
        uses: tauri-apps/tauri-action@v0
        env:
          # bundle.createUpdaterArtifacts=true makes the bundler sign the update
          # package, so this promotion sanity build needs the updater signing key
          # too (same secrets as release.yml). Without them the bundle step fails.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: GitLane-${{ matrix.name }}-[bundle]
