name: CI

on:
  push:
    branches: [latest]
  # Manual runs by writers (dispatch needs write access): post-merge smoke
  # tests, and producing the required status checks on workflow-bootstrap PRs
  # that swap their own triggers (neither trigger side fires on such PRs).
  #
  # A dispatched run's check runs land on the commit but NOT in any pull
  # request's rollup — GitHub associates a workflow_dispatch run with a ref, not
  # a PR — so `gh pr checks` keeps reporting the PR as missing them. Use it to
  # verify a commit, not to satisfy a PR gate.
  workflow_dispatch:
  # Dependency advisories can appear without a repository change. Re-scan the
  # current lockfiles weekly so the gate does not depend only on PR activity.
  schedule:
    - cron: "17 4 * * 1"
  # Base-branch workflow controls runner selection; see the checkout refs below.
  #
  # `branches` filters on the PR's base. A stacked pull request targets the layer
  # below it, not `latest` — but once it is a member of a stack GitHub resolves
  # the base through the stack, so stack members DO match this filter and run CI
  # normally.
  #
  # The gap is the ordering: a PR exists before it joins a stack, so its `opened`
  # event is evaluated against the intermediate base and skipped. Nothing fires
  # again until the next PR event, which is why a freshly opened top layer can sit
  # with no CI while every layer below it is green. Add the branch to the stack
  # *before* opening its PR (what `gh stack submit` does), or reopen the PR
  # afterwards to re-trigger. A dispatched run does not fill this in — see the
  # workflow_dispatch note above.
  pull_request_target:
    branches: [latest]

concurrency:
  # Weekly audits are their own non-canceling lane: a docs-only push to latest
  # must neither share their group nor terminate the only run that scans deps.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled-audit' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

# Fork PRs do NOT build here: actions/checkout v7 refuses to check out
# refs/pull/N/merge when the head repo differs from the base repo, so
# pr-checkout fails closed on a fork and its jobs never reach a build step.
# Same-repo PRs are exempt from that guard and are what this workflow actually
# runs. Restoring fork CI is a deliberate opt-in — `allow-unsafe-pr-checkout:
# true` on the checkout in .github/actions/pr-checkout — not something to flip
# to make a red fork PR go green.
#
# Own-repo PR code is still untrusted-ish (the merge ref is built and tested
# under pull_request_target with no approval gate), and the opt-in above would
# make that literally true for forks. Both are only safe while the token stays
# read-only and this file references no secrets. Never add `secrets.*` or write
# permissions here.
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changed areas
    # Configure TRUSTED_CI_USER under Settings -> Secrets and variables -> Actions
    # -> Variables. Its value is the one GitHub login allowed to run PR CI here.
    # If it is unset or mismatched, all PRs safely fall back to GitHub-hosted.
    # Both the PR opener and the event actor (for example, the commit pusher on
    # synchronize) must be `vars.TRUSTED_CI_USER` to use the persistent runner.
    # Every other PR is contributor-controlled code and must stay GitHub-hosted.
    # Pushes to `latest` use the trusted, base-branch workflow and remain self-hosted.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request_target' && (github.event.pull_request.user.login != vars.TRUSTED_CI_USER || github.actor != vars.TRUSTED_CI_USER) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      security: ${{ github.event_name == 'schedule' && 'true' || steps.filter.outputs.security }}
      # The policy above, exported once so the downstream jobs cannot drift.
      runner: ${{ github.event_name == 'pull_request_target' && (github.event.pull_request.user.login != vars.TRUSTED_CI_USER || github.actor != vars.TRUSTED_CI_USER) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64"]' }}
      # The same trust decision as a plain boolean. The macOS lane runs on a
      # self-hosted box with no GitHub-hosted fallback, so it must never be
      # offered contributor-controlled code — it is gated on this, not on
      # `runner`.
      trusted: ${{ github.event_name != 'pull_request_target' || (github.event.pull_request.user.login == vars.TRUSTED_CI_USER && github.actor == vars.TRUSTED_CI_USER) }}
    steps:
      # On PR events paths-filter reads the changed-file list from the GitHub
      # API, so the mutable merge ref is never checked out in this job — only
      # push events need the repo on disk to diff against the base.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        if: github.event_name != 'pull_request_target'
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name != 'schedule'
        with:
          # `rust` gates cargo test, which doesn't consume src/** at all — a
          # frontend-only PR must not pay for a Rust compile (see rust-tests' `if`).
          filters: |
            frontend:
              - 'src/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'tsconfig*.json'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/pr-checkout/**'
            rust:
              - 'src-tauri/**'
              - 'rust-toolchain*'
              - '.github/actions/setup-rust/**'
              - '.github/actions/pr-checkout/**'
              - '.github/workflows/ci.yml'
            security:
              - 'package.json'
              - 'bun.lock'
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/Cargo.lock'
              - 'src-tauri/.cargo/**'
              - 'rust-toolchain*'
              - 'SECURITY.md'
              - '.github/dependabot.yml'
              - '.github/actions/setup-rust/**'
              - '.github/actions/pr-checkout/**'
              - '.github/workflows/**'

  # The two audits are split by runner. `bun audit` POSTs the lockfile to
  # registry.npmjs.org's advisory bulk endpoint, which stalls or 503s from the
  # self-hosted egress (linux-gitlane and linux-gitlane-3 burn every retry)
  # while GitHub-hosted runners get an answer in seconds. That step is a
  # read-only 20s call with no cache, so it alone goes GitHub-hosted; the
  # Rust audit keeps the runner policy and the warm cargo-audit install.
  security-js:
    name: JavaScript dependency audit
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Local composites resolve against GITHUB_WORKSPACE, so the trusted
      # github.sha (the base on pull_request_target) must land first.
      # pr-checkout then re-checkouts the merge ref and TOCTOU-guards it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/pr-checkout

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # 1.2.20's audit client stalls on the npm advisory API ("Timeout:
          # audit request failed" after 5m). 1.4.0 returns in ~1s. Pin here so
          # pull_request_target PRs that have not bumped packageManager still
          # get a working auditor once this file is on latest.
          bun-version: "1.4.0"
          # Same reasoning as rust-cache's save-if in the `rust` job: a
          # pull_request_target run executes untrusted code and would write its
          # bun tool cache into the *base branch* scope, where trusted runs
          # restore it. Skip the cache entirely on those runs.
          no-cache: ${{ github.event_name == 'pull_request_target' }}

      - name: Audit JavaScript dependencies
        timeout-minutes: 8
        run: |
          bun --version
          # bun audit talks to registry.npmjs.org. 1.2.20 hung 5m; 1.4.0
          # still hangs or 503s. Cap each attempt so a stall cannot eat the
          # job, and retry only transport failures — not advisory findings.
          for attempt in 1 2 3 4 5; do
            set +e
            output="$(timeout --foreground 45 bun audit 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -eq 124 ] || printf '%s\n' "$output" | grep -Eq 'Timeout: audit request failed|advisories/bulk - 429|advisories/bulk - 50[234]'; then
              echo "bun audit hit a transient advisory-API error (attempt ${attempt}/5, exit ${status})"
              sleep $((attempt * 8))
              continue
            fi
            exit "$status"
          done
          echo "bun audit: advisory API still failing after 5 attempts"
          exit 1

  security:
    name: Dependency security audit
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Local composites resolve against GITHUB_WORKSPACE, so the trusted
      # github.sha (the base on pull_request_target) must land first.
      # pr-checkout then re-checkouts the merge ref and TOCTOU-guards it.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/pr-checkout

      - uses: ./.github/actions/setup-rust

      # Run the CLI from the Rust project root so src-tauri/.cargo/audit.toml
      # controls both advisory exceptions and the process exit status. The
      # direct command needs no Checks/Issues API writes, so the same read-only
      # job works for untrusted PRs, pushes, dispatches, and weekly schedules.
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Enforce Rust advisory policy
        working-directory: src-tauri
        run: cargo audit

  # The file-size ceiling covers both sides, so it can't ride the `frontend` job
  # — that one is gated on `src/**` and a Rust-only PR would skip the check
  # entirely. Which is the hole that let eight oversized Rust files sit
  # unmeasured. Its own job, gated on either side changing; the script is plain
  # node over `git ls-files`, so it needs a checkout and nothing else.
  sizes:
    name: File-size ceiling
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/pr-checkout

      - name: Enforce the file-size ratchet
        run: node scripts/check-file-sizes.mjs

  # PRs + latest: fast frontend gate when frontend/package/CI inputs changed.
  frontend:
    name: Frontend (typecheck + build + tests)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    # Runner policy is decided once in `changes` — see the comment there.
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/pr-checkout

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
          # Same reasoning as rust-cache's save-if in the `rust` job: a
          # pull_request_target run executes untrusted code and would write its
          # bun tool cache into the *base branch* scope, where trusted runs
          # restore it. Skip the cache entirely on those runs.
          no-cache: ${{ github.event_name == 'pull_request_target' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (eslint — architecture import boundaries)
        run: bun run lint

      - name: Build frontend (tsc --noEmit + vite build)
        run: bun run build

      - name: Frontend tests
        run: bun run test -- --run

  # Full Rust/Tauri test suite whenever Rust-side inputs changed — on PRs and on
  # pushes to latest alike. CI stops at tests: app bundles are a release concern,
  # built and signed only by release.yml when a v* tag is pushed.
  rust-tests:
    name: Rust tests (linux)
    # Only when Rust-side inputs changed — a frontend-only PR skips the Rust
    # compile entirely.
    if: >
      always() &&
      needs.changes.outputs.rust == 'true' &&
      needs.frontend.result != 'failure' &&
      needs.frontend.result != 'cancelled'
    needs: [changes, frontend]
    # Runner policy is decided once in `changes` — see the comment there.
    runs-on: ${{ fromJSON(needs.changes.outputs.runner) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/pr-checkout

      - name: Install Rust stable
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      # Self-hosted: compile into a persistent target dir on the box instead of the
      # GitHub cache API. actions/checkout wipes the workspace (git clean -ffdx)
      # every run, and rust-cache round-trips ~700 MB archives over the network even
      # on a hit — with a persistent dir only changed crates recompile, at zero
      # transfer cost. ~/.cargo (registry downloads) already persists via $HOME.
      # If the box's disk fills up, just delete this dir; cargo rebuilds it.
      - name: Use persistent cargo target dir (self-hosted)
        if: runner.environment == 'self-hosted'
        run: |
          echo "CARGO_TARGET_DIR=$HOME/.cache/gitlane-ci/target" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

      - name: Cache Rust build (github-hosted fallback)
        if: runner.environment == 'github-hosted'
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"
          # pull_request_target runs write caches into the *base branch* scope,
          # where they would outlive the untrusted run and could poison trusted
          # consumers. The only github-hosted runs are PRs that failed the trust
          # gate above (opener or actor != TRUSTED_CI_USER, or the var is unset),
          # so keep them restore-only.
          save-if: ${{ github.event_name != 'pull_request_target' }}

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Install Linux Tauri dependencies
        # Skipped on the self-hosted runner (sudo-less user; deps preinstalled on the
        # host). runner.environment keeps this working if a job ever runs hosted.
        #
        # `mold` is not optional here: src-tauri/.cargo/config.toml pins
        # `-fuse-ld=mold` for x86_64-unknown-linux-gnu, so without it every link
        # on a hosted runner dies with "collect2: fatal error: cannot find 'ld'".
        # Hosted runs are the untrusted-PR fallback (dependabot, forks), which is
        # why this only showed up on dependabot PRs.
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf mold

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Rust Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

  # macOS lane (GL: raise-command-test-coverage §4).
  #
  # GitLane's primary platform is macOS, but CI only ever ran Linux — so
  # `#[cfg(target_os = "macos")]` code (the lib.rs menu, shell.rs's opener, the
  # apple-native keyring) never executed under test. These jobs close that.
  #
  # Deliberately NOT required, for a reason worth knowing: the macOS ARM64
  # runners are started by hand on a developer Mac (see the release runbook),
  # so the label is offline most of the time. `continue-on-error: true` keeps a
  # failure — or an unavailable runner — from failing the run, and the short
  # timeout keeps a queued job from lingering. The trade-off is that while no
  # runner is online these checks sit pending on a PR rather than reporting;
  # they are not required checks, so a merge is never blocked by that. The
  # alternative was GitHub-hosted `macos-14`, which bills at 10x minutes.
  frontend-macos:
    name: Frontend (macos)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.trusted == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/pr-checkout

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
          no-cache: ${{ github.event_name == 'pull_request_target' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Typecheck + tests only: lint and the size ratchet are platform-neutral
      # and already run on Linux, so repeating them here would only cost time.
      - name: Build frontend (tsc --noEmit + vite build)
        run: bun run build

      - name: Frontend tests
        run: bun run test -- --run

  rust-tests-macos:
    name: Rust tests (macos)
    if: >
      always() &&
      needs.changes.outputs.rust == 'true' &&
      needs.changes.outputs.trusted == 'true'
    needs: [changes]
    runs-on: [self-hosted, macOS, ARM64]
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/pr-checkout

      - name: Install Rust stable
        uses: ./.github/actions/setup-rust

      # Same persistent-target-dir reasoning as the Linux job: checkout wipes the
      # workspace every run, and these boxes keep $HOME between runs.
      - name: Use persistent cargo target dir
        run: |
          echo "CARGO_TARGET_DIR=$HOME/.cache/gitlane-ci/target" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

      # No Tauri system-dependency step: those are Linux (webkit2gtk/gtk) only.
      # fmt and clippy are platform-neutral and stay on the Linux job; what this
      # lane exists for is running the tests themselves on macOS.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
