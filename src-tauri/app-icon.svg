<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a24"/>
      <stop offset="1" stop-color="#0a110e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.6">
      <stop offset="0" stop-color="#2f9e7e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2f9e7e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#glow)"/>
  <rect x="33.5" y="33.5" width="957" height="957" rx="222.5" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3"/>

  <!-- interlocking commit rings: gold (upper) over teal (lower) -->
  <g fill="none" stroke-linecap="round" stroke-width="70">
    <circle cx="600" cy="430" r="188" stroke="#f2b134"
            stroke-dasharray="860 322" transform="rotate(128 600 430)"/>
    <circle cx="438" cy="600" r="188" stroke="#36c9c0"
            stroke-dasharray="860 322" transform="rotate(-52 438 600)"/>
  </g>

  <!-- commit nodes -->
  <circle cx="600" cy="242" r="46" fill="#f2b134"/>
  <circle cx="512" cy="515" r="40" fill="#bfe9d6"/>
  <circle cx="438" cy="788" r="46" fill="#36c9c0"/>
</svg>
