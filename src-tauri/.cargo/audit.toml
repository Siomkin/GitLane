# Keep cargo-audit's complete default informational set explicit, then make new
# unsoundness reports fail CI with the one reviewed transitive exception below.
#
# The 16 `unmaintained` warnings below are accepted (not ignored — they still
# print) and were last reviewed against Tauri 2.11.5 / tauri-utils 2.9.3
# (chore-audit-cleanup). Recheck on every Tauri bump; they are all transitive
# through Tauri (GTK3 bindings on Linux, proc-macro-error, unic-* via
# urlpattern). Do not `ignore` them: a new unmaintained advisory must still
# surface. IDs:
#   RUSTSEC-2024-0411 gdkwayland-sys
#   RUSTSEC-2024-0412 gdk
#   RUSTSEC-2024-0413 atk
#   RUSTSEC-2024-0414 gdkx11-sys
#   RUSTSEC-2024-0415 gtk
#   RUSTSEC-2024-0416 atk-sys
#   RUSTSEC-2024-0417 gdkx11
#   RUSTSEC-2024-0418 gdk-sys
#   RUSTSEC-2024-0419 gtk3-macros
#   RUSTSEC-2024-0420 gtk-sys
#   RUSTSEC-2024-0370 proc-macro-error
#   RUSTSEC-2025-0075 unic-char-range
#   RUSTSEC-2025-0080 unic-common
#   RUSTSEC-2025-0081 unic-char-property
#   RUSTSEC-2025-0098 unic-ucd-version
#   RUSTSEC-2025-0100 unic-ucd-ident
[advisories]
informational_warnings = ["unmaintained", "unsound", "notice"]
ignore = [
  # glib 0.18.5: VariantStrIter's Iterator implementations are unsound
  # (RUSTSEC-2024-0429). This is in Tauri's Linux-only GTK3/WebKit dependency
  # chain; GitLane does not call VariantStrIter. There is no patched GTK3 line,
  # so removal depends on Tauri moving its Linux runtime off this chain. Recheck
  # on every Tauri upgrade and remove this exception as soon as the crate leaves
  # Cargo.lock.
  "RUSTSEC-2024-0429",
]

[output]
deny = ["unsound"]
format = "terminal"
quiet = false
show_tree = true
