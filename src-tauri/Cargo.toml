[package]
name = "gitlane"
version = "0.1.0"
description = "GitLane — a visual git client"
authors = ["Siomkin Alexander <siomkin.alexander@gmail.com>"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitlane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "GitLane"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Persists the main window's size + position across launches.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local repo reads (log/refs/diff). Network features (ssh/https) are disabled —
# all write operations shell out to the real `git` binary instead.
git2 = { version = "0.21", default-features = false }
notify = "8.2.0"
# Pseudo-terminal for the in-app integrated terminal (xterm.js frontend).
portable-pty = "0.9"
# Tokenizes a user-configured agent command (honoring quotes) so the executable
# can be extracted and PATH-probed without shell interpolation. See terminal_agents.rs.
shell-words = "1"
