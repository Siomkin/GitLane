[package]
name = "gitlane"
version = "1.4.0"
description = "GitLane — a visual git client"
authors = ["Siomkin Alexander <siomkin.alexander@gmail.com>"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitlane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "GitLane"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "gitlane-agent"
path = "src/bin/gitlane-agent.rs"
required-features = ["agent"]

# `desktop` is the app. `agent` builds the headless git core that runs on a
# remote host over SSH (remote-ssh-repos): no Tauri, no keychain, no PTY, so
# `cargo check --no-default-features --features agent` must stay green.
[features]
default = ["desktop"]
desktop = [
  "dep:tauri-build",
  "dep:tauri",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-window-state",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-process",
  "dep:keyring",
  "dep:portable-pty",
  "dep:minisign-verify",
]
agent = []

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
# Persists the main window's size + position across launches.
tauri-plugin-window-state = { version = "2", optional = true }
# In-app updates: checks GitHub Releases for a newer signed build, downloads and
# installs it, then relaunches via the process plugin. Updater artifacts are
# signed with the Tauri updater (minisign) key — separate from Apple signing.
# Default features minus `zip`: it only unpacks zipped Windows payloads and
# compressed AppImages, which GitLane does not publish (nsis .exe, plain
# .AppImage, .app.tar.gz via the always-on macOS tar), and its zip 4.x carries
# RUSTSEC-2026-0367/0368/0369. Re-add it only if those artifact formats return.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"], optional = true }
tauri-plugin-process = { version = "2", optional = true }
# `commands::blocking` runs on tokio directly when Tauri's runtime is absent
# (the `agent` build). Already in the lockfile through Tauri.
tokio = { version = "1", features = ["rt", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Derives `Display`/`Error` for the internal error enums that convert into the
# one IPC boundary error (`git::types::CommandError`). Proc-macro only — no
# runtime, native, JS, capability, or CSP footprint (docs/tauri-plugin-decisions.md).
thiserror = "2"
# Local repo reads (log/refs/diff). Network features (ssh/https) are disabled —
# all write operations shell out to the real `git` binary instead.
git2 = { version = "0.21", default-features = false }
regex = "1"
# Base64-encodes binary blob bytes (image previews) for transport over IPC.
base64 = "0.23"
# Compresses large agent protocol frames (remote-ssh-repos D5). Pure-Rust
# miniz_oxide backend; already in the lockfile through Tauri.
flate2 = "1"
# Verifies the remote agent download with the updater's minisign key
# (remote-ssh-repos D7). Already in the lockfile through the updater plugin.
minisign-verify = { version = "0.3", optional = true }
notify = "8.2.0"
# Pseudo-terminal for the in-app integrated terminal (xterm.js frontend).
portable-pty = { version = "0.9", optional = true }
# Tokenizes a user-configured agent command (honoring quotes) so the executable
# can be extracted and PATH-probed without shell interpolation. See terminal_agents.rs.
shell-words = "1"
# Capability-based worktree access. File viewer/editor IPC paths are opened
# relative to directory handles, with every component and final target refusing
# symlinks, so a repository cannot redirect reads or writes outside its root.
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"

# Native provider OAuth sign-in for GitLab/Bitbucket (GL-139) — the backend's
# first outbound-HTTP dependency, confined to `git/oauth/http.rs` behind an
# `HttpTransport` trait so the flow state machines unit-test against a mock.
# `ureq` is blocking (fits the existing `blocking()` subprocess pattern), pulls a
# small tree, and uses rustls so we never link a system TLS library. `sha2` +
# `getrandom` back the PKCE code-verifier/challenge and the CSRF `state`; sha2
# also fingerprints file-discard preconditions without retaining content, and
# base64 (above) provides the compact opaque encodings.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
getrandom = "0.4"
# Atomic no-replace rename for publishing a completed clone without overwriting
# a destination created concurrently. Windows' std rename already fails when the
# destination exists; Unix needs renameat2/renamex_np flags.
rustix = { version = "1.1", default-features = false, features = ["fs"] }

# OS-native secret storage for GitLane-owned provider transport tokens (GL-132).
# Secrets live only in the platform keychain — never in IPC, localStorage, repo
# config, command args, or logs. keyring 4.x selects the store via the `v1`
# feature (Keychain / Credential Manager / zbus Secret Service); the unused
# platform crates are target-gated inside keyring so they do not link here.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1"], optional = true }
# ShellExecuteW for opening worktree paths with the OS default app without
# routing through `cmd.exe` (which would interpret `&`/`|` in filenames).
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4", default-features = false, features = ["v1"], optional = true }

# `killpg` for the process-group watchdog in `shell/timed.rs` — the `kill`
# binary misparsed `-<pgid>` as `-1` on hosted Ubuntu. Already in the lockfile.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `tauri::test::mock_builder` boots the real `generate_handler!` list against a
# headless MockRuntime, so state-bound commands (watcher, PTY, OAuth cancel) and
# the `AppHandle`-keyed settings files (`acp_agents`, `terminal_agents`) can be
# invoked in tests instead of only being registration-checked. Dev-only: the
# `test` feature never reaches a shipped build.
# The remote agent's release build (remote-ssh-repos): size over speed, since
# it is uploaded to every host once per version (S2: about 28% smaller).
[profile.agent]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
